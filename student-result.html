<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتیجه آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}button{padding:10px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}input{padding:10px;border:1px solid #ddd;border-radius:8px;width:min(100%,330px);box-sizing:border-box}</style></head><body><main class="wrap"><section class="card"><h1>نتیجه آزمون</h1><p class="muted">برای حفظ محرمانگی، نتیجه با شناسه نتیجه و کد دانش‌آموزی بررسی می‌شود.</p><input id="id" placeholder="شناسه Attempt"><input id="code" placeholder="کد دانش‌آموزی"><br><button id="load">نمایش نتیجه</button><p id="msg" class="muted"></p></section><section id="summary" class="card" hidden><div class="grid"><div><div class="stat" id="pct">—</div><div class="muted">درصد</div></div><div><div class="stat" id="correct">—</div><div class="muted">صحیح</div></div><div><div class="stat" id="wrong">—</div><div class="muted">غلط</div></div><div><div class="stat" id="blank">—</div><div class="muted">نزده</div></div></div><p id="student"></p><p id="exam"></p></section><section id="detail" class="card" hidden><h2>جزئیات پاسخ‌ها</h2><table><thead><tr><th>سؤال</th><th>پاسخ</th><th>نتیجه</th><th>نمره</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=$('id').value.trim(),code=$('code').value.trim();if(!id||!code){$('msg').className='err';$('msg').textContent='هر دو مقدار لازم است.';return}$('load').disabled=true;try{const a=await sb.from('v5_attempts').select('id,student_id,exam_id,correct_count,wrong_count,blank_count,percentage,status').eq('id',id).single();if(a.error)throw new Error('نتیجه پیدا نشد.');const st=await sb.from('v5_students').select('full_name,student_code').eq('id',a.data.student_id).eq('student_code',code).single();if(st.error)throw new Error('اطلاعات دانش‌آموز با این نتیجه مطابقت ندارد.');const ex=await sb.from('v5_exams').select('title,exam_code').eq('id',a.data.exam_id).single();if(ex.error)throw ex.error;const r=await sb.from('v5_attempt_answer_report_view').select('question_order,question_text,answer_text,is_correct,score_awarded').eq('attempt_id',id).order('question_order');if(r.error)throw r.error;$('pct').textContent=Number(a.data.percentage||0).toFixed(2)+'%';$('correct').textContent=a.data.correct_count??0;$('wrong').textContent=a.data.wrong_count??0;$('blank').textContent=a.data.blank_count??0;$('student').textContent='دانش‌آموز: '+esc(st.data.full_name);$('exam').textContent='آزمون: '+esc(ex.data.title)+' — '+esc(ex.data.exam_code);$('rows').innerHTML=(r.data||[]).map(x=>'<tr><td>'+esc(x.question_order)+'. '+esc(x.question_text)+'</td><td>'+esc(x.answer_text||'نزده')+'</td><td class="'+(x.is_correct?'ok':'err')+'">'+(x.is_correct?'صحیح':'غلط / نزده')+'</td><td>'+esc(x.score_awarded)+'</td></tr>').join('');$('summary').hidden=false;$('detail').hidden=false;$('msg').className='ok';$('msg').textContent='نتیجه با موفقیت نمایش داده شد.'}catch(e){$('msg').className='err';$('msg').textContent=e.message||'خطا در دریافت نتیجه.'}finally{$('load').disabled=false}}$('load').onclick=load;const p=new URLSearchParams(location.search);if(p.get('attempt'))$('id').value=p.get('attempt');</script></main></body></html>
