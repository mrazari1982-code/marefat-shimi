<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;border-radius:18px;padding:24px;margin:20px 0;box-shadow:0 4px 18px #0001}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}button{padding:11px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.hidden{display:none}.err{color:#a21d2a}.ok{color:#176b3a}.muted{color:#667085}</style></head><body><div class="wrap"><header class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>ورود مدیر — نسخه V5</p></header><section id="login" class="card"><h2>ورود مدیر</h2><p id="loginMsg">ایمیل و رمز عبور مدیر را وارد کنید.</p><label>ایمیل</label><input id="email" type="email" autocomplete="username" required><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="button">ورود</button></section><section id="dashboard" class="card hidden"><h2>پنل مدیر باز شد ✅</h2><p id="userInfo"></p><p class="ok">ورود مدیر با موفقیت انجام شد.</p><button id="logoutBtn" type="button">خروج</button></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const errText=e=>e?.message||e?.error_description||String(e||'خطای نامشخص');async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('loginMsg').className='err';$('loginMsg').textContent='ایمیل و رمز عبور را وارد کنید.';return}$('loginBtn').disabled=true;$('loginMsg').className='muted';$('loginMsg').textContent='در حال ورود...';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const staff=await sb.rpc('v5_is_staff');if(staff.error)throw staff.error;if(staff.data!==true){await sb.auth.signOut();throw new Error('این حساب دسترسی مدیر ندارد.')}$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('userInfo').textContent='حساب مدیر: '+(r.data.user?.email||email)}catch(e){$('loginMsg').className='err';$('loginMsg').textContent='ورود انجام نشد: '+errText(e);$('loginBtn').disabled=false}}async function restore(){try{const s=await sb.auth.getSession();if(!s.data.session)return;const staff=await sb.rpc('v5_is_staff');if(staff.data===true){$('login').classList.add('hidden');$('dashboard').classList.remove('hidden');$('userInfo').textContent='حساب مدیر: '+(s.data.session.user?.email||'')}}catch(e){console.error(e)}}$('loginBtn').addEventListener('click',login);$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logoutBtn').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});restore();</script></body></html>
