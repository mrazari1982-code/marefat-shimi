<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>گزارش کارنامه | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}table{width:100%;min-width:700px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.ok{font-weight:700;color:#176b3a}.bad{font-weight:700;color:#b42318}.muted{color:#667085}.err{color:#b42318}button{padding:10px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}.stat{font-size:24px;font-weight:800}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}h1{font-size:22px}h2{font-size:18px}}</style></head><body><div class="wrap"><div class="card"><h1>جزئیات کارنامه</h1><p id="msg" class="muted">در حال بررسی...</p><button id="back">بازگشت به پنل</button></div><section id="summary" class="card" hidden><div class="grid"><div><div class="stat" id="pct">—</div><div class="muted">درصد</div></div><div><div class="stat" id="correct">—</div><div class="muted">صحیح</div></div><div><div class="stat" id="wrong">—</div><div class="muted">غلط</div></div><div><div class="stat" id="blank">—</div><div class="muted">نزده</div></div></div><p id="student"></p><p id="exam"></p></section><section id="detail" class="card" hidden><h2>پاسخ‌های سؤال به سؤال</h2><div class="table-wrap"><table><thead><tr><th>سؤال</th><th>پاسخ دانش‌آموز</th><th>نتیجه</th><th>نمره</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){try{const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}const staff=await sb.rpc('v5_is_staff');if(staff.error||staff.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}const id=new URLSearchParams(location.search).get('attempt');if(!id){$('msg').className='err';$('msg').textContent='شناسه کارنامه مشخص نشده است.';return}const a=await sb.from('v5_attempts').select('id,student_id,exam_id,correct_count,wrong_count,blank_count,percentage,status').eq('id',id).single();if(a.error)throw a.error;const [st,ex,r]=await Promise.all([sb.from('v5_students').select('full_name,student_code').eq('id',a.data.student_id).single(),sb.from('v5_exams').select('title,exam_code').eq('id',a.data.exam_id).single(),sb.from('v5_attempt_answer_report_view').select('question_order,question_text,answer_text,is_correct,score_awarded').eq('attempt_id',id).order('question_order')]);if(st.error)throw st.error;if(ex.error)throw ex.error;if(r.error)throw r.error;$('msg').textContent='کارنامه با موفقیت بارگذاری شد.';$('summary').hidden=false;$('detail').hidden=false;$('pct').textContent=Number(a.data.percentage||0).toFixed(2)+'%';$('correct').textContent=a.data.correct_count??0;$('wrong').textContent=a.data.wrong_count??0;$('blank').textContent=a.data.blank_count??0;$('student').textContent='دانش‌آموز: '+esc(st.data.full_name)+' ('+esc(st.data.student_code)+')';$('exam').textContent='آزمون: '+esc(ex.data.title)+' — '+esc(ex.data.exam_code);$('rows').innerHTML=(r.data||[]).map(x=>'<tr><td>'+esc(x.question_order)+'. '+esc(x.question_text)+'</td><td>'+esc(x.answer_text||'نزده')+'</td><td class="'+(x.is_correct?'ok':'bad')+'">'+(x.is_correct?'صحیح':'غلط / نزده')+'</td><td>'+esc(x.score_awarded)+'</td></tr>').join('')}catch(e){$('msg').className='err';$('msg').textContent='بارگذاری کارنامه انجام نشد: '+(e.message||e)}}$('back').onclick=()=>location.href='admin-panel.html';init();</script></body></html>
