name: marefat_student_demo
description: Flutter student demo for Marefat Online Exam V5 staging.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: 2.17.2
  flutter_secure_storage: 9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/marefat_app_icon.jpg

flutter_launcher_icons:
  android: true
  image_path: assets/icon/marefat_app_icon.jpg
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/icon/marefat_app_icon.jpg
  min_sdk_android: 21
  web:
    generate: true
    image_path: assets/icon/marefat_app_icon.jpg
    background_color: "#FFFFFF"
    theme_color: "#E5252A"
