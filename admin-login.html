<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;margin:0}.wrap{max-width:680px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin-top:30px}input{width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #ddd;border-radius:10px}button{padding:12px 24px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:bold;cursor:pointer}.error{color:#b42318}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><h2>ورود مدیر</h2><p id="msg">ایمیل و رمز عبور مدیر را وارد کنید.</p><div id="form"><label>ایمیل</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="login">ورود</button></div><div id="panel" class="hidden"><h2>پنل مدیر باز شد ✅</h2><p id="user"></p><button id="logout">خروج</button></div></div></div><script>const sb=supabase.createClient('https://rbqblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function login(){const email=$('email').value.trim(),password=$('password').value;$('login').disabled=true;$('msg').textContent='در حال ورود...';try{const {data,error}=await sb.auth.signInWithPassword({email,password});if(error)throw error;const {data:staff,error:staffError}=await sb.rpc('v5_is_staff');if(staffError)throw staffError;if(staff!==true)throw new Error('این حساب دسترسی مدیر ندارد.');$('form').classList.add('hidden');$('panel').classList.remove('hidden');$('user').textContent='حساب: '+data.user.email}catch(e){$('msg').className='error';$('msg').textContent='ورود انجام نشد: '+(e.message||e);$('login').disabled=false}}$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></body></html>
