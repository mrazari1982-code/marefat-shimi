<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بانک سؤال | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center}.input,.filters select{padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.input{width:100%}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#667085}.danger{background:#b42318}.muted{color:#667085}.err{color:#b42318}.ok{color:#176b3a}.warn{color:#8a5a00;background:#fff8df;padding:10px;border-radius:9px}.stat{font-size:24px;font-weight:800}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1000px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8fafc}.opts{margin:6px 0}.opt{padding:6px;margin:4px 0;border-radius:7px;background:#f7f8fa}.new-badge{display:inline-block;background:#fff3b0;color:#8a5a00;border:1px solid #e5c84a;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;margin-left:7px}.form-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:10px}.option-row{display:grid;grid-template-columns:55px 1fr 90px;gap:8px;align-items:center;margin:7px 0}.option-row input[type=text]{padding:9px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}.actions{white-space:nowrap}@media(max-width:700px){.wrap{padding:10px}.form-grid{grid-template-columns:1fr}.option-row{grid-template-columns:40px 1fr 75px}.stat{font-size:20px}}</style></head><body><div class="wrap"><header class="card"><div class="filters"><div style="flex:1"><h1 style="margin:0">بانک سؤال V5</h1><p id="who" class="muted">در حال بررسی نشست...</p></div><a class="secondary" href="admin.html">بازگشت به پنل</a></div></header><section id="app" style="display:none"><div class="card"><h2 id="formTitle">افزودن سؤال جدید</h2><div class="form-grid"><select id="formSubject" class="input"></select><input id="formText" class="input" placeholder="متن سؤال"><select id="formDifficulty" class="input"><option value="easy">آسان</option><option value="medium" selected>متوسط</option><option value="hard">سخت</option></select><input id="formScore" class="input" type="number" min="0" step="0.25" value="1" placeholder="امتیاز"></div><div style="margin-top:10px"><select id="formTopic" class="input"><option value="">بدون موضوع</option></select></div><h3>گزینه‌ها (دقیقاً یک گزینه صحیح)</h3><div id="options"></div><div class="filters"><button id="saveQuestion">ثبت سؤال</button><button id="cancelEdit" class="secondary" style="display:none">لغو ویرایش</button></div><div id="formMsg" class="muted" style="margin-top:10px"></div></div><div class="card"><div class="grid"><div><div class="stat" id="count">—</div><div class="muted">تعداد سؤال‌های بانک</div></div><div><div class="stat" id="shown">—</div><div class="muted">نمایش فعلی</div></div></div><div class="filters" style="margin-top:12px"><input id="search" class="input" style="max-width:480px" placeholder="جست‌وجو در متن سؤال"><select id="subject"><option value="">همه درس‌ها</option></select><select id="difficulty"><option value="">همه سطوح</option></select><button id="reload" class="secondary">به‌روزرسانی</button></div><p id="msg" class="muted">در حال بارگذاری...</p><div class="table-wrap"><table><thead><tr><th>سؤال</th><th>درس</th><th>پایه</th><th>سختی</th><th>گزینه‌ها</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></div></div></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[],subjects=[],topics=[],editingId=null;function formMsg(t,c='muted'){$('formMsg').className=c;$('formMsg').textContent=t}function renderOptions(opts=[]){const arr=opts.length?opts:[{option_key:'A',option_text:'',is_correct:false},{option_key:'B',option_text:'',is_correct:false},{option_key:'C',option_text:'',is_correct:false},{option_key:'D',option_text:'',is_correct:false}];$('options').innerHTML=arr.slice(0,4).map((o,i)=>'<div class="option-row"><b>گزینه '+String.fromCharCode(65+i)+'</b><input type="text" class="optText" value="'+esc(o.option_text||o.text||'')+'" placeholder="متن گزینه '+String.fromCharCode(65+i)+'"><label><input type="radio" name="correct" '+(o.is_correct?'checked':'')+'> صحیح</label></div>').join('')}async function auth(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return null}const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return null}return s.data.session}async function init(){const session=await auth();if(!session)return;$('who').textContent='مدیر: '+(session.user.email||'');$('app').style.display='block';const sr=await sb.from('v5_subjects').select('id,name,grade_id').eq('is_active',true).order('id');if(sr.error)throw sr.error;subjects=sr.data||[];$('formSubject').innerHTML=subjects.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');await loadTopics();renderOptions();await load()}async function loadTopics(){const r=await sb.from('v5_topics').select('id,subject_id,name').eq('is_active',true).order('sort_order');if(r.error){topics=[];$('formTopic').innerHTML='<option value="">بدون موضوع</option>';return}topics=r.data||[];const sid=Number($('formSubject').value);$('formTopic').innerHTML='<option value="">بدون موضوع</option>'+topics.filter(t=>Number(t.subject_id)===sid).map(t=>'<option value="'+t.id+'">'+esc(t.name)+'</option>').join('')}async function load(){const session=await auth();if(!session)return;const q=sb.from('v5_question_bank').select('id,subject_id,topic_id,question_text,question_type,difficulty,score,status,is_active,created_at,v5_subjects(name,grade_id),v5_topics(name),v5_question_bank_options(id,option_key,option_text,is_correct,sort_order)').order('created_at',{ascending:false}).limit(500);if($('search').value.trim())q.ilike('question_text','%'+$('search').value.trim()+'%');if($('subject').value)q.eq('subject_id',Number($('subject').value));if($('difficulty').value)q.eq('difficulty',$('difficulty').value);const r=await q;if(r.error){$('msg').className='err';$('msg').textContent='خطا در دریافت بانک سؤال: '+r.error.message;return}data=(r.data||[]).map(x=>({id:x.id,subject_id:x.subject_id,topic_id:x.topic_id,question_text:x.question_text,question_type:x.question_type,difficulty:x.difficulty,score:x.score,status:x.status,is_active:x.is_active,created_at:x.created_at,subject:x.v5_subjects?.name||'—',grade:x.v5_subjects?.grade_id||'—',topic:x.v5_topics?.name||'—',options:(x.v5_question_bank_options||[]).sort((a,b)=>(a.sort_order||0)-(b.sort_order||0))}));$('count').textContent=data.length;$('shown').textContent=data.length;fillFilters();render()}function fillFilters(){const old=$('subject').value;const vals=[...new Set(data.map(x=>x.subject).filter(Boolean))];$('subject').innerHTML='<option value="">همه درس‌ها</option>'+subjects.map(s=>'<option value="'+s.id+'">'+esc(s.name)+'</option>').join('');if(old)$('subject').value=old;const oldD=$('difficulty').value;$('difficulty').innerHTML='<option value="">همه سطوح</option><option value="easy">آسان</option><option value="medium">متوسط</option><option value="hard">سخت</option>';if(oldD)$('difficulty').value=oldD}function render(){ $('rows').innerHTML=data.length?data.map(x=>{const isNew=Array.isArray(x.question_text)&&x.question_text[0]==='['?false:String(x.question_text||'').startsWith('[جدید]');return '<tr><td>'+(isNew?'<span class="new-badge">جدید</span>':'')+esc(String(x.question_text||'').replace(/^\[جدید\]\s*/,''))+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.grade)+'</td><td>'+esc(x.difficulty)+'</td><td><div class="opts">'+x.options.map(o=>'<div class="opt"><b>'+esc(o.option_key||'')+'</b> '+esc(o.option_text||'')+(o.is_correct?' ✓':'')+'</div>').join('')+'</div></td><td class="actions"><button class="editBtn" data-id="'+x.id+'">ویرایش</button> <button class="toggleBtn secondary" data-id="'+x.id+'" data-active="'+x.is_active+'">'+(x.is_active?'غیرفعال':'فعال')+'</button></td></tr>'}).join(''):'<tr><td colspan="6" style="text-align:center;padding:30px">سؤالی مطابق فیلترها پیدا نشد.</td></tr>';document.querySelectorAll('.editBtn').forEach(b=>b.onclick=()=>editQuestion(Number(b.dataset.id)));document.querySelectorAll('.toggleBtn').forEach(b=>b.onclick=()=>toggleQuestion(Number(b.dataset.id),b.dataset.active==='true'))}function find(id){return data.find(x=>Number(x.id)===id)}async function editQuestion(id){const x=find(id);if(!x)return;editingId=id;$('formSubject').value=x.subject_id||subjects[0]?.id||'';$('formText').value=String(x.question_text||'').replace(/^\[جدید\]\s*/,'');$('formDifficulty').value=x.difficulty||'medium';$('formScore').value=x.score||1;await loadTopics();$('formTopic').value=x.topic_id||'';renderOptions(x.options);$('formTitle').textContent='ویرایش سؤال';$('saveQuestion').textContent='ذخیره تغییرات';$('cancelEdit').style.display='inline-block';formMsg('در حال ویرایش سؤال.','warn');window.scrollTo({top:0,behavior:'smooth'})}function cancelEdit(){$editingId=null;editingId=null;$('formTitle').textContent='افزودن سؤال جدید';$('formText').value='';$('formDifficulty').value='medium';$('formScore').value=1;$('formSubject').selectedIndex=0;loadTopics();renderOptions();$('saveQuestion').textContent='ثبت سؤال';$('cancelEdit').style.display='none';formMsg('')}async function saveQuestion(){try{const session=await auth();if(!session)return;const text=$('formText').value.trim(),sid=Number($('formSubject').value)||null,tid=Number($('formTopic').value)||null,diff=$('formDifficulty').value,score=Number($('formScore').value)||1,texts=[...document.querySelectorAll('.optText')].map(x=>x.value.trim()),radios=[...document.querySelectorAll('input[name="correct"]')],ci=radios.findIndex(x=>x.checked);if(!text)throw new Error('متن سؤال الزامی است.');if(texts.length!==4||texts.some(x=>!x))throw new Error('متن هر چهار گزینه الزامی است.');if(ci<0)throw new Error('دقیقاً یک گزینه را به‌عنوان صحیح انتخاب کنید.');const opts=texts.map((t,i)=>({option_key:String.fromCharCode(65+i),option_text:t,is_correct:i===ci,sort_order:i+1}));$('saveQuestion').disabled=true;if(editingId){const r=await sb.rpc('v5_admin_update_question_bank_question',{p_question_id:editingId,p_subject_id:sid,p_topic_id:tid,p_question_text:text,p_difficulty:diff,p_score:score,p_options:opts});if(r.error)throw r.error}else{const r=await sb.rpc('v5_admin_create_question_bank_question',{p_question_text:text,p_subject_id:sid,p_topic_id:tid,p_difficulty:diff,p_score:score,p_options:opts});if(r.error)throw r.error}formMsg(editingId?'سؤال با موفقیت ویرایش شد.':'سؤال جدید با موفقیت به بانک سؤال اضافه شد.','ok');cancelEdit();await load()}catch(e){formMsg('ذخیره انجام نشد: '+(e.message||e),'err')}finally{$('saveQuestion').disabled=false}}async function toggleQuestion(id,active){if(!confirm(active?'این سؤال غیرفعال شود؟':'این سؤال فعال شود؟'))return;const r=await sb.rpc('v5_admin_set_question_bank_active',{p_question_id:id,p_active:!active});if(r.error){$('msg').className='err';$('msg').textContent='عملیات انجام نشد: '+r.error.message;return}await load()}$('formSubject').onchange=loadTopics;$('saveQuestion').onclick=saveQuestion;$('cancelEdit').onclick=cancelEdit;$('reload').onclick=load;let timer;['search'].forEach(id=>$(id).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(load,300)}));$('subject').onchange=load;$('difficulty').onchange=load;init().catch(e=>{$('msg').className='err';$('msg').textContent='خطا: '+(e.message||e)});</script></body></html>
