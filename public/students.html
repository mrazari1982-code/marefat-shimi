<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت دانش‌آموزان | معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.input{padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.btn{padding:10px 14px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.secondary{background:#667085}.danger{background:#b42318}.ok{color:#176b3a;font-weight:700}.warn{color:#8a5a00;background:#fff8df;padding:10px;border-radius:9px}.err{color:#b42318}.muted{color:#667085}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-weight:700}.active{background:#e8f7ee;color:#176b3a}.inactive{background:#eee;color:#667085}.actions{white-space:nowrap}.empty{text-align:center;padding:30px}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 style="margin:0">مدیریت دانش‌آموزان</h1><p class="muted">افزودن، ویرایش و فعال/غیرفعال‌سازی دانش‌آموزان</p></div><a class="btn secondary" href="admin.html">آزمون‌ها</a></div></div><div class="card"><div class="toolbar"><input id="code" class="input" placeholder="کد دانش‌آموزی" autocomplete="off"><input id="name" class="input" placeholder="نام و نام خانوادگی"><button id="save" class="btn">افزودن دانش‌آموز</button><button id="cancel" class="btn secondary" style="display:none">لغو ویرایش</button></div><div id="formMsg" style="margin-top:10px"></div></div><div class="card"><div class="toolbar"><input id="search" class="input" style="flex:1;min-width:240px" placeholder="جستجو بر اساس نام یا کد"><strong id="count">۰ دانش‌آموز</strong><button id="refresh" class="btn secondary">به‌روزرسانی</button></div><div id="msg" class="warn" style="margin-top:12px">در حال بارگذاری...</div><div id="list" class="table"></div></div></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');let editing=null;const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]) )}function setMsg(t,c='warn'){ $('msg').className=c; $('msg').textContent=t}function formMsg(t,c='muted'){ $('formMsg').className=c; $('formMsg').textContent=t}async function auth(){const {data,error}=await sb.auth.getUser();if(error)throw error;if(!data.user)throw new Error('ابتدا وارد حساب مدیر شوید.');const {data:p,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',data.user.id).maybeSingle();if(pe)throw pe;if(!p?.is_active||!['admin','deputy'].includes(p.role))throw new Error('دسترسی مدیر/معاون مجاز نیست.');return p}async function load(){try{await auth();setMsg('در حال دریافت فهرست دانش‌آموزان...');const {data,error}=await sb.rpc('v5_admin_list_students',{p_search:$('search').value.trim()});if(error)throw error;const rows=data||[];$('count').textContent=rows.length+' دانش‌آموز';$('list').innerHTML=rows.length?'<table><thead><tr><th>کد</th><th>نام</th><th>وضعیت</th><th>تعداد تلاش</th><th>عملیات</th></tr></thead><tbody>'+rows.map(s=>'<tr><td><b>'+esc(s.student_code)+'</b></td><td>'+esc(s.full_name)+'</td><td><span class="badge '+(s.is_active?'active':'inactive')+'">'+(s.is_active?'فعال':'غیرفعال')+'</span></td><td>'+s.attempt_count+'</td><td class="actions"><button class="btn edit" data-id="'+s.id+'" data-code="'+esc(s.student_code)+'" data-name="'+esc(s.full_name)+'">ویرایش</button> <button class="btn '+(s.is_active?'danger':'secondary')+' toggle" data-id="'+s.id+'" data-active="'+s.is_active+'">'+(s.is_active?'غیرفعال کردن':'فعال کردن')+'</button></td></tr>').join('')+'</tbody></table>':'<div class="empty muted">دانش‌آموزی پیدا نشد.</div>';document.querySelectorAll('.edit').forEach(b=>b.onclick=()=>edit(Number(b.dataset.id),b.dataset.code,b.dataset.name));document.querySelectorAll('.toggle').forEach(b=>b.onclick=()=>toggle(Number(b.dataset.id),b.dataset.active==='true'));setMsg(rows.length?rows.length+' دانش‌آموز آماده است.':'فهرست دانش‌آموزان خالی است.','ok')}catch(e){setMsg('خطا: '+(e.message||e),'err')}}function edit(id,code,name){editing=id;$('code').value=code;$('name').value=name;$('save').textContent='ذخیره تغییرات';$('cancel').style.display='inline-block';formMsg('در حال ویرایش دانش‌آموز انتخاب‌شده.','warn');window.scrollTo({top:0,behavior:'smooth'})}function cancel(){editing=null;$('code').value='';$('name').value='';$('save').textContent='افزودن دانش‌آموز';$('cancel').style.display='none';formMsg('')}async function save(){try{await auth();const code=$('code').value.trim(),name=$('name').value.trim();if(!code||!name)throw new Error('کد و نام دانش‌آموز الزامی است.');$('save').disabled=true;if(editing){const {error}=await sb.rpc('v5_admin_update_student',{p_id:editing,p_student_code:code,p_full_name:name});if(error)throw error;formMsg('اطلاعات دانش‌آموز با موفقیت ویرایش شد.','ok')}else{const {error}=await sb.rpc('v5_admin_create_student',{p_student_code:code,p_full_name:name});if(error)throw error;formMsg('دانش‌آموز جدید با موفقیت اضافه شد.','ok')}cancel();await load()}catch(e){formMsg('ذخیره انجام نشد: '+(e.message||e),'err')}finally{$('save').disabled=false}}async function toggle(id,active){try{await auth();const action=active?'غیرفعال کردن':'فعال کردن';if(!confirm('دانش‌آموز '+action+' شود؟'))return;const {error}=await sb.rpc('v5_admin_set_student_active',{p_id:id,p_active:!active});if(error)throw error;setMsg(active?'دانش‌آموز غیرفعال شد.':'دانش‌آموز فعال شد.','ok');await load()}catch(e){setMsg('عملیات انجام نشد: '+(e.message||e),'err')}}$('save').onclick=save;$('cancel').onclick=cancel;$('refresh').onclick=load;$('search').oninput=()=>load();load();</script></body></html>
