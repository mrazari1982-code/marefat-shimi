<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:650px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin-top:40px;box-shadow:0 3px 16px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}button{padding:11px 20px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.err{color:#b42318}.muted{color:#667085}</style></head><body><div class="wrap"><section class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><h2>ورود مدیر</h2><p id="msg" class="muted">ایمیل و رمز عبور مدیر را وارد کنید.</p><label>ایمیل</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="login">ورود</button></section></div><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function go(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){$('msg').className='err';$('msg').textContent='ایمیل و رمز عبور را وارد کنید.';return}$('login').disabled=true;$('msg').className='muted';$('msg').textContent='در حال ورود...';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const s=await sb.rpc('v5_is_staff');if(s.error)throw s.error;if(s.data!==true){await sb.auth.signOut();throw new Error('این حساب دسترسی مدیر ندارد.')}location.href='admin-panel.html'}catch(e){$('msg').className='err';$('msg').textContent='ورود انجام نشد: '+(e.message||e);$('login').disabled=false}}$('login').onclick=go;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
