<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت چرخه آزمون | سامانه معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}.item{border:1px solid #e5e7eb;border-radius:12px;padding:14px}.muted{color:#667085}.ok{color:#176b3a}.err{color:#b42318}.btn{padding:9px 13px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:3px}.secondary{background:#667085}.warn{background:#9a6700}.danger{background:#b42318}input{padding:9px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box}select{padding:9px;border:1px solid #ddd;border-radius:8px;width:100%}.hidden{display:none}.link{word-break:break-all}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}</style></head><body><main class="wrap"><section class="card"><div class="toolbar"><h1 style="flex:1">مدیریت چرخه آزمون</h1><a class="btn secondary" href="admin-panel.html">پنل اصلی</a><button id="logout" class="btn danger">خروج</button></div><p id="who" class="muted">در حال بررسی نشست...</p><p id="msg" class="muted">در حال بارگذاری...</p></section><section id="app" class="card hidden"><label>آزمون</label><select id="exam"></select><div id="detail" style="margin-top:14px"></div></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const fmt=s=>s?new Date(s).toLocaleString('fa-IR'):'—';let exams=[];async function init(){const {data}=await sb.auth.getSession();if(!data.session){location.href='admin-login-v2.html';return}const {data:p,error}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',data.session.user.id).maybeSingle();if(error||!p||!p.is_active||!['admin','deputy'].includes(p.role)){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='کاربر: '+(p.full_name||data.session.user.email)+' | نقش: '+p.role;const r=await sb.from('v5_exams').select('id,exam_code,title,status,duration_minutes,start_at,end_at').order('created_at',{ascending:false});if(r.error)throw r.error;exams=r.data||[];$('exam').innerHTML=exams.map(e=>'<option value="'+e.id+'">'+esc(e.title)+' — '+esc(e.exam_code)+'</option>').join('');$('app').classList.remove('hidden');$('msg').textContent=exams.length+' آزمون یافت شد.';render();$('exam').onchange=render}function render(){const e=exams.find(x=>String(x.id)===$('exam').value);if(!e){$('detail').textContent='آزمونی وجود ندارد.';return}const isClosed=e.status==='closed';$('detail').innerHTML='<div class="row"><div class="item"><b>وضعیت</b><p>'+esc(e.status)+'</p><div class="toolbar">'+(e.status==='draft'?'<button class="btn" onclick="changeStatus('+e.id+',\'published\')">انتشار</button>':'')+(e.status==='published'?'<button class="btn warn" onclick="changeStatus('+e.id+',\'closed\')">بستن آزمون</button>':'')+(isClosed?'<button class="btn secondary" onclick="changeStatus('+e.id+',\'published\')">بازگشایی</button>':'')+'</div></div><div class="item"><b>زمان‌بندی</b><p>شروع: '+fmt(e.start_at)+'</p><p>پایان: '+fmt(e.end_at)+'</p><div class="row"><div><label>شروع جدید</label><input id="start" type="datetime-local"></div><div><label>پایان جدید</label><input id="end" type="datetime-local"></div></div><button class="btn" onclick="saveSchedule('+e.id+')" '+(isClosed?'disabled':'')+'>ذخیره زمان‌بندی</button></div><div class="item"><b>لینک آزمون</b><p id="linkStatus">در حال بررسی...</p></div></div>';loadLink(e)}async function loadLink(e){const r=await sb.from('v5_exam_links').select('token,is_active,expires_at').eq('exam_id',e.id).eq('is_active',true).order('created_at',{ascending:false}).limit(1).maybeSingle();if(r.error){$('linkStatus').textContent='خطا در دریافت لینک';return}if(r.data){$('linkStatus').innerHTML='<span class="ok">فعال</span><div class="link"><a href="exam-access.html?token='+encodeURIComponent(r.data.token)+'" target="_blank">باز کردن لینک آزمون</a></div>'}else $('linkStatus').textContent=e.status==='published'?'لینک فعال یافت نشد.':'پس از انتشار ایجاد می‌شود.'}async function changeStatus(id,status){try{const r=await sb.rpc('v5_admin_set_exam_status',{p_exam_id:id,p_status:status});if(r.error)throw r.error;const e=exams.find(x=>x.id===id);if(e)e.status=r.data;render()}catch(x){alert(x.message||'تغییر وضعیت انجام نشد')}}async function saveSchedule(id){try{const s=$('start').value?new Date($('start').value).toISOString():null;const en=$('end').value?new Date($('end').value).toISOString():null;const r=await sb.rpc('v5_admin_set_exam_schedule',{p_exam_id:id,p_start_at:s,p_end_at:en});if(r.error)throw r.error;const e=exams.find(x=>x.id===id);if(e){e.start_at=r.data.start_at;e.end_at=r.data.end_at}render();alert('زمان‌بندی ذخیره شد.')}catch(x){alert(x.message||'ذخیره زمان‌بندی انجام نشد')}}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin-login-v2.html'};init().catch(e=>{$('msg').className='err';$('msg').textContent=e.message||'بارگذاری انجام نشد'});</script></body></html>
