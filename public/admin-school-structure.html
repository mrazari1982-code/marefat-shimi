<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سال و کلاس‌ها | معرفت</title><link rel="stylesheet" href="admin-curriculum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><header class="card"><h1>مدیریت سال تحصیلی و کلاس‌ها</h1><p id="who" class="muted">بررسی دسترسی...</p><a href="admin-panel.html">بازگشت به پنل</a></header><section id="app" hidden><section class="card"><img class="visual" src="assets/curriculum-structure.svg" alt="ساختار آموزشی"></section><section class="card"><h2>سال تحصیلی جدید</h2><div class="grid"><label>عنوان<input id="yearLabel" placeholder="۱۴۰۶-۱۴۰۷"></label><label>شروع<input id="startsOn" type="date"></label><label>پایان<input id="endsOn" type="date"></label><label>کلاس پیش‌فرض<select id="defaults"><option value="true">ایجاد یک کلاس</option><option value="false">ایجاد نشود</option></select></label></div><button id="createYear">ثبت سال</button><p id="yearMsg" class="muted"></p><div class="table"><table><thead><tr><th>سال</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="years"></tbody></table></div></section><section class="card"><h2>افزودن کلاس</h2><div class="grid"><label>سال<select id="classYear"></select></label><label>پایه<select id="grade"></select></label><label>رشته<select id="field"></select></label></div><button id="addClass">افزودن کلاس شماره بعدی</button><p id="classMsg" class="muted"></p><div class="table"><table><thead><tr><th>کلاس</th><th>سال</th><th>پایه</th><th>رشته</th></tr></thead><tbody id="classes"></tbody></table></div></section></section></main><script src="admin-school-structure.js"></script></body></html>
