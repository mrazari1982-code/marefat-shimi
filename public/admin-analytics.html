<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحلیل آموزشی | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:24px;font-weight:800}.muted{color:#667085}.err{color:#b42318}select{padding:9px;border:1px solid #ddd;border-radius:8px}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}.bar{height:12px;background:#e7ebf3;border-radius:8px;overflow:hidden}.fill{height:100%;background:#3157d5}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}.stat{font-size:21px}h1{font-size:22px}h2{font-size:18px}}</style></head><body><div class="wrap"><section class="card"><h1>تحلیل آموزشی</h1><p id="who" class="muted">در حال بررسی نشست...</p><a href="admin-panel.html">بازگشت به پنل</a></section><section id="app"><div class="card"><label>آزمون: <select id="exam"><option value="">همه آزمون‌ها</option></select></label></div><div class="grid"><div class="card"><div id="n" class="stat">—</div><div class="muted">تعداد شرکت</div></div><div class="card"><div id="avg" class="stat">—</div><div class="muted">میانگین درصد</div></div><div class="card"><div id="max" class="stat">—</div><div class="muted">بالاترین درصد</div></div><div class="card"><div id="min" class="stat">—</div><div class="muted">پایین‌ترین درصد</div></div></div><section class="card"><h2>عملکرد دانش‌آموزان</h2><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>درصد</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>سطح</th></tr></thead><tbody id="students"></tbody></table></div></section><section class="card"><h2>تحلیل سؤال‌ها</h2><p id="qmsg" class="muted">در حال بارگذاری...</p><div class="table-wrap"><table><thead><tr><th id="qhead">سؤال</th><th>تعداد پاسخ</th><th>صحیح</th><th>درصد موفقیت</th></tr></thead><tbody id="questions"></tbody></table></div></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let exams=[];async function init(){const s=await sb.auth.getSession(),session=s.data.session;if(!session){location.href='admin-login-v2.html';return}const staff=await sb.rpc('v5_is_staff');if(staff.error||staff.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(session.user.email||'');const er=await sb.from('v5_exams').select('id,title').order('id',{ascending:false});if(er.error){$('qmsg').className='err';$('qmsg').textContent=er.error.message;return}exams=er.data||[];$('exam').innerHTML='<option value="">همه آزمون‌ها</option>'+exams.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');$('exam').onchange=load;await load()}function level(p){p=Number(p||0);return p>=80?'عالی':p>=60?'خوب':p>=40?'نیازمند تمرین':'نیازمند تقویت'}function pct(row){return Number(row.average_percentage??row.percentage??0)}function answered(row){return Number(row.answered_count??row.answer_count??0)}function examTitle(id){const x=exams.find(e=>String(e.id)===String(id));return x?.title||('آزمون '+id)}async function load(){const id=$('exam').value||null;const r=await sb.rpc('v5_get_admin_analytics',{p_exam_id:id,p_limit:500});if(r.error){$('qmsg').className='err';$('qmsg').textContent=r.error.message;return}const data=r.data||{},rows=data.students||[],qs=data.question_stats||[],vals=rows.map(pct);$('n').textContent=rows.length;$('avg').textContent=rows.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2)+'%':'0%';$('max').textContent=rows.length?Math.max(...vals).toFixed(2)+'%':'0%';$('min').textContent=rows.length?Math.min(...vals).toFixed(2)+'%':'0%';$('students').innerHTML=rows.map(x=>'<tr><td>'+esc(x.full_name||x.student_code)+'</td><td>'+pct(x).toFixed(2)+'%</td><td>'+Number(x.correct_count||0)+'</td><td>'+Number(x.wrong_count||0)+'</td><td>'+Number(x.blank_count||0)+'</td><td>'+level(pct(x))+'</td></tr>').join('');$('qmsg').textContent=qs.length?'':'داده‌ای برای تحلیل سؤال‌ها وجود ندارد.';$('qhead').textContent=id?'سؤال':'آزمون / سؤال';$('questions').innerHTML=qs.map(x=>{const a=answered(x),c=Number(x.correct_count||0),p=a?c/a*100:0;const order=x.question_order??'';const label=id?order:(examTitle(x.exam_id)+' — سؤال '+order);return '<tr><td>'+esc(label)+'</td><td>'+a+'</td><td>'+c+'</td><td><div class="bar"><div class="fill" style="width:'+Math.min(100,p).toFixed(1)+'%"></div></div>'+p.toFixed(1)+'%</td></tr>'}).join('')}init();</script></body></html>
