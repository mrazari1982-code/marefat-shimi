<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ورود به آزمون | سامانه معرفت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="student-auth.js"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:700px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 16px #0001}.err{color:#b42318}.muted{color:#667085}
</style>
</head>
<body>
<main class="wrap">
  <section class="card">
    <h1>ورود به آزمون</h1>
    <p id="examInfo" class="muted" role="status" aria-live="polite">در حال بررسی لینک آزمون...</p>
    <p id="msg" class="muted"></p>
  </section>
</main>
<script>
const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');
const $=id=>document.getElementById(id);
const token=new URLSearchParams(location.search).get('token');

async function init(){
  if(!token){
    $('examInfo').className='err';
    $('examInfo').textContent='لینک آزمون معتبر نیست.';
    return;
  }
  const {data:rows,error}=await sb.rpc('v5_validate_exam_link',{p_token:token});
  if(error)throw error;
  const link=Array.isArray(rows)?rows[0]:rows;
  if(!link){
    $('examInfo').className='err';
    $('examInfo').textContent='این لینک آزمون فعال یا معتبر نیست.';
    return;
  }
  const dashboard=MarefatStudentAuth.safeReturn('student-dashboard.html?token='+encodeURIComponent(token));
  const destination=MarefatStudentAuth.getSession()
    ? dashboard
    : 'student-login.html?return='+encodeURIComponent(dashboard);
  $('examInfo').textContent='لینک معتبر است؛ در حال انتقال به ورود امن دانش‌آموز...';
  location.replace(destination);
}

init().catch(error=>{
  $('examInfo').className='err';
  $('examInfo').textContent='خطا در بررسی لینک: '+String(error&&error.message||'خطای نامشخص');
});
</script>
</body>
</html>
