<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لینک‌های آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}table{width:100%;min-width:720px;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.table-wrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}input,select{padding:10px;border:1px solid #ddd;border-radius:8px}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.danger{background:#b42318}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}.url{direction:ltr;text-align:left;word-break:break-all}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}h1{font-size:22px}h2{font-size:18px}}</style></head><body><div class="wrap"><header class="card"><h1>مدیریت لینک آزمون</h1><p id="who" class="muted">در حال بررسی دسترسی...</p><a href="admin-panel.html">بازگشت به پنل</a></header><section id="app" class="card" style="display:none"><h2>ایجاد لینک جدید</h2><div class="grid"><select id="exam"></select><input id="max" type="number" min="1" placeholder="حداکثر تلاش؛ خالی = بدون محدودیت"><input id="expires" type="datetime-local"><button id="create">ساخت لینک</button></div><p id="msg" class="muted"></p><h2>لینک‌های موجود</h2><div class="table-wrap"><table><thead><tr><th>آزمون</th><th>Token</th><th>انقضا</th><th>حداکثر تلاش</th><th>فعال</th></tr></thead><tbody id="rows"></tbody></table></div></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let exams=[];async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(s.data.session.user.email||'');$('app').style.display='block';await load()}async function load(){const e=await sb.from('v5_exams').select('id,title,exam_code,status').order('id',{ascending:false});if(e.error){$('msg').className='err';$('msg').textContent=e.error.message;return}exams=e.data||[];$('exam').innerHTML=exams.filter(x=>x.status==='published').map(x=>'<option value="'+x.id+'">'+esc(x.title)+' ('+esc(x.exam_code)+')</option>').join('')||'<option value="">آزمون منتشرشده‌ای وجود ندارد</option>';const l=await sb.from('v5_exam_links').select('id,exam_id,token,is_active,max_attempts_per_student,expires_at').order('id',{ascending:false}).limit(100);if(l.error){$('msg').className='err';$('msg').textContent=l.error.message;return}const em=new Map(exams.map(x=>[x.id,x]));$('rows').innerHTML=(l.data||[]).map(x=>{const base=location.origin+location.pathname.replace(/admin-exam-links\.html$/,'');const url=base+'index.html?token='+encodeURIComponent(x.token);return '<tr><td>'+esc(em.get(x.exam_id)?.title||x.exam_id)+'</td><td class="url"><a href="'+esc(url)+'" target="_blank">'+esc(x.token)+'</a></td><td>'+esc(x.expires_at||'بدون انقضا')+'</td><td>'+esc(x.max_attempts_per_student??'بدون محدودیت')+'</td><td>'+((x.is_active===true)?'فعال':'غیرفعال')+'</td></tr>'}).join('')}$('create').onclick=async()=>{const id=Number($('exam').value);if(!id){$('msg').className='err';$('msg').textContent='ابتدا یک آزمون منتشرشده انتخاب کنید.';return}const max=$('max').value?Number($('max').value):null;const exp=$('expires').value?new Date($('expires').value).toISOString():null;const r=await sb.rpc('v5_create_exam_link',{p_exam_id:id,p_expires_at:exp,p_max_attempts:max});if(r.error){$('msg').className='err';$('msg').textContent='ساخت لینک انجام نشد: '+r.error.message;return}$('msg').className='ok';$('msg').textContent='لینک با موفقیت ساخته شد: '+location.origin+location.pathname.replace(/admin-exam-links\.html$/,'')+'index.html?token='+encodeURIComponent(r.data);await load()};init();</script></body></html>
