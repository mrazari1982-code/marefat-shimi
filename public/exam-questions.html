<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سؤال‌های آزمون | معرفت</title><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:11px 15px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#667085}.danger{background:#b42318}.muted{color:#667085}.ok{color:#176b3a}.err{color:#b42318}.warn{color:#8a5a00;background:#fff8df;border-radius:10px;padding:12px}.new-badge{display:inline-block;background:#fff3b0;color:#8a5a00;border:1px solid #e5c84a;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:700;margin-right:7px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8fafc}.count{font-weight:700}.question{max-width:650px;line-height:1.8}.search{width:min(100%,500px);padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.status{font-weight:700;margin-top:10px}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 id="title" style="margin:0">مدیریت سؤال‌های آزمون</h1><p id="info" class="muted"></p></div><a class="btn secondary" href="admin.html">آزمون‌ها</a></div></div><div class="card"><div class="toolbar"><input id="search" class="search" placeholder="جستجو در سؤال‌های بانک..."><button id="addSelected" class="btn">افزودن سؤال‌های انتخاب‌شده</button><button id="addRandom" class="btn">افزودن تصادفی</button><input id="randomCount" type="number" min="1" value="1" style="width:90px;padding:10px;border:1px solid #ddd;border-radius:9px"><span id="selectedCount" class="count">۰ سؤال انتخاب شده</span></div><div id="msg" class="status warn">در حال بارگذاری موتور سامانه...</div></div><div class="card"><h2>سؤال‌های فعلی آزمون</h2><div id="current" class="table"></div></div><div class="card"><h2>بانک سؤال V5</h2><div id="bank" class="table"></div></div></main><script>window.addEventListener('error',function(e){var m=document.getElementById('msg');if(m){m.className='status err';m.textContent='خطای JavaScript: '+(e.message||'خطای ناشناخته')}});window.addEventListener('unhandledrejection',function(e){var m=document.getElementById('msg');if(m){m.className='status err';m.textContent='خطای اجرای سامانه: '+(e.reason?.message||e.reason||'خطای ناشناخته')}});function loadScript(src){return new Promise(function(resolve,reject){var s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=function(){reject(new Error('بارگذاری کتابخانه Supabase ناموفق بود'))};document.head.appendChild(s)})}var sb,examId=0,bank=[],current=[];function $(x){return document.getElementById(x)}function show(t,c){$('msg').className='status '+c;$('msg').textContent=t}function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]})}function refreshSelected(){var n=document.querySelectorAll('.bankPick:checked').length;$('selectedCount').textContent=n+' سؤال انتخاب شده'}async function start(){show('در حال بارگذاری موتور سامانه...','warn');await loadScript('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2');if(!window.supabase?.createClient)throw new Error('کتابخانه Supabase در مرورگر در دسترس نیست.');sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');show('کتابخانه Supabase آماده شد؛ در حال بررسی نشست مدیر...','warn');var r=await sb.auth.getUser();if(r.error)throw r.error;if(!r.data.user)throw new Error('ابتدا وارد حساب مدیر شوید.');var p=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',r.data.user.id).maybeSingle();if(p.error)throw p.error;if(!p.data?.is_active||!['admin','deputy'].includes(p.data.role))throw new Error('دسترسی مدیر/معاون مجاز نیست.');show('نشست مدیر تأیید شد؛ در حال دریافت اطلاعات...','warn');var params=new URLSearchParams(location.search);examId=Number(params.get('exam_id')||0);if(!examId){var code=params.get('exam_code');if(!code)throw new Error('شناسه آزمون مشخص نیست.');var er=await sb.from('v5_exams').select('id').eq('exam_code',code).single();if(er.error)throw er.error;examId=er.data.id}await loadExam();await loadCurrent();await loadBank()}async function loadExam(){var r=await sb.from('v5_exams').select('id,exam_code,title,duration_minutes,status').eq('id',examId).single();if(r.error)throw r.error;$('title').textContent='مدیریت سؤال‌های: '+r.data.title;$('info').textContent='کد: '+r.data.exam_code+' | وضعیت: '+r.data.status+' | مدت: '+(r.data.duration_minutes||'—')+' دقیقه'}async function loadCurrent(){var r=await sb.rpc('v5_admin_get_exam_questions',{p_exam_id:examId});if(r.error)throw r.error;current=r.data||[];renderCurrent()}async function loadBank(){show('نشست مدیر تأیید شد؛ در حال دریافت بانک سؤال V5...','warn');var r=await sb.rpc('v5_get_staff_question_bank',{p_search:'',p_subject:null,p_grade:null,p_difficulty:null,p_limit:100});if(r.error)throw r.error;bank=r.data||[];renderBank();show(bank.length?bank.length+' سؤال از بانک سؤال V5 آماده است.':'بانک سؤال برای این نشست خالی برگشت.','ok')}function renderCurrent(){if(!current.length){$('current').innerHTML='<div class="muted" style="padding:20px">هنوز سؤالی به این آزمون اضافه نشده است.</div>';return}$('current').innerHTML='<table><thead><tr><th>ترتیب</th><th>سؤال</th><th>نوع</th><th>سطح</th><th>امتیاز</th><th>عملیات</th></tr></thead><tbody>'+current.map(function(q){return '<tr><td>'+q.question_order+'</td><td class="question">'+esc(q.question_text)+'</td><td>'+esc(q.question_type)+'</td><td>'+esc(q.difficulty)+'</td><td>'+q.score+'</td><td><button class="btn danger remove" data-q="'+q.question_id+'">حذف</button></td></tr>'}).join('')+'</tbody></table>';document.querySelectorAll('.remove').forEach(function(b){b.onclick=function(){removeQuestion(Number(b.dataset.q))}})}function renderBank(){var term=$('search').value.trim().toLowerCase(),existing=new Set(current.map(function(x){return Number(x.bank_question_id||x.question_id)})),list=bank.filter(function(q){return !existing.has(Number(q.id))&&(!term||String(q.question_text||'').toLowerCase().includes(term)||String(q.subject||'').toLowerCase().includes(term)||String(q.grade||'').toLowerCase().includes(term)||String(q.difficulty||'').toLowerCase().includes(term))});$('bank').innerHTML=list.length?'<table><thead><tr><th></th><th>#</th><th>سؤال</th><th>درس</th><th>پایه</th><th>سطح</th><th>امتیاز</th></tr></thead><tbody>'+list.map(function(q){var isNew=String(q.question_text||'').startsWith('[جدید]');return '<tr><td><input type="checkbox" class="bankPick" value="'+q.id+'" onchange="refreshSelected()"></td><td>'+q.id+'</td><td class="question">'+(isNew?'<span class="new-badge">جدید</span>':'')+esc(q.question_text)+'</td><td>'+esc(q.subject||'—')+'</td><td>'+esc(q.grade||'—')+'</td><td>'+esc(q.difficulty||'—')+'</td><td>'+q.score+'</td></tr>'}).join('')+'</tbody></table>':'<div class="muted" style="padding:20px">سؤال قابل افزودن پیدا نشد.</div>';refreshSelected()}async function add(ids){ids=[...new Set(ids.filter(Number.isInteger))];if(!ids.length){show('حداقل یک سؤال انتخاب کنید.','err');return}var btn=$('addSelected');btn.disabled=true;show('در حال افزودن '+ids.length+' سؤال...','warn');var r=await sb.rpc('v5_admin_add_bank_questions_to_exam',{p_exam_id:examId,p_bank_question_ids:ids});if(r.error){show('افزودن سؤال انجام نشد: '+r.error.message,'err');btn.disabled=false;return}await loadCurrent();await loadBank();var actual=current.filter(function(q){return ids.includes(Number(q.bank_question_id||q.question_id))}).length;show(actual+' سؤال واقعاً در آزمون ثبت شد.','ok');btn.disabled=false}async function removeQuestion(qid){if(!confirm('این سؤال از آزمون حذف شود؟'))return;var r=await sb.rpc('v5_admin_remove_exam_question',{p_exam_id:examId,p_question_id:qid});if(r.error){show('حذف سؤال انجام نشد: '+r.error.message,'err');return}show('سؤال حذف شد.','ok');await loadCurrent();await loadBank()}$('addSelected').onclick=function(){add(Array.from(document.querySelectorAll('.bankPick:checked')).map(function(x){return Number(x.value)}))};$('addRandom').onclick=async function(){var n=Math.max(1,Number($('randomCount').value)||1),btn=$('addRandom');btn.disabled=true;show('در حال افزودن '+n+' سؤال تصادفی...','warn');var r=await sb.rpc('v5_admin_add_random_bank_questions_to_exam',{p_exam_id:examId,p_count:n});if(r.error){show('افزودن تصادفی انجام نشد: '+r.error.message,'err');btn.disabled=false;return}await loadCurrent();await loadBank();show((Array.isArray(r.data)?r.data.length:0)+' سؤال تصادفی واقعاً در آزمون ثبت شد.','ok');btn.disabled=false};$('search').oninput=renderBank;start().catch(function(e){show('خطا: '+(e.message||e),'err')});</script></body></html>
