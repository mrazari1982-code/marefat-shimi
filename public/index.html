<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="student-auth.js"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.btn{padding:12px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;min-height:44px}.btn:disabled{opacity:.55;cursor:not-allowed}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}input[type=text]{padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0;width:min(100%,360px);box-sizing:border-box}input:focus{outline:2px solid #3157d544;border-color:#3157d5}</style></head><body><main class="wrap"><section id="login" class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود امن با حساب دانش‌آموز و لینک اختصاصی آزمون</p><p id="status" class="muted">در حال آماده‌سازی...</p><label for="token">توکن لینک آزمون</label><br><input id="token" type="text" autocomplete="off" spellcheck="false"><br><input id="studentCode" type="hidden" value="session"><button id="startBtn" class="btn">شروع آزمون</button></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);function setStatus(text,cls='muted'){$('status').className=cls;$('status').textContent=text}function friendlyError(message){const m=String(message||'');if(m.includes('STUDENT_NOT_FOUND'))return 'کد دانش‌آموزی پیدا نشد یا دانش‌آموز غیرفعال است.';if(m.includes('INVALID_EXAM_LINK'))return 'لینک آزمون معتبر نیست یا منقضی شده است.';if(m.includes('EXAM_NOT_PUBLISHED'))return 'این آزمون هنوز منتشر نشده است.';if(m.includes('EXAM_NOT_STARTED'))return 'زمان شروع آزمون هنوز فرا نرسیده است.';if(m.includes('EXAM_CLOSED'))return 'زمان این آزمون به پایان رسیده است.';if(m.includes('MAX_ATTEMPTS_REACHED'))return 'سقف مجاز شرکت در این آزمون تکمیل شده است.';return m||'خطای نامشخص در سامانه.'}function init(){try{const t=new URLSearchParams(location.search).get('token');if(t)$('token').value=t;setStatus('سامانه آماده است. توکن لینک آزمون را وارد کنید.','ok')}catch(e){setStatus('خطا در آماده‌سازی سامانه: '+e.message,'err')}}$('startBtn').onclick=async()=>{const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code){setStatus('توکن و کد دانش‌آموزی الزامی است.','err');return}$('startBtn').disabled=true;setStatus('در حال بررسی لینک و حساب دانش‌آموز...');try{const linkResult=await sb.rpc('v5_validate_exam_link',{p_token:token});if(linkResult.error)throw linkResult.error;const link=Array.isArray(linkResult.data)?linkResult.data[0]:linkResult.data;if(!link){setStatus('لینک آزمون معتبر نیست یا منقضی شده است.','err');$('startBtn').disabled=false;return}const startResult=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(startResult.error)throw startResult.error;const attempt=Array.isArray(startResult.data)?startResult.data[0]:startResult.data;if(!attempt){setStatus('شروع آزمون انجام نشد.','err');$('startBtn').disabled=false;return}location.href='exam.html?token='+encodeURIComponent(token)+'&student_code='+encodeURIComponent(code)}catch(e){setStatus(friendlyError(e.message),'err');$('startBtn').disabled=false}};init()</script></body></html>
