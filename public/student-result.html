<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>نتیجه آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="student-auth.js"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.stat{font-size:25px;font-weight:800}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}button{padding:10px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}input{padding:10px;border:1px solid #ddd;border-radius:8px;width:min(100%,330px);box-sizing:border-box;margin:4px}</style></head><body><main class="wrap"><section class="card"><h1>نتیجه آزمون</h1><p class="muted">نتیجه فقط برای حساب دانش‌آموز واردشده و با شناسه نتیجه قابل دریافت است.</p><input id="id" placeholder="شناسه Attempt"><input id="code" type="hidden" value="session"><br><button id="load">نمایش نتیجه</button><p id="msg" class="muted"></p></section><section id="summary" class="card" hidden><div class="grid"><div><div class="stat" id="pct">—</div><div class="muted">درصد</div></div><div><div class="stat" id="correct">—</div><div class="muted">صحیح</div></div><div><div class="stat" id="wrong">—</div><div class="muted">غلط</div></div><div><div class="stat" id="blank">—</div><div class="muted">نزده</div></div></div><p id="student"></p><p id="exam"></p><p id="submitted" class="muted"></p></section><section id="detail" class="card" hidden><h2>جزئیات پاسخ‌ها</h2><table><thead><tr><th>سؤال</th><th>پاسخ</th><th>نتیجه</th><th>نمره</th></tr></thead><tbody id="rows"></tbody></table></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const id=$('id').value.trim(),code=$('code').value.trim();if(!id||!code){$('msg').className='err';$('msg').textContent='هر دو مقدار لازم است.';return}$('load').disabled=true;try{const r=await sb.rpc('v5_get_student_result',{p_attempt_id:id,p_student_code:code});if(r.error)throw new Error(r.error.message||'نتیجه پیدا نشد.');const x=r.data;if(!x)throw new Error('نتیجه پیدا نشد.');$('pct').textContent=Number(x.percentage||0).toFixed(2)+'%';$('correct').textContent=x.correct_count??0;$('wrong').textContent=x.wrong_count??0;$('blank').textContent=x.blank_count??0;$('student').textContent='دانش‌آموز: '+esc(x.student_name)+' — '+esc(x.student_code);$('exam').textContent='آزمون: '+esc(x.exam_title)+' — '+esc(x.exam_code);$('submitted').textContent=x.submitted_at?'زمان ثبت: '+new Date(x.submitted_at).toLocaleString('fa-IR'):'';$('rows').innerHTML=(x.details||[]).map(q=>'<tr><td>'+esc(q.question_order)+'. '+esc(q.question_text)+'</td><td>'+esc(q.answer_text||'نزده')+'</td><td class="'+(q.is_correct?'ok':'err')+'">'+(q.is_correct?'صحیح':'غلط / نزده')+'</td><td>'+esc(q.score_awarded??0)+'</td></tr>').join('');$('summary').hidden=false;$('detail').hidden=false;$('msg').className='ok';$('msg').textContent='نتیجه با موفقیت نمایش داده شد.'}catch(e){$('summary').hidden=true;$('detail').hidden=true;$('msg').className='err';$('msg').textContent=e.message||'خطا در دریافت نتیجه.'}finally{$('load').disabled=false}}$('load').onclick=load;const p=new URLSearchParams(location.search);if(p.get('attempt'))$('id').value=p.get('attempt');</script></main></body></html>
