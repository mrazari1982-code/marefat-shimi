<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ورود گروهی دانش‌آموزان | معرفت</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="vendor/exceljs-4.4.0.min.js"></script>
  <script src="student-import.js"></script>
  <style>
    body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:11px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#667085}.btn:disabled{opacity:.55;cursor:not-allowed}.muted{color:#667085}.ok{color:#176b3a}.err{color:#b42318}.warn{color:#7a5600;background:#fff8e6;padding:12px;border-radius:9px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}.bad{color:#b42318}.skip{color:#8a5a00}input[type=file]{padding:10px;border:1px solid #ddd;border-radius:9px;max-width:100%}
  </style>
</head>
<body><main class="wrap">
  <section class="card"><div class="toolbar"><div style="flex:1"><h1>ورود گروهی دانش‌آموزان از Excel</h1><p id="who" class="muted">در حال بررسی دسترسی...</p></div><a class="btn secondary" href="students.html">بازگشت</a></div></section>
  <section id="app" class="card" hidden>
    <p class="warn">فایل خروجی شامل رمزهای اولیه است و محرمانه محسوب می‌شود. آن را فقط از مسیر امن تحویل دهید و پس از استفاده در محل عمومی نگهداری نکنید.</p>
    <div class="toolbar"><button id="template" class="btn secondary">دانلود قالب Excel</button><input id="file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"><button id="import" class="btn" disabled>ثبت دانش‌آموزان معتبر</button></div>
    <p id="msg" class="muted">ابتدا قالب را دانلود و تکمیل کنید.</p>
    <div class="table"><table><thead><tr><th>ردیف</th><th>کد</th><th>نام</th><th>پایه</th><th>رشته</th><th>کلاس</th><th>وضعیت</th></tr></thead><tbody id="preview"></tbody></table></div>
  </section>
</main>
<script>
const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');
const $=id=>document.getElementById(id),api=MarefatStudentImport;
let context=null,rows=[],busy=false;
function message(text,type='muted'){$('msg').className=type;$('msg').textContent=text}
function cell(tr,text,className){const td=document.createElement('td');td.textContent=String(text??'');if(className)td.className=className;tr.appendChild(td)}
function render(){const body=$('preview');body.replaceChildren();rows.forEach(row=>{const tr=document.createElement('tr');cell(tr,row.rowNumber);cell(tr,row.student_code);cell(tr,row.full_name);cell(tr,row.grade_name);cell(tr,row.field_name);cell(tr,row.class_name);const label=row.server_status==='created'?'ایجاد شد':row.server_status==='existing'||row.status==='existing'?'از قبل موجود؛ رد شد':row.status==='valid'?'آماده ثبت':row.errors.join(' ');cell(tr,label,row.status==='invalid'?'bad':row.status==='existing'||row.server_status==='existing'?'skip':'ok');body.appendChild(tr)});const valid=rows.filter(row=>row.status==='valid'&&!row.server_status).length;$('import').disabled=busy||valid===0}
function setBusy(value){busy=value;$('file').disabled=value;$('template').disabled=value;$('import').disabled=value||!rows.some(row=>row.status==='valid'&&!row.server_status)}
async function authorize(){const {data,error}=await sb.auth.getUser();if(error)throw error;if(!data.user){location.href='admin-login-v2.html';return false}const {data:profile,error:profileError}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',data.user.id).maybeSingle();if(profileError)throw profileError;if(!profile?.is_active||!['admin','deputy'].includes(profile.role)){throw new Error('فقط مدیر یا معاون فعال اجازهٔ ورود گروهی دارد.')}const result=await sb.rpc('v5_admin_student_import_context');if(result.error)throw result.error;context=result.data;$('who').textContent='کاربر: '+(profile.full_name||data.user.email)+' | نقش: '+profile.role;$('app').hidden=false;return true}
$('template').onclick=async()=>{try{setBusy(true);const bytes=await api.buildTemplate(context,ExcelJS);api.downloadBlob(bytes,'قالب-ورود-دانش‌آموزان.xlsx');message('قالب دانلود شد. کد دانش‌آموزی را به‌صورت متن وارد کنید.','ok')}catch(error){message('ساخت قالب انجام نشد: '+(error.message||error),'err')}finally{setBusy(false)}};
$('file').onchange=async event=>{rows=[];render();const file=event.target.files[0];if(!file)return;if(!file.name.toLowerCase().endsWith('.xlsx')){message('فقط فایل با پسوند .xlsx پذیرفته می‌شود.','err');return}if(file.size>2 * 1024 * 1024){message('حجم فایل باید حداکثر ۲ مگابایت باشد.','err');return}try{setBusy(true);const raw=await api.readWorkbook(await file.arrayBuffer(),ExcelJS);rows=api.validateRows(raw,context);render();const invalid=rows.filter(row=>row.status==='invalid').length,existing=rows.filter(row=>row.status==='existing').length;message(rows.length+' ردیف خوانده شد؛ '+invalid+' نامعتبر و '+existing+' از قبل موجود است.',invalid?'err':'ok')}catch(error){message('خواندن فایل انجام نشد: '+(error.message||error),'err')}finally{setBusy(false);render()}};
$('import').onclick=async()=>{const candidates=rows.filter(row=>row.status==='valid'&&!row.server_status);if(!candidates.length)return;if(!confirm(candidates.length+' دانش‌آموز جدید ثبت شود؟'))return;try{setBusy(true);candidates.forEach(row=>{row.password=api.generatePassword()});const payload=candidates.map(row=>({student_code:row.student_code,full_name:row.full_name,grade_id:row.grade_id,field_id:row.field_id,class_id:row.class_id,password:row.password}));const result=await sb.rpc('v5_admin_import_students',{p_rows:payload});if(result.error)throw result.error;const output=api.credentialRows(rows,result.data||[]);const bytes=await api.buildCredentialWorkbook(output,ExcelJS);const stamp=new Date().toISOString().replace(/[:.]/g,'-');api.downloadBlob(bytes,'اطلاعات-ورود-دانش‌آموزان-'+stamp+'.xlsx');const created=(result.data||[]).filter(item=>item.status==='created').length;message(created+' دانش‌آموز ایجاد شد و فایل اطلاعات ورود دانلود شد.','ok');rows=output;render()}catch(error){message('ثبت گروهی انجام نشد؛ هیچ ردیفی از این درخواست ثبت نشد: '+(error.message||error),'err')}finally{candidates.forEach(row=>{row.password=''});rows.forEach(row=>{row.password=''});setBusy(false)}};
authorize().catch(error=>{const node=$('who');node.className='err';node.textContent='دسترسی یا بارگذاری انجام نشد: '+(error.message||error)});
</script></body></html>
