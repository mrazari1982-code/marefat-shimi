<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحلیل آموزشی | سامانه معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1250px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn,select{padding:11px 15px;border-radius:9px;border:1px solid #d0d5dd}.btn{background:#3157d5;color:#fff;font-weight:700;text-decoration:none;cursor:pointer;border:0}.secondary{background:#667085}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:5px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}.weak{color:#b42318;font-weight:700}.mid{color:#8a5a00;font-weight:700}.good{color:#176b3a;font-weight:700}.excellent{color:#3157d5;font-weight:700}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 style="margin:0">تحلیل آموزشی</h1><p id="userInfo" class="muted"></p></div><a class="btn secondary" href="admin-panel.html">پنل اصلی</a><a class="btn secondary" href="students.html">دانش‌آموزان</a><a class="btn secondary" href="admin-question-bank.html">بانک سؤال V5</a><a class="btn secondary" href="results.html">نتایج</a><button id="refresh" class="btn">به‌روزرسانی</button><button id="logout" class="btn secondary">خروج</button></div></div><div class="card"><div class="toolbar"><label for="exam">آزمون:</label><select id="exam"><option value="">همه آزمون‌ها</option></select><span id="scope" class="muted"></span></div></div><div class="card"><div id="stats" class="stats"></div></div><div class="grid2"><div class="card"><h2>عملکرد دانش‌آموزان</h2><div class="table"><table><thead><tr><th>دانش‌آموز</th><th>کد</th><th>آزمون</th><th>میانگین درصد</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>سطح</th></tr></thead><tbody id="rows"></tbody></table></div></div><div class="card"><h2>عملکرد دروس</h2><div class="table"><table><thead><tr><th>درس</th><th>کل سؤال</th><th>پاسخ‌داده</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>دقت</th></tr></thead><tbody id="subjects"></tbody></table></div></div></div><div class="card"><h2>تحلیل سؤال‌ها</h2><div class="table"><table><thead><tr><th>آزمون</th><th>ترتیب</th><th>سؤال</th><th>سطح</th><th>تعداد پاسخ</th><th>صحیح</th><th>درصد صحیح</th></tr></thead><tbody id="questions"></tbody></table></div></div><p id="msg" class="muted"></p><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function level(p){p=Number(p||0);if(p<50)return ['ضعیف','weak'];if(p<70)return ['متوسط','mid'];if(p<85)return ['خوب','good'];return ['عالی','excellent']}function n(v){return Number(v||0)}async function loadExams(){const {data,error}=await sb.from('v5_exams').select('id,title,exam_code').order('created_at',{ascending:false});if(error)throw error;const old=$('exam').value;$('exam').innerHTML='<option value="">همه آزمون‌ها</option>'+(data||[]).map(e=>'<option value="'+e.id+'">'+esc(e.title)+' — '+esc(e.exam_code)+'</option>').join('');if([...$('exam').options].some(o=>o.value===old))$('exam').value=old;return data||[]}async function load(){try{$('msg').className='muted';$('msg').textContent='در حال دریافت تحلیل آموزشی...';const {data:u}=await sb.auth.getUser();if(!u.user){location.href='admin-login-v2.html';return}const {data:p,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',u.user.id).maybeSingle();if(pe)throw pe;if(!p||!p.is_active||!['admin','deputy'].includes(p.role)){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('userInfo').textContent='کاربر: '+(p.full_name||u.user.email)+' | نقش: '+p.role;await loadExams();const examId=$('exam').value?Number($('exam').value):null;const {data:result,error}=await sb.rpc('v5_get_admin_analytics',{p_exam_id:examId,p_limit:500});if(error)throw error;const summary=result?.summary||{};const students=Array.isArray(result?.students)?result.students:[];const subjects=Array.isArray(result?.subject_stats)?result.subject_stats:[];const questions=Array.isArray(result?.question_stats)?result.question_stats:[];$('scope').textContent=examId?'تحلیل آزمون انتخاب‌شده':'تحلیل همه آزمون‌ها';$('stats').innerHTML='<div class="stat">ثبت‌های نهایی<b>'+n(summary.submitted_attempts)+'</b></div><div class="stat">دانش‌آموزان<b>'+n(summary.student_count)+'</b></div><div class="stat">میانگین درصد<b>'+n(summary.average_percentage).toFixed(2)+'%</b></div><div class="stat">صحیح<b>'+n(summary.correct_count)+'</b></div><div class="stat">غلط<b>'+n(summary.wrong_count)+'</b></div><div class="stat">نزده<b>'+n(summary.blank_count)+'</b></div>';$('rows').innerHTML=students.length?students.map(s=>{const l=level(s.average_percentage);return '<tr><td>'+esc(s.full_name)+'</td><td>'+esc(s.student_code)+'</td><td>'+n(s.exam_count)+'</td><td><b>'+n(s.average_percentage).toFixed(2)+'%</b></td><td>'+n(s.correct_count)+'</td><td>'+n(s.wrong_count)+'</td><td>'+n(s.blank_count)+'</td><td class="'+l[1]+'">'+l[0]+'</td></tr>'}).join(''):'<tr><td colspan="8" style="text-align:center;padding:30px">نتیجه ثبت‌شده‌ای وجود ندارد.</td></tr>';$('subjects').innerHTML=subjects.length?subjects.map(s=>'<tr><td>'+esc(s.subject_name)+'</td><td>'+n(s.total_questions)+'</td><td>'+n(s.answered_questions)+'</td><td>'+n(s.correct_answers)+'</td><td>'+n(s.wrong_answers)+'</td><td>'+n(s.unanswered_questions)+'</td><td><b>'+n(s.accuracy).toFixed(2)+'%</b></td></tr>').join(''):'<tr><td colspan="7" style="text-align:center;padding:30px">داده درسی برای تحلیل وجود ندارد.</td></tr>';$('questions').innerHTML=questions.length?questions.map(q=>{const total=n(q.total_attempts),correct=n(q.correct_count),pct=total?correct*100/total:0;return '<tr><td>'+n(q.exam_id)+'</td><td>'+n(q.question_order)+'</td><td>'+esc(q.question_text)+'</td><td>'+esc(q.difficulty)+'</td><td>'+total+'</td><td>'+correct+'</td><td>'+pct.toFixed(2)+'%</td></tr>'}).join(''):'<tr><td colspan="7" style="text-align:center;padding:30px">تحلیل سؤال‌ها وجود ندارد.</td></tr>';$('msg').textContent='تحلیل آموزشی با موفقیت از نتایج ثبت‌شده محاسبه و به‌روزرسانی شد.'}catch(e){$('msg').className='err';$('msg').textContent='تحلیل انجام نشد: '+e.message}}$('exam').onchange=load;$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin-login-v2.html'};sb.auth.getSession().then(({data})=>{if(data.session)load();else location.href='admin-login-v2.html'});</script></main></body></html>
