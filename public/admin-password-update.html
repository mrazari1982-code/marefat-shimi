<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تعیین رمز جدید مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:650px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:24px;margin-top:40px;box-shadow:0 3px 16px #0001}input{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 14px;border:1px solid #ddd;border-radius:9px}button{padding:11px 20px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}button:disabled{opacity:.65;cursor:wait}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}a{color:#3157d5;font-weight:700;text-decoration:none}</style></head><body><main class="wrap"><section class="card"><h1>تعیین رمز جدید مدیر</h1><p class="muted">رمز جدید باید حداقل ۸ کاراکتر داشته باشد.</p><form id="form"><label for="password">رمز جدید</label><input id="password" type="password" minlength="8" autocomplete="new-password" required><label for="confirmPassword">تکرار رمز جدید</label><input id="confirmPassword" type="password" minlength="8" autocomplete="new-password" required><button id="submit" type="submit">ثبت رمز جدید</button></form><p id="message" class="muted" aria-live="polite">لینک بازیابی در حال بررسی است...</p><p><a href="admin-login-v2.html">بازگشت به ورود مدیر</a></p></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);let userInteracted=false,recoveryReady=false;function showRecoveryReady(){if(userInteracted)return;$('message').className='ok';$('message').textContent='لینک تأیید شد؛ رمز جدید را وارد کنید.'}sb.auth.onAuthStateChange(event=>{if(event==='PASSWORD_RECOVERY'){recoveryReady=true;showRecoveryReady()}});setTimeout(()=>{if(!userInteracted&&!recoveryReady){$('message').className='muted';$('message').textContent='برای ادامه، این صفحه را از لینک داخل ایمیل بازیابی باز کنید.'}},1500);$('form').addEventListener('submit',async event=>{event.preventDefault();userInteracted=true;const password=$('password').value,confirmation=$('confirmPassword').value;if(password.length<8){$('message').className='err';$('message').textContent='رمز جدید باید حداقل ۸ کاراکتر داشته باشد.';return}if(password!==confirmation){$('message').className='err';$('message').textContent='رمز جدید و تکرار آن یکسان نیست.';return}if(!recoveryReady){$('message').className='err';$('message').textContent='نشست بازیابی معتبر نیست. این صفحه را دوباره از لینک بازیابی داخل ایمیل باز کنید.';return}$('submit').disabled=true;$('message').className='muted';$('message').textContent='در حال ثبت رمز جدید...';try{const {error}=await sb.auth.updateUser({password});if(error)throw error;const {error:signOutError}=await sb.auth.signOut();if(signOutError){$('message').className='err';$('message').textContent='رمز تغییر کرد، اما خروج امن انجام نشد. این صفحه را ببندید و دوباره وارد سامانه شوید.';return}$('message').className='ok';$('message').textContent='رمز جدید ثبت شد. در حال انتقال به صفحه ورود...';setTimeout(()=>location.replace('admin-login-v2.html?password=updated'),800)}catch(error){$('message').className='err';$('message').textContent='ثبت رمز انجام نشد. لینک ممکن است منقضی یا قبلاً استفاده شده باشد.'}finally{$('submit').disabled=false}});</script></body></html>
