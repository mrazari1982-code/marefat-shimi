<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بانک سؤال جدید | معرفت</title><link rel="stylesheet" href="admin-curriculum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="curriculum-ui.js"></script></head><body><main class="wrap"><header class="card"><h1>بانک سؤال فصل و مبحث‌محور</h1><p id="who" class="muted">بررسی دسترسی...</p><a href="admin-panel.html">بازگشت</a></header><section id="app" hidden><section class="card"><div class="grid"><label>پایه<select id="formGrade"></select></label><label>رشته<select id="formField"></select></label><label>کتاب<select id="formBook"></select></label><label>فصل<select id="formChapter"></select></label><label>مبحث<select id="formTopic"></select></label><label>زیرمبحث<select id="formSubtopic"></select></label><label>نوع<select id="questionType"><option value="multiple_choice">تستی</option><option value="descriptive">تشریحی</option></select></label><label>سختی<select id="difficulty"><option value="easy">آسان</option><option value="medium" selected>متوسط</option><option value="hard">سخت</option></select></label><label>نمره<input id="score" type="number" min="0.25" step="0.25" value="1"></label></div><label>متن سؤال<textarea id="questionText"></textarea></label><div id="multipleChoice"><h3>گزینه‌ها</h3><div id="options"></div></div><div id="descriptive" hidden><div class="grid"><label>کلید پاسخ<textarea id="answerKey"></textarea></label><label>راهنمای تصحیح<textarea id="rubric"></textarea></label><label>واژه‌های کلیدی<input id="keywords"></label></div></div><button id="save">ثبت سؤال</button><p id="formMsg" class="muted"></p></section><section class="card"><h2>سؤال‌های جدید</h2><div class="row"><input id="search" placeholder="جست‌وجو"><select id="filterBook"></select><select id="filterNode"></select><button id="reload">نمایش</button></div><p id="listMsg" class="muted"></p><div id="questions"></div></section></section></main><script src="admin-curriculum-question-bank.js"></script></body></html>
