<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>مدیریت سؤال‌های آزمون V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:11px 15px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none}.secondary{background:#667085}.danger{background:#b42318}.ok{color:#176b3a}.err{color:#b42318}.muted{color:#667085}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8fafc}.question{max-width:650px;line-height:1.8}.search{width:min(100%,500px);padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}.debug{font-family:monospace;direction:ltr;text-align:left;background:#111;color:#eee;padding:10px;border-radius:8px;white-space:pre-wrap}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 id="title">مدیریت سؤال‌های آزمون — نسخه V3</h1><p id="info" class="muted">در حال بررسی اتصال...</p></div><a class="btn secondary" href="admin.html">آزمون‌ها</a></div></div><div class="card"><div class="toolbar"><input id="search" class="search" placeholder="جستجو در بانک سؤال..."><button id="addSelected" class="btn">افزودن سؤال‌های انتخاب‌شده</button><button id="addRandom" class="btn">افزودن تصادفی</button><input id="randomCount" type="number" min="1" value="1" style="width:80px;padding:10px;border:1px solid #ddd;border-radius:8px"><span id="selectedCount">۰ سؤال انتخاب شده</span></div><p id="msg" class="muted"></p><div id="debug" class="debug" style="display:none"></div></div><div class="card"><h2>سؤال‌های فعلی آزمون</h2><div id="current" class="table"></div></div><div class="card"><h2>بانک سؤال V5</h2><div id="bank" class="table"></div></div></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=x=>document.getElementById(x),params=new URLSearchParams(location.search);let examId=Number(params.get('exam_id')||0),bank=[],current=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function msg(t,c='muted'){ $('msg').className=c;$('msg').textContent=t}function selected(){const n=document.querySelectorAll('.pick:checked').length;$('selectedCount').textContent=n+' سؤال انتخاب شده'}function showErr(e){msg('خطا: '+(e?.message||e),'err');$('debug').style.display='block';$('debug').textContent=String(e?.message||e)}async function init(){try{const {data:{user},error:ue}=await sb.auth.getUser();if(ue)throw ue;if(!user)throw new Error('جلسه ورود مدیر وجود ندارد. ابتدا از پنل مدیر وارد شوید.');const {data:p,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',user.id).maybeSingle();if(pe)throw pe;if(!p?.is_active||!['admin','deputy','teacher'].includes(p.role))throw new Error('حساب فعلی مجوز مشاهده بانک سؤال را ندارد.');if(!examId){const code=params.get('exam_code');if(!code)throw new Error('exam_id مشخص نشده است.');const {data:e,error}=await sb.from('v5_exams').select('id').eq('exam_code',code).single();if(error)throw error;examId=e.id}const {data:e,error:ee}=await sb.from('v5_exams').select('id,exam_code,title,status,duration_minutes').eq('id',examId).single();if(ee)throw ee;$('title').textContent='مدیریت سؤال‌های: '+e.title;$('info').textContent='نسخه V3 | کد: '+e.exam_code+' | وضعیت: '+e.status+' | شناسه: '+e.id;await loadCurrent();await loadBank();msg('بانک سؤال با موفقیت بارگذاری شد.','ok')}catch(e){showErr(e)}}async function loadCurrent(){const {data,error}=await sb.rpc('v5_admin_get_exam_questions',{p_exam_id:examId});if(error)throw error;current=data||[];renderCurrent()}async function loadBank(){const {data:qs,error}=await sb.from('v5_questions').select('id,question_text,subject_id,difficulty,score,is_active').eq('is_active',true).order('id',{ascending:false});if(error)throw error;const ids=[...new Set((qs||[]).map(q=>q.subject_id).filter(Boolean))];let subs=[];if(ids.length){const {data,error:se}=await sb.from('v5_subjects').select('id,name,grade_id').in('id',ids);if(se)throw se;subs=subs.concat(se?[]:data||[])}const gids=[...new Set(subs.map(s=>s.grade_id).filter(Boolean))];let grades=[];if(gids.length){const {data,error:ge}=await sb.from('v5_grades').select('id,name').in('id',gids);if(ge)throw ge;grades=data||[]}const sm=new Map(subs.map(s=>[s.id,s])),gm=new Map(grades.map(g=>[g.id,g]));bank=(qs||[]).map(q=>{const s=sm.get(q.subject_id),g=s?gm.get(s.grade_id):null;return {...q,subject:s?.name||'—',grade:g?.name||'—'}});renderBank()}function renderCurrent(){if(!current.length){$('current').innerHTML='<p class="muted">هنوز سؤالی به این آزمون اضافه نشده است.</p>';return}$('current').innerHTML='<table><thead><tr><th>ترتیب</th><th>سؤال</th><th>سطح</th><th>امتیاز</th><th>عملیات</th></tr></thead><tbody>'+current.map(q=>'<tr><td>'+q.question_order+'</td><td class="question">'+esc(q.question_text)+'</td><td>'+esc(q.difficulty)+'</td><td>'+q.score+'</td><td><button class="btn danger remove" data-id="'+q.question_id+'">حذف</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>removeQ(Number(b.dataset.id)))}function renderBank(){const term=$('search').value.trim().toLowerCase(),existing=new Set(current.map(q=>Number(q.question_id)));const list=bank.filter(q=>!existing.has(Number(q.id))&&(!term||[q.question_text,q.subject,q.grade,q.difficulty].some(v=>String(v||'').toLowerCase().includes(term))));if(!list.length){$('bank').innerHTML='<p class="muted">سؤال قابل افزودن پیدا نشد. تعداد سؤال فعال بانک: '+bank.length+'</p>';return}$('bank').innerHTML='<table><thead><tr><th></th><th>#</th><th>سؤال</th><th>درس</th><th>پایه</th><th>سطح</th><th>امتیاز</th></tr></thead><tbody>'+list.map(q=>'<tr><td><input type="checkbox" class="pick" value="'+q.id+'" onchange="selected()"></td><td>'+q.id+'</td><td class="question">'+esc(q.question_text)+'</td><td>'+esc(q.subject)+'</td><td>'+esc(q.grade)+'</td><td>'+esc(q.difficulty)+'</td><td>'+q.score+'</td></tr>').join('')+'</tbody></table>'}async function add(ids){if(!ids.length){msg('حداقل یک سؤال انتخاب کنید.','err');return}msg('در حال افزودن...');const {error}=await sb.rpc('v5_admin_add_bank_questions_to_exam',{p_exam_id:examId,p_bank_question_ids:ids});if(error){showErr(error);return}msg('سؤال‌ها با موفقیت اضافه شدند.','ok');await loadCurrent();await loadBank()}async function removeQ(id){if(!confirm('حذف شود؟'))return;const {error}=await sb.rpc('v5_admin_remove_exam_question',{p_exam_id:examId,p_question_id:id});if(error){showErr(error);return}await loadCurrent();await loadBank();msg('سؤال حذف شد.','ok')}$('addSelected').onclick=()=>add([...document.querySelectorAll('.pick:checked')].map(x=>Number(x.value)));$('addRandom').onclick=async()=>{const n=Math.max(1,Number($('randomCount').value)||1),{data,error}=await sb.rpc('v5_admin_add_random_bank_questions_to_exam',{p_exam_id:examId,p_count:n});if(error){showErr(error);return}msg((data?.length||0)+' سؤال اضافه شد.','ok');await loadCurrent();await loadBank()};$('search').oninput=renderBank;init();</script></body></html>
