<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>رمز دانش‌آموزان | سامانه معرفت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:620px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:20px;margin:14px 0;box-shadow:0 3px 16px #0001}label{display:block;margin:14px 0 6px;font-weight:700}select,input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #d0d5dd;border-radius:9px;font:inherit}button,.btn{display:inline-block;padding:11px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;font:inherit;cursor:pointer;margin-top:16px}.secondary{background:#667085}.muted{color:#667085}.err{color:#b42318}.ok{color:#176b3a}
</style>
</head>
<body>
<main class="wrap">
<section class="card"><h1>تعیین رمز دانش‌آموز</h1><p class="muted">نام کاربری هر دانش‌آموز همان کد دانش‌آموزی اوست. تعیین رمز جدید، نشست‌های قبلی او را خارج می‌کند.</p>
<label for="student">دانش‌آموز</label><select id="student"><option value="">در حال دریافت فهرست...</option></select>
<label for="password">رمز جدید (حداقل ۸ نویسه و حداکثر ۷۲ بایت)</label><input id="password" type="password" minlength="8" autocomplete="new-password">
<label for="confirm">تکرار رمز جدید</label><input id="confirm" type="password" minlength="8" autocomplete="new-password">
<button id="save">ثبت رمز جدید</button> <a class="btn secondary" href="students.html">بازگشت</a> <a class="btn secondary" href="admin-panel.html">پنل اصلی</a>
<p id="message" class="muted" aria-live="polite"></p></section>
</main>
<script>
const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');
const student=document.getElementById('student'),password=document.getElementById('password'),confirmPassword=document.getElementById('confirm'),save=document.getElementById('save'),message=document.getElementById('message');
async function requireAdmin(){
 const {data,error}=await sb.auth.getUser();if(error)throw error;if(!data.user){location.href='admin-login-v2.html';return false}
 const {data:profile,error:profileError}=await sb.from('v5_profiles').select('role,is_active').eq('id',data.user.id).maybeSingle();
 if(profileError)throw profileError;if(!profile?.is_active||!['admin','deputy'].includes(profile.role)){await sb.auth.signOut();location.href='admin-login-v2.html';return false}
 return true;
}
async function load(){
 try{if(!await requireAdmin())return;const {data,error}=await sb.rpc('v5_admin_list_students',{p_search:''});if(error)throw error;
  student.replaceChildren(new Option('یک دانش‌آموز انتخاب کنید',''));
  for(const row of (data||[]).filter(x=>x.is_active)) student.add(new Option(String(row.full_name)+' — '+String(row.student_code),String(Number(row.id))));
  message.textContent='';
 }catch(error){message.className='err';message.textContent=error.message||'فهرست دریافت نشد.';student.innerHTML='<option value="">دسترسی ممکن نیست</option>'}
}
save.addEventListener('click',async()=>{
 message.className='muted';message.textContent='';
 if(!student.value){message.className='err';message.textContent='دانش‌آموز را انتخاب کنید.';return}
 if(password.value.length<8){message.className='err';message.textContent='رمز باید حداقل ۸ نویسه باشد.';return}
 if(new TextEncoder().encode(password.value).length>72){message.className='err';message.textContent='رمز طولانی است؛ حداکثر ۷۲ بایت مجاز است.';return}
 if(password.value!==confirmPassword.value){message.className='err';message.textContent='تکرار رمز یکسان نیست.';return}
 save.disabled=true;
 try{if(!await requireAdmin())return;const {error}=await sb.rpc('v5_admin_set_student_password',{p_student_id:Number(student.value),p_password:password.value});if(error)throw error;
  password.value='';confirmPassword.value='';message.className='ok';message.textContent='رمز جدید با موفقیت ثبت شد.';
 }catch(error){message.className='err';message.textContent='ثبت رمز انجام نشد: '+(error.message||error)}
 finally{save.disabled=false}
});
load();
</script>
</body>
</html>
