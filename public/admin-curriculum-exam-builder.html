<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>آزمون‌ساز جدید | معرفت</title><link rel="stylesheet" href="admin-curriculum.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="curriculum-ui.js"></script></head><body><main class="wrap"><header class="card"><h1>ساخت آزمون از ساختار جدید</h1><p id="who" class="muted">بررسی دسترسی...</p><a href="admin-panel.html">بازگشت</a></header><section id="app" hidden><section class="card"><div class="grid"><label>عنوان<input id="title"></label><label>کد<input id="code"></label><label>مدت<input id="duration" type="number" value="30" min="1"></label><label>سال تحصیلی<select id="academicYear"></select></label><label>نوع آزمون<select id="examKind"><option value="school">مدرسه‌ای</option><option value="final">نهایی</option><option value="konkur">کنکوری</option><option value="practice">تمرینی</option></select></label><label>کلاس‌ها<select id="classIds" multiple size="4"></select></label></div><p id="modeHelp" class="path"></p></section><section class="card"><h2>انتخاب فصل و سؤال‌ها</h2><div class="grid"><label>کتاب<select id="book"></select></label><label>فصل<select id="chapter"></select></label><label>مبحث<select id="topic"></select></label><label>زیرمبحث<select id="subtopic"></select></label><label>جست‌وجو<input id="search"></label></div><button id="filter">نمایش سؤال‌ها</button><button id="selectAll" class="secondary">انتخاب همه</button><p id="questionMsg" class="muted"></p><div id="questions"></div></section><section class="card"><button id="create">ساخت آزمون</button><p id="result" class="muted"></p></section></section></main><script src="admin-curriculum-exam-builder.js"></script></body></html>
