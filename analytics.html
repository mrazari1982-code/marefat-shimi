<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحلیل آموزشی | سامانه معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn,select{padding:11px 15px;border-radius:9px;border:0}.btn{background:#3157d5;color:#fff;font-weight:700;text-decoration:none;cursor:pointer}.secondary{background:#667085}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px}.stat{background:#f8fafc;border-radius:12px;padding:14px}.stat b{display:block;font-size:22px;margin-top:5px}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:700px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}.weak{color:#b42318;font-weight:700}.mid{color:#8a5a00;font-weight:700}.good{color:#176b3a;font-weight:700}.excellent{color:#3157d5;font-weight:700}.err{color:#b42318}.muted{color:#667085}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 style="margin:0">تحلیل آموزشی</h1><p id="userInfo" class="muted"></p></div><a class="btn secondary" href="admin.html">آزمون‌ها</a><a class="btn secondary" href="results.html">نتایج</a><button id="refresh" class="btn">به‌روزرسانی</button><button id="logout" class="btn secondary">خروج</button></div></div><div class="card"><div class="toolbar"><label>آزمون:</label><select id="exam"><option value="">همه آزمون‌ها</option></select></div></div><div class="card"><div id="stats" class="stats"></div></div><div class="card"><h2>عملکرد دانش‌آموزان</h2><div class="table"><table><thead><tr><th>دانش‌آموز</th><th>کد</th><th>تعداد آزمون</th><th>میانگین درصد</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>سطح عملکرد</th></tr></thead><tbody id="rows"></tbody></table></div></div><p id="msg" class="muted"></p><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=x=>document.getElementById(x);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function level(p){p=Number(p);if(p<50)return ['ضعیف','weak'];if(p<70)return ['متوسط','mid'];if(p<85)return ['خوب','good'];return ['عالی','excellent']}async function load(){try{$('msg').textContent='در حال دریافت تحلیل...';const {data:u}=await sb.auth.getUser();if(!u.user)throw new Error('ابتدا وارد حساب مدیر شوید.');const {data:p,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',u.user.id).maybeSingle();if(pe)throw pe;if(!p||!p.is_active||!['admin','deputy'].includes(p.role))throw new Error('دسترسی مجاز نیست.');$('userInfo').textContent='کاربر: '+(p.full_name||u.user.email)+' | نقش: '+p.role;const [{data:ex,error:ee},{data:st,error:se},{data:at,error:ae}]=await Promise.all([sb.from('v5_exams').select('id,title,exam_code').order('created_at',{ascending:false}),sb.from('v5_students').select('id,student_code,full_name'),sb.from('v5_attempts').select('exam_id,student_id,status,correct_count,wrong_count,blank_count,percentage')]);if(ee)throw ee;if(se)throw se;if(ae)throw ae;const old=$('exam').value;$('exam').innerHTML='<option value="">همه آزمون‌ها</option>'+(ex||[]).map(e=>'<option value="'+e.id+'">'+esc(e.title)+' — '+esc(e.exam_code)+'</option>').join('');$('exam').value=old;const em=new Map((ex||[]).map(e=>[e.id,e]));const sm=new Map((st||[]).map(s=>[s.id,s]));const selected=$('exam').value;const data=(at||[]).filter(a=>a.status==='submitted'&&(!selected||String(a.exam_id)===selected));const avg=data.length?(data.reduce((n,a)=>n+Number(a.percentage||0),0)/data.length).toFixed(2):'0.00';const correct=data.reduce((n,a)=>n+Number(a.correct_count||0),0),wrong=data.reduce((n,a)=>n+Number(a.wrong_count||0),0),blank=data.reduce((n,a)=>n+Number(a.blank_count||0),0);const groups=new Map();for(const a of data){if(!groups.has(a.student_id))groups.set(a.student_id,[]);groups.get(a.student_id).push(a)}$('stats').innerHTML='<div class="stat">آزمون‌های دارای نتیجه<b>'+new Set(data.map(a=>a.exam_id)).size+'</b></div><div class="stat">کل ثبت‌های نهایی<b>'+data.length+'</b></div><div class="stat">میانگین درصد<b>'+avg+'%</b></div><div class="stat">صحیح<b>'+correct+'</b></div><div class="stat">غلط<b>'+wrong+'</b></div><div class="stat">نزده<b>'+blank+'</b></div>';const arr=[...groups.entries()].map(([sid,list])=>{const s=sm.get(sid);const ap=list.reduce((n,a)=>n+Number(a.percentage||0),0)/list.length;return {s,list,ap,c:list.reduce((n,a)=>n+Number(a.correct_count||0),0),w:list.reduce((n,a)=>n+Number(a.wrong_count||0),0),b:list.reduce((n,a)=>n+Number(a.blank_count||0),0)}}).sort((a,b)=>b.ap-a.ap);$('rows').innerHTML=arr.length?arr.map(x=>{const l=level(x.ap);return '<tr><td>'+esc(x.s?.full_name||'—')+'</td><td>'+esc(x.s?.student_code||'—')+'</td><td>'+x.list.length+'</td><td><b>'+x.ap.toFixed(2)+'%</b></td><td>'+x.c+'</td><td>'+x.w+'</td><td>'+x.b+'</td><td class="'+l[1]+'">'+l[0]+'</td></tr>'}).join(''):'<tr><td colspan="8" style="text-align:center;padding:30px">نتیجه‌ای برای تحلیل وجود ندارد.</td></tr>';$('msg').textContent='تحلیل با موفقیت به‌روزرسانی شد.'}catch(e){$('msg').className='err';$('msg').textContent='تحلیل انجام نشد: '+e.message}}$('exam').onchange=load;$('refresh').onclick=load;$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin.html'};sb.auth.getSession().then(({data})=>{if(data.session)load();else $('msg').textContent='ابتدا از پنل مدیر وارد شوید.'});</script></main></body></html>
