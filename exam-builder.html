<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت آزمون جدید | معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:9px;margin:6px 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{padding:11px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#667085}.ok{color:#176b3a}.err{color:#b42318}.muted{color:#667085}</style></head><body><main class="wrap"><div class="card"><h1>ساخت آزمون جدید</h1><p id="user" class="muted"></p><a class="btn secondary" href="admin.html">بازگشت به آزمون‌ها</a></div><div class="card"><form id="form"><div class="grid"><div><label>عنوان آزمون *</label><input id="title" required></div><div><label>کد آزمون *</label><input id="code" required placeholder="مثلاً CHEM-10-001"></div><div><label>مدت آزمون (دقیقه)</label><input id="duration" type="number" min="1" value="30"></div></div><label>توضیحات</label><textarea id="description" rows="3"></textarea><div class="grid"><div><label>زمان شروع (اختیاری)</label><input id="start" type="datetime-local"></div><div><label>زمان پایان (اختیاری)</label><input id="end" type="datetime-local"></div></div><div class="grid"><label><input id="randomQ" type="checkbox"> تصادفی‌سازی سؤال‌ها</label><label><input id="randomO" type="checkbox"> تصادفی‌سازی گزینه‌ها</label><label><input id="showResult" type="checkbox" checked> نمایش نتیجه پس از ثبت</label></div><button class="btn" type="submit">ساخت آزمون</button><p id="msg" class="muted"></p></form></div></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=x=>document.getElementById(x);function iso(v){return v?new Date(v).toISOString():null}async function init(){const {data:u}=await sb.auth.getUser();if(!u.user){location.href='admin.html';return}const {data:p,error}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',u.user.id).maybeSingle();if(error||!p?.is_active||!['admin','deputy'].includes(p.role)){location.href='admin.html';return}$('user').textContent='کاربر: '+(p.full_name||u.user.email)+' | نقش: '+p.role}$('form').onsubmit=async e=>{e.preventDefault();$('msg').className='muted';$('msg').textContent='در حال ساخت...';try{const {data:u}=await sb.auth.getUser();const payload={exam_code:$('code').value.trim(),title:$('title').value.trim(),description:$('description').value.trim()||null,duration_minutes:Number($('duration').value)||30,start_at:iso($('start').value),end_at:iso($('end').value),status:'draft',randomize_questions:$('randomQ').checked,randomize_options:$('randomO').checked,show_result_to_student:$('showResult').checked,created_by:u.user.id};const {data,error}=await sb.from('v5_exams').insert(payload).select('id,exam_code,title').single();if(error)throw error;$('msg').className='ok';$('msg').textContent='آزمون با موفقیت ساخته شد و در وضعیت «پیش‌نویس» قرار گرفت. کد: '+data.exam_code;$('form').reset();$('duration').value=30;$('showResult').checked=true}catch(err){$('msg').className='err';$('msg').textContent='ساخت آزمون انجام نشد: '+err.message}};init();</script></body></html>
