<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>بانک سؤال | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.filters{display:flex;flex-wrap:wrap;gap:8px}.filters input,.filters select{padding:10px;border:1px solid #ddd;border-radius:8px}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700}.muted{color:#667085}.err{color:#b42318}.stat{font-size:24px;font-weight:800}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.opts{margin:8px 0;padding-right:20px}.opt{padding:6px;margin:4px 0;border-radius:7px;background:#f7f8fa}</style></head><body><div class="wrap"><header class="card"><h1>بانک سؤال</h1><p id="who" class="muted">در حال بررسی نشست...</p><a href="admin-panel.html">بازگشت به پنل</a></header><section id="app" class="card" style="display:none"><div class="grid"><div><div class="stat" id="count">—</div><div class="muted">تعداد سؤال‌ها</div></div><div><div class="stat" id="shown">—</div><div class="muted">نمایش فعلی</div></div></div><div class="filters"><input id="search" placeholder="جست‌وجو در متن سؤال"><select id="subject"><option value="">همه درس‌ها</option></select><select id="grade"><option value="">همه پایه‌ها</option></select><select id="difficulty"><option value="">همه سطوح</option></select><button id="reload">به‌روزرسانی</button></div><p id="msg" class="muted">در حال بارگذاری...</p><table><thead><tr><th>سؤال</th><th>درس</th><th>پایه</th><th>سختی</th><th>گزینه‌ها</th></tr></thead><tbody id="rows"></tbody></table></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let data=[];async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(s.data.session.user.email||'');$('app').style.display='block';await load()}async function load(){const r=await sb.from('v5_questions').select('*').order('id',{ascending:false}).limit(500);if(r.error){$('msg').className='err';$('msg').textContent='خطا در دریافت بانک سؤال: '+r.error.message;return}data=r.data||[];$('count').textContent=data.length;fillFilters();render()}function values(key){return [...new Set(data.map(x=>x[key]).filter(v=>v!==null&&v!==undefined&&v!==''))]}function fillFilters(){for(const [id,key] of [['subject','subject'],['grade','grade'],['difficulty','difficulty']]){$(id).innerHTML='<option value="">همه</option>'+values(key).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}}function render(){const s=$('search').value.trim().toLowerCase(),sub=$('subject').value,g=$('grade').value,d=$('difficulty').value;const rows=data.filter(x=>(!s||String(x.question_text||x.text||'').toLowerCase().includes(s))&&(!sub||String(x.subject)==sub)&&(!g||String(x.grade)==g)&&(!d||String(x.difficulty)==d));$('shown').textContent=rows.length;$('msg').textContent=rows.length?'':'سؤالی مطابق فیلترها پیدا نشد.';$('rows').innerHTML=rows.map(x=>{const opts=Array.isArray(x.options)?x.options:[];return '<tr><td>'+esc(x.question_text||x.text||'—')+'</td><td>'+esc(x.subject)+'</td><td>'+esc(x.grade)+'</td><td>'+esc(x.difficulty)+'</td><td><div class="opts">'+opts.map(o=>'<div class="opt">'+esc(o.text||o.option_text||o.label||o)+'</div>').join('')+'</div></td></tr>'}).join('')}['search','subject','grade','difficulty'].forEach(id=>$(id).addEventListener('input',render));$('reload').onclick=load;init();</script></body></html>
