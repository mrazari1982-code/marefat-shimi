<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #ddd;border-radius:8px}.q{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0;background:#fff}.q label{display:block;cursor:pointer}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#667085}</style></head><body><div class="wrap"><header class="card"><h1>ساخت آزمون از بانک سؤال</h1><p id="who" class="muted">در حال بررسی دسترسی...</p><a href="admin-panel.html">بازگشت به پنل</a></header><section id="app" style="display:none"><section class="card"><h2>مشخصات آزمون</h2><div class="grid"><label>عنوان آزمون<input id="title" placeholder="مثلاً آزمون شیمی دهم"></label><label>کد آزمون<input id="code" placeholder="مثلاً CHEM-10-01"></label><label>مدت (دقیقه)<input id="duration" type="number" min="1" value="30"></label></div></section><section class="card"><h2>انتخاب سؤال‌ها</h2><div class="filters"><input id="search" placeholder="جست‌وجو در سؤال"><select id="subject"><option value="">همه درس‌ها</option></select><select id="grade"><option value="">همه پایه‌ها</option></select><button id="selectAll" class="secondary">انتخاب همه نمایش‌داده‌شده</button></div><p id="msg" class="muted">در حال بارگذاری بانک سؤال...</p><div id="questions"></div></section><section class="card"><button id="create">ساخت آزمون و Snapshot سؤال‌ها</button><p id="result" class="muted"></p></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let bank=[];let sessionUser=null;async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}sessionUser=s.data.session.user;const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(sessionUser.email||'');$('app').style.display='block';await loadBank()}async function loadBank(){const r=await sb.from('v5_question_bank').select('*').order('id',{ascending:false}).limit(500);if(r.error){$('msg').className='err';$('msg').textContent='بانک سؤال قابل دریافت نیست: '+r.error.message;return}bank=r.data||[];fill();render()}function vals(k){return [...new Set(bank.map(x=>x[k]).filter(v=>v!==null&&v!==undefined&&v!==''))]}function fill(){for(const [id,k] of [['subject','subject'],['grade','grade']])$(id).innerHTML='<option value="">همه</option>'+vals(k).map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('')}function filtered(){const s=$('search').value.trim().toLowerCase(),sub=$('subject').value,g=$('grade').value;return bank.filter(x=>(!s||String(x.question_text||x.text||'').toLowerCase().includes(s))&&(!sub||String(x.subject)==sub)&&(!g||String(x.grade)==g))}function render(){const rows=filtered();$('msg').textContent=rows.length?'تعداد سؤال‌های نمایش‌داده‌شده: '+rows.length:'سؤالی پیدا نشد.';$('questions').innerHTML=rows.map(x=>'<div class="q"><label><input type="checkbox" class="pick" value="'+esc(x.id)+'"> <b>'+esc(x.question_text||x.text||'بدون متن')+'</b></label><small class="muted"> '+esc(x.subject||'')+' | پایه '+esc(x.grade||'')+' | سختی '+esc(x.difficulty||'')+'</small></div>').join('')}['search','subject','grade'].forEach(id=>$(id).addEventListener('input',render));$('selectAll').onclick=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=true);async function fail(message){$('result').className='err';$('result').textContent=message}async function build(){const title=$('title').value.trim(),code=$('code').value.trim(),duration=Number($('duration').value),ids=[...document.querySelectorAll('.pick:checked')].map(x=>Number(x.value));if(!title||!code||!duration||!ids.length)return fail('عنوان، کد، مدت و حداقل یک سؤال لازم است.');const dup=await sb.from('v5_exams').select('id').eq('exam_code',code).maybeSingle();if(dup.error)return fail('بررسی کد آزمون انجام نشد: '+dup.error.message);if(dup.data)return fail('این کد آزمون قبلاً استفاده شده است.');const e=await sb.from('v5_exams').insert({title,exam_code:code,duration_minutes:duration,status:'draft',created_by:sessionUser.id}).select('id').single();if(e.error)return fail('ساخت آزمون انجام نشد: '+e.error.message);const examId=e.data.id;const createdQuestions=[];try{for(let i=0;i<ids.length;i++){const bankId=ids[i];const b=bank.find(x=>Number(x.id)===bankId);if(!b)throw new Error('سؤال بانک پیدا نشد: '+bankId);let qr=await sb.from('v5_questions').select('id').eq('bank_question_id',bankId).maybeSingle();if(qr.error)throw qr.error;let questionId=qr.data?.id;if(!questionId){const ins=await sb.from('v5_questions').insert({bank_question_id:bankId,subject_id:b.subject_id,topic_id:b.topic_id,source_id:b.source_id,question_type:b.question_type,difficulty:b.difficulty,question_text:b.question_text,explanation:b.explanation,page_number:b.source_page,score:b.score,created_by:sessionUser.id}).select('id').single();if(ins.error)throw ins.error;questionId=ins.data.id;createdQuestions.push(questionId);const opts=await sb.from('v5_question_bank_options').select('option_key,option_text,is_correct,sort_order').eq('question_id',bankId).order('sort_order');if(opts.error)throw opts.error;if(!opts.data?.length)throw new Error('برای سؤال '+bankId+' گزینه‌ای در بانک ثبت نشده است.');const oi=await sb.from('v5_question_options').insert(opts.data.map(o=>({question_id:questionId,option_key:o.option_key,option_text:o.option_text,is_correct:o.is_correct,sort_order:o.sort_order})));if(oi.error)throw oi.error}const link=await sb.from('v5_exam_questions').insert({exam_id:examId,question_id:questionId,question_order:i+1,score:b.score}).select('id').single();if(link.error)throw link.error}$('result').className='ok';$('result').textContent='آزمون با موفقیت ساخته شد و '+ids.length+' سؤال به‌صورت Snapshot به آن متصل شد. شناسه آزمون: '+examId}catch(err){await sb.from('v5_exam_questions').delete().eq('exam_id',examId);for(const qid of createdQuestions){await sb.from('v5_question_options').delete().eq('question_id',qid);await sb.from('v5_questions').delete().eq('id',qid)}await sb.from('v5_exams').delete().eq('id',examId);return fail('ساخت کامل نشد و تغییرات ایجادشده تا حد امکان برگشت داده شد: '+(err.message||err))}}$('create').onclick=build;init();</script></body></html>
