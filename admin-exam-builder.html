<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ساخت آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters input,.filters select{padding:10px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}.q{border:1px solid #e5e7eb;border-radius:12px;padding:14px;margin:10px 0;background:#fff}.q label{display:block;cursor:pointer}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.secondary{background:#667085}button:disabled{opacity:.55;cursor:not-allowed}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}.grid{grid-template-columns:1fr}h1{font-size:22px}.filters>*{width:100%}}</style></head><body><div class="wrap"><header class="card"><h1>ساخت آزمون از بانک سؤال</h1><p id="who" class="muted">در حال بررسی دسترسی...</p><a href="admin-panel.html">بازگشت به پنل</a></header><section id="app" style="display:none"><section class="card"><h2>مشخصات آزمون</h2><div class="grid"><label>عنوان آزمون<input id="title" placeholder="مثلاً آزمون شیمی دهم"></label><label>کد آزمون<input id="code" placeholder="مثلاً CHEM-10-01"></label><label>مدت (دقیقه)<input id="duration" type="number" min="1" max="600" value="30"></label></div></section><section class="card"><h2>انتخاب سؤال‌ها</h2><div class="filters"><input id="search" placeholder="جست‌وجو در سؤال"><select id="subject"><option value="">همه درس‌ها</option></select><select id="grade"><option value="">همه پایه‌ها</option></select><select id="difficulty"><option value="">همه سطوح</option></select><button id="selectAll" class="secondary" type="button">انتخاب همه نمایش‌داده‌شده</button></div><p id="msg" class="muted">در حال بارگذاری بانک سؤال...</p><div id="questions"></div></section><section class="card"><button id="create" type="button">ساخت آزمون و Snapshot سؤال‌ها</button><p id="result" class="muted" aria-live="polite"></p></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let bank=[];async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(s.data.session.user.email||'');$('app').style.display='block';await loadBank()}async function loadBank(){const r=await sb.rpc('v5_get_staff_question_bank',{p_search:$('search').value.trim()||null,p_subject:$('subject').value||null,p_grade:$('grade').value||null,p_difficulty:$('difficulty').value||null,p_limit:500});if(r.error){$('msg').className='err';$('msg').textContent='بانک سؤال قابل دریافت نیست: '+r.error.message;return}bank=r.data||[];fill();render()}function vals(k){return [...new Set(bank.map(x=>x[k]).filter(v=>v!==null&&v!==undefined&&v!==''))]}function fill(){for(const [id,k] of [['subject','subject'],['grade','grade'],['difficulty','difficulty']]){const old=$(id).value;const vs=vals(k);$(id).innerHTML='<option value="">همه</option>'+vs.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');if(vs.includes(old))$(id).value=old}}function render(){const rows=bank;$('msg').textContent=rows.length?'تعداد سؤال‌های نمایش‌داده‌شده: '+rows.length:'سؤالی پیدا نشد.';$('questions').innerHTML=rows.map(x=>'<div class="q"><label><input type="checkbox" class="pick" value="'+esc(x.id)+'"> <b>'+esc(x.question_text||'بدون متن')+'</b></label><small class="muted"> '+esc(x.subject||'')+' | پایه '+esc(x.grade||'')+' | سختی '+esc(x.difficulty||'')+'</small></div>').join('')}['search','subject','grade','difficulty'].forEach(id=>$(id).addEventListener('change',loadBank));$('search').addEventListener('input',()=>{clearTimeout(window._d);window._d=setTimeout(loadBank,250)});$('selectAll').onclick=()=>document.querySelectorAll('.pick').forEach(x=>x.checked=true);async function build(){const title=$('title').value.trim(),code=$('code').value.trim(),duration=Number($('duration').value),ids=[...document.querySelectorAll('.pick:checked')].map(x=>Number(x.value));if(!title||!code||!duration||!ids.length){$('result').className='err';$('result').textContent='عنوان، کد، مدت و حداقل یک سؤال لازم است.';return}$('create').disabled=true;$('result').className='muted';$('result').textContent='در حال ساخت آزمون امن در سرور...';try{const r=await sb.rpc('v5_staff_build_exam',{p_title:title,p_exam_code:code,p_duration_minutes:duration,p_question_ids:ids});if(r.error)throw r.error;$('result').className='ok';$('result').textContent='آزمون با موفقیت ساخته شد و '+ids.length+' سؤال به‌صورت Snapshot ثبت شد. شناسه آزمون: '+r.data}catch(e){console.error(e);$('result').className='err';$('result').textContent='ساخت آزمون انجام نشد: '+(e.message||e)}finally{$('create').disabled=false}}$('create').onclick=build;init();</script></body></html>
