<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>نتایج آزمون‌ها | سامانه معرفت</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn,select,input{padding:11px 14px;border-radius:9px;border:1px solid #d9dee8;box-sizing:border-box}.btn{border:0;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.btn.secondary{background:#667085}select{min-width:280px;background:#fff}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:900px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right}th{background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:700}.submitted{background:#e8f7ee;color:#176b3a}.started{background:#fff4d6;color:#8a5a00}.expired{background:#f1f1f1;color:#667085}.ok{color:#176b3a;font-weight:700}.muted{color:#667085}.err{color:#b42318}.empty{text-align:center;padding:35px}.hidden{display:none}.stat{display:inline-block;margin-left:18px}.percent{font-weight:800}
</style>
</head>
<body><main class="wrap">
<section id="login" class="card"><h1>نتایج آزمون‌ها</h1><p class="muted">ورود مدیر برای مشاهده نتایج دانش‌آموزان</p><input id="email" type="email" placeholder="ایمیل مدیر" autocomplete="username"><br><input id="password" type="password" placeholder="رمز عبور" autocomplete="current-password"><br><button id="loginBtn" class="btn">ورود مدیر</button><p id="loginMsg" class="muted"></p></section>
<section id="panel" class="hidden"><div class="card"><div class="toolbar"><div style="flex:1"><h1 style="margin:0">نتایج آزمون‌ها</h1><p id="userInfo" class="muted"></p></div><select id="examFilter"><option value="">همه آزمون‌ها</option></select><button id="refreshBtn" class="btn">به‌روزرسانی</button><button id="logoutBtn" class="btn secondary">خروج</button></div></div>
<div class="card"><div id="summary" class="muted">در حال دریافت نتایج...</div><div class="table-wrap"><table id="resultTable" class="hidden"><thead><tr><th>آزمون</th><th>دانش‌آموز</th><th>کد دانش‌آموز</th><th>وضعیت</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>درصد</th><th>شروع</th><th>ثبت نهایی</th></tr></thead><tbody></tbody></table></div></div></section>
<script>
const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');
const $=id=>document.getElementById(id);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function fmt(d){return d?new Date(d).toLocaleString('fa-IR'):'—'}
function badge(s){const t=s==='submitted'?'ثبت نهایی':s==='started'?'در حال انجام':s==='expired'?'منقضی شده':'نامشخص';return '<span class="badge '+esc(s)+'">'+t+'</span>'}
let allRows=[];
async function verifyUser(){const {data:userData}=await sb.auth.getUser();if(!userData.user){showLogin();return null}const {data:profile,error}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',userData.user.id).maybeSingle();if(error)throw error;if(!profile||!profile.is_active||!['admin','deputy'].includes(profile.role))throw new Error('دسترسی مشاهده نتایج برای این حساب مجاز نیست.');$('userInfo').textContent='کاربر: '+(profile.full_name||userData.user.email)+' | نقش: '+profile.role;return userData.user}
async function loadResults(){
 $('summary').className='muted';$('summary').textContent='در حال دریافت نتایج...';$('resultTable').classList.add('hidden');
 await verifyUser();
 const [{data:exams,error:ee},{data:students,error:se},{data:attempts,error:ae}]=await Promise.all([
  sb.from('v5_exams').select('id,exam_code,title').order('created_at',{ascending:false}),
  sb.from('v5_students').select('id,student_code,full_name'),
  sb.from('v5_attempts').select('id,exam_id,student_id,status,correct_count,wrong_count,blank_count,percentage,started_at,submitted_at').order('started_at',{ascending:false})
 ]);
 if(ee)throw ee;if(se)throw se;if(ae)throw ae;
 const examMap=new Map((exams||[]).map(x=>[x.id,x]));const studentMap=new Map((students||[]).map(x=>[x.id,x]));
 allRows=(attempts||[]).map(a=>({a,e:examMap.get(a.exam_id),s:studentMap.get(a.student_id)})).filter(x=>x.e&&x.s);
 const current=$('examFilter').value;
 $('examFilter').innerHTML='<option value="">همه آزمون‌ها</option>'+(exams||[]).map(e=>'<option value="'+e.id+'">'+esc(e.title)+' — '+esc(e.exam_code)+'</option>').join('');$('examFilter').value=current;
 renderResults();
}
function renderResults(){const filter=$('examFilter').value;const rows=filter?allRows.filter(x=>String(x.a.exam_id)===filter):allRows;const submitted=rows.filter(x=>x.a.status==='submitted');const avg=submitted.length?(submitted.reduce((n,x)=>n+Number(x.a.percentage||0),0)/submitted.length).toFixed(2):'0.00';$('summary').innerHTML='<span class="stat">کل تلاش‌ها: <b>'+rows.length+'</b></span><span class="stat">ثبت نهایی: <b>'+submitted.length+'</b></span><span class="stat">میانگین درصد: <b class="percent">'+avg+'%</b></span>';$('resultTable').querySelector('tbody').innerHTML=rows.length?rows.map(x=>'<tr><td><b>'+esc(x.e.title)+'</b><br><small class="muted">'+esc(x.e.exam_code)+'</small></td><td>'+esc(x.s.full_name)+'</td><td>'+esc(x.s.student_code)+'</td><td>'+badge(x.a.status)+'</td><td>'+Number(x.a.correct_count||0)+'</td><td>'+Number(x.a.wrong_count||0)+'</td><td>'+Number(x.a.blank_count||0)+'</td><td><b>'+Number(x.a.percentage||0).toFixed(2)+'%</b></td><td>'+fmt(x.a.started_at)+'</td><td>'+fmt(x.a.submitted_at)+'</td></tr>').join(''):'<tr><td colspan="10" class="empty">نتیجه‌ای برای نمایش وجود ندارد.</td></tr>';$('resultTable').classList.remove('hidden')}
function showLogin(){$('login').classList.remove('hidden');$('panel').classList.add('hidden')}
async function login(){ $('loginBtn').disabled=true;$('loginMsg').textContent='در حال ورود...';try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('login').classList.add('hidden');$('panel').classList.remove('hidden');await loadResults()}catch(e){$('loginMsg').className='err';$('loginMsg').textContent='ورود انجام نشد: '+e.message}finally{$('loginBtn').disabled=false}}
$('loginBtn').onclick=login;$('examFilter').onchange=renderResults;$('refreshBtn').onclick=()=>loadResults().catch(e=>{$('summary').className='err';$('summary').textContent=e.message});$('logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin()};
sb.auth.getSession().then(({data})=>{if(data.session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadResults().catch(e=>{$('summary').className='err';$('summary').textContent=e.message})}});
</script></main></body></html>
