<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به آزمون | سامانه معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:700px;margin:auto;padding:22px}.card{background:#fff;border-radius:16px;padding:22px;margin:16px 0;box-shadow:0 3px 16px #0001}.btn{padding:11px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.err{color:#b42318}.muted{color:#667085}.ok{color:#176b3a}input{padding:11px;border:1px solid #ddd;border-radius:8px;width:100%;box-sizing:border-box;margin:8px 0 14px}</style></head><body><main class="wrap"><section class="card"><h1>ورود به آزمون</h1><p id="examInfo" class="muted">در حال بررسی لینک آزمون...</p><div id="form" style="display:none"><label>کد دانش‌آموز</label><input id="studentCode" autocomplete="off" placeholder="کد دانش‌آموز را وارد کنید"><button id="startBtn" class="btn">شروع آزمون</button></div><p id="msg" class="muted"></p></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const token=new URLSearchParams(location.search).get('token');let exam=null;async function init(){if(!token){$('examInfo').className='err';$('examInfo').textContent='لینک آزمون معتبر نیست.';return}const {data:link,error}=await sb.from('v5_exam_links').select('exam_id,is_active,expires_at').eq('token',token).maybeSingle();if(error)throw error;if(!link||!link.is_active||(link.expires_at&&new Date(link.expires_at)<new Date())){ $('examInfo').className='err';$('examInfo').textContent='این لینک آزمون فعال یا معتبر نیست.';return}const {data:e,error:ee}=await sb.from('v5_exams').select('id,title,exam_code,status,duration_minutes').eq('id',link.exam_id).maybeSingle();if(ee)throw ee;if(!e||e.status!=='published'){throw new Error('آزمون منتشر نشده است.')}exam=e;$('examInfo').innerHTML='<b>'+e.title+'</b><br>کد آزمون: '+e.exam_code+'<br>مدت: '+(e.duration_minutes||'بدون محدودیت')+' دقیقه';$('form').style.display='block'}$('startBtn').onclick=async()=>{const code=$('studentCode').value.trim();if(!code){$('msg').className='err';$('msg').textContent='کد دانش‌آموز را وارد کنید.';return} $('startBtn').disabled=true;$('msg').textContent='در حال بررسی...';try{const {data:s,error}=await sb.from('v5_students').select('id,student_code,full_name,is_active').eq('student_code',code).maybeSingle();if(error)throw error;if(!s||!s.is_active)throw new Error('دانش‌آموز فعال با این کد پیدا نشد.');location.href='exam.html?exam_id='+encodeURIComponent(exam.id)+'&student_id='+encodeURIComponent(s.id)}catch(e){$('msg').className='err';$('msg').textContent=e.message}finally{$('startBtn').disabled=false}};init().catch(e=>{$('examInfo').className='err';$('examInfo').textContent='خطا در بررسی لینک: '+e.message})</script></body></html>
