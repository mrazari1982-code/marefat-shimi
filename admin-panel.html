<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:24px;font-weight:800}.muted{color:#667085}.err{color:#b42318}.hidden{display:none}button{padding:10px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b42318}a{display:inline-block;color:#3157d5;font-weight:700;text-decoration:none;padding:10px 0}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right;white-space:nowrap}select{padding:8px;border:1px solid #ddd;border-radius:8px;margin:4px}.nav{display:flex;gap:12px;flex-wrap:wrap}.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}.stat{font-size:21px}.nav{gap:6px}.nav a{padding:8px;font-size:14px}}</style></head><body><div class="wrap"><header class="card"><h1>پنل مدیر سامانه آزمون معرفت</h1><p id="who" class="muted">در حال بررسی نشست...</p><div class="nav"><a href="admin-analytics.html">تحلیل آموزشی</a><a href="admin-question-bank.html">بانک سؤال</a><a href="admin-exam-builder.html">ساخت آزمون</a><a href="admin-exam-publish.html">انتشار آزمون</a><a href="admin-exam-links.html">لینک آزمون</a><a href="admin-report.html">گزارش کارنامه</a></div><button id="logout" class="danger">خروج</button></header><section id="app" class="hidden"><div class="grid"><div class="card"><div class="stat" id="examCount">—</div><div class="muted">آزمون‌ها</div></div><div class="card"><div class="stat" id="questionCount">—</div><div class="muted">سؤال‌ها</div></div><div class="card"><div class="stat" id="attemptCount">—</div><div class="muted">شرکت‌ها</div></div><div class="card"><div class="stat" id="avgScore">—</div><div class="muted">میانگین درصد</div></div></div><section class="card"><h2>نتایج دانش‌آموزان</h2><div><label>آزمون: <select id="examFilter"><option value="">همه آزمون‌ها</option></select></label></div><p id="resultMsg" class="muted">در حال بارگذاری...</p><div class="table-wrap"><table><thead><tr><th>دانش‌آموز</th><th>آزمون</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>درصد</th><th>وضعیت</th><th>کارنامه</th></tr></thead><tbody id="results"></tbody></table></div></section><section class="card"><h2>آزمون‌های موجود</h2><p id="examMsg" class="muted">در حال بارگذاری...</p><div class="table-wrap"><table><thead><tr><th>عنوان</th><th>کد</th><th>وضعیت</th><th>مدت</th></tr></thead><tbody id="exams"></tbody></table></div></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let exams=[];async function init(){const s=await sb.auth.getSession();const session=s.data.session;if(!session){location.href='admin-login-v2.html';return}const staff=await sb.rpc('v5_is_staff');if(staff.error||staff.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(session.user.email||'');$('app').classList.remove('hidden');await load()}async function load(){try{const [e,q,a]=await Promise.all([sb.from('v5_exams').select('*',{count:'exact',head:true}),sb.from('v5_questions').select('*',{count:'exact',head:true}),sb.from('v5_attempts').select('percentage')]);$('examCount').textContent=e.count??0;$('questionCount').textContent=q.count??0;$('attemptCount').textContent=a.data?.length??0;$('avgScore').textContent=a.data?.length?(a.data.reduce((s,x)=>s+Number(x.percentage||0),0)/a.data.length).toFixed(2)+'%':'0%';const er=await sb.from('v5_exams').select('id,exam_code,title,status,duration_minutes').order('id',{ascending:false}).limit(50);if(er.error)throw er.error;exams=er.data||[];$('examMsg').textContent=exams.length?'':'آزمونی ثبت نشده است.';$('exams').innerHTML=exams.map(x=>'<tr><td>'+esc(x.title)+'</td><td>'+esc(x.exam_code)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.duration_minutes??'—')+'</td></tr>').join('');$('examFilter').innerHTML='<option value="">همه آزمون‌ها</option>'+exams.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');await loadResults()}catch(e){$('examMsg').className='err';$('examMsg').textContent='بارگذاری انجام نشد: '+esc(e.message||e)}}async function loadResults(){const examId=$('examFilter').value;let q=sb.from('v5_attempts').select('id,exam_id,student_id,correct_count,wrong_count,blank_count,percentage,status,started_at,submitted_at').order('submitted_at',{ascending:false}).limit(100);if(examId)q=q.eq('exam_id',examId);const r=await q;if(r.error){$('resultMsg').className='err';$('resultMsg').textContent='نتایج قابل دریافت نیست: '+r.error.message;return}const students=await sb.from('v5_students').select('id,full_name,student_code');const sm=new Map((students.data||[]).map(x=>[x.id,x]));const em=new Map(exams.map(x=>[x.id,x]));$('resultMsg').textContent=r.data.length?'':'هنوز نتیجه‌ای ثبت نشده است.';$('results').innerHTML=(r.data||[]).map(x=>{const st=sm.get(x.student_id),ex=em.get(x.exam_id);return '<tr><td>'+esc(st?.full_name||('دانش‌آموز '+x.student_id))+'</td><td>'+esc(ex?.title||x.exam_id)+'</td><td>'+x.correct_count+'</td><td>'+x.wrong_count+'</td><td>'+x.blank_count+'</td><td>'+Number(x.percentage||0).toFixed(2)+'%</td><td>'+esc(x.status)+'</td><td><a href="admin-report.html?attempt='+encodeURIComponent(x.id)+'">مشاهده</a></td></tr>'}).join('')}$('examFilter').onchange=loadResults;$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin-login-v2.html'};init();</script></body></html>
