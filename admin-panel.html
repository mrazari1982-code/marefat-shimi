<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}button{padding:10px 16px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.danger{background:#b42318}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.stat{font-size:24px;font-weight:800}.muted{color:#667085}.err{color:#b42318}.hidden{display:none}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}</style></head><body><div class="wrap"><header class="card"><h1>پنل مدیر سامانه آزمون معرفت</h1><p id="who" class="muted">در حال بررسی نشست...</p><button id="logout" class="danger">خروج</button></header><section id="app" class="hidden"><div class="grid"><div class="card"><div class="stat" id="examCount">—</div><div class="muted">آزمون‌ها</div></div><div class="card"><div class="stat" id="questionCount">—</div><div class="muted">سؤال‌ها</div></div><div class="card"><div class="stat" id="attemptCount">—</div><div class="muted">دفعات شرکت</div></div></div><section class="card"><h2>آزمون‌های موجود</h2><p id="msg" class="muted">در حال بارگذاری...</p><table><thead><tr><th>عنوان</th><th>کد</th><th>وضعیت</th></tr></thead><tbody id="exams"></tbody></table></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function init(){const s=await sb.auth.getSession();const session=s.data.session;if(!session){location.href='admin-login-v2.html';return}const staff=await sb.rpc('v5_is_staff');if(staff.error||staff.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(session.user.email||'');$('app').classList.remove('hidden');await load()}async function load(){try{const [e,q,a]=await Promise.all([sb.from('v5_exams').select('*',{count:'exact',head:true}),sb.from('v5_questions').select('*',{count:'exact',head:true}),sb.from('v5_attempts').select('*',{count:'exact',head:true})]);$('examCount').textContent=e.count??0;$('questionCount').textContent=q.count??0;$('attemptCount').textContent=a.count??0;const rows=await sb.from('v5_exams').select('*').order('id',{ascending:false}).limit(50);if(rows.error)throw rows.error;$('msg').textContent=rows.data.length?'':'آزمونی ثبت نشده است.';$('exams').innerHTML=rows.data.map(x=>'<tr><td>'+esc(x.title||'بدون عنوان')+'</td><td>'+esc(x.exam_code||x.code||'—')+'</td><td>فعال</td></tr>').join('')}catch(e){$('msg').className='err';$('msg').textContent='بارگذاری انجام نشد: '+(e.message||e)}}function esc(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('logout').onclick=async()=>{await sb.auth.signOut();location.href='admin-login-v2.html'};init();</script></body></html>
