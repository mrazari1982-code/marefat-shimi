<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><h2>ورود مدیر</h2><p id="msg">ایمیل و رمز عبور مدیر را وارد کنید.</p><label>ایمیل <input id="email" type="email" autocomplete="username"></label><br><label>رمز عبور <input id="password" type="password" autocomplete="current-password"></label><br><button id="login">ورود</button><section id="panel" hidden><h2>پنل مدیر باز شد</h2><p id="user"></p><button id="logout">خروج</button></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function login(){const email=$('email').value.trim(),password=$('password').value;$('login').disabled=true;$('msg').textContent='در حال ورود...';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const s=await sb.rpc('v5_is_staff');if(s.error)throw s.error;if(s.data!==true)throw new Error('این حساب دسترسی مدیر ندارد.');$('login').hidden=true;$('panel').hidden=false;$('user').textContent='حساب مدیر: '+r.data.user.email}catch(e){$('msg').textContent='ورود انجام نشد: '+(e.message||e);$('login').disabled=false}}$('login').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('logout').onclick=async()=>{await sb.auth.signOut();location.reload()};</script></body></html>
