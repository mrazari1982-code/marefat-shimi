<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin-login-fix.js"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;margin:0}.wrap{max-width:900px;margin:auto;padding:20px}.card{background:#fff;padding:24px;border-radius:16px;margin-top:20px;box-shadow:0 4px 18px #0001}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #ddd;border-radius:10px}button{padding:12px 22px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:bold;cursor:pointer}.hidden{display:none}.error{color:#b42318}.success{color:#067647}</style></head>
<body><div class="wrap"><div class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>پنل مدیریت — نسخه آزمایشی پایدار</p></div>
<section id="login" class="card"><h2>ورود مدیر</h2><p id="msg">ایمیل و رمز عبور مدیر را وارد کنید.</p><form id="loginForm"><label>ایمیل</label><input id="email" type="email" autocomplete="username" required><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn" type="submit">ورود</button></form></section>
<section id="panel" class="card hidden"><h2>پنل مدیر</h2><p class="success">ورود مدیر با موفقیت انجام شد. ✅</p><p id="user"></p><button id="logout">خروج</button></section></div>
<script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function login(e){e.preventDefault();$('loginBtn').disabled=true;$('msg').textContent='در حال ورود...';try{const data=await window.marefatAdminLogin(sb,$('email').value.trim(),$('password').value);$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('user').textContent='حساب: '+(data.user?.email||$('email').value.trim());}catch(err){$('msg').className='error';$('msg').textContent='ورود انجام نشد: '+(err.message||err.error_description||String(err));$('loginBtn').disabled=false}}$('loginForm').addEventListener('submit',login);$('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});</script></body></html>
