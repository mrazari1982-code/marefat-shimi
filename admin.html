<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیر | آزمون‌های معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}input{padding:11px;border:1px solid #ddd;border-radius:8px;width:min(100%,360px);box-sizing:border-box;margin:6px 0}.btn{padding:10px 14px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;margin:2px}.btn.secondary{background:#667085}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:1100px}th,td{padding:12px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8fafc}.badge{display:inline-block;padding:5px 9px;border-radius:999px;font-size:13px;font-weight:700}.published{background:#e8f7ee;color:#176b3a}.draft{background:#fff4d6;color:#8a5a00}.closed{background:#f1f1f1;color:#667085}.empty{text-align:center;padding:35px}.hidden{display:none}.actions{white-space:nowrap}.linkbox{margin-top:7px;word-break:break-all}</style></head><body><main class="wrap"><section id="login" class="card"><h1>پنل مدیر مدرسه معرفت</h1><p class="muted">مشاهده و مدیریت آزمون‌های سامانه V5</p><label>ایمیل مدیر</label><br><input id="email" type="email" autocomplete="username"><br><label>رمز عبور</label><br><input id="password" type="password" autocomplete="current-password"><br><button id="loginBtn" class="btn">ورود مدیر</button><p id="loginMsg" class="muted"></p></section><section id="panel" class="hidden"><div class="card"><div class="toolbar"><div style="flex:1"><h1 style="margin:0">آزمون‌ها</h1><p id="userInfo" class="muted"></p></div><a class="btn" href="students.html">مدیریت دانش‌آموزان</a><a class="btn" href="admin-question-bank.html">بانک سؤال V5</a><a class="btn" href="exam-builder.html">ساخت آزمون جدید</a><a class="btn" href="results.html">مشاهده نتایج دانش‌آموزان</a><a class="btn" href="analytics.html">تحلیل آموزشی</a><button id="refreshBtn" class="btn">به‌روزرسانی</button><button id="logoutBtn" class="btn secondary">خروج</button></div></div><div class="card"><div id="msg" class="muted">در حال دریافت آزمون‌ها...</div><div class="table-wrap"><table id="examTable" class="hidden"><thead><tr><th>عنوان</th><th>کد آزمون</th><th>وضعیت</th><th>تعداد سؤال</th><th>مدت</th><th>شروع</th><th>پایان</th><th>لینک آزمون</th><th>مدیریت</th></tr></thead><tbody></tbody></table></div></div></section><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function fmt(d){return d?new Date(d).toLocaleString('fa-IR'):'—'}function badge(s){const t=s==='published'?'منتشر شده':s==='draft'?'پیش‌نویس':s==='closed'?'بسته':'نامشخص';return '<span class="badge '+esc(s)+'">'+t+'</span>'}async function getActiveLink(examId){const {data,error}=await sb.from('v5_exam_links').select('id,token,is_active,expires_at').eq('exam_id',examId).eq('is_active',true).order('created_at',{ascending:false}).limit(1).maybeSingle();if(error)throw error;if(data)return data;const {data:rpc,error:re}=await sb.rpc('v5_ensure_exam_link',{p_exam_id:examId});if(!re&&rpc)return {token:rpc,is_active:true};return null}async function loadExams(){ $('msg').className='muted';$('msg').textContent='در حال دریافت آزمون‌ها...';$('examTable').classList.add('hidden');const {data:userData}=await sb.auth.getUser();if(!userData.user)return showLogin();const {data:profile,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',userData.user.id).maybeSingle();if(pe)throw pe;if(!profile||!profile.is_active||!['admin','deputy'].includes(profile.role))throw new Error('دسترسی پنل مدیر برای این حساب مجاز نیست.');$('userInfo').textContent='کاربر: '+(profile.full_name||userData.user.email)+' | نقش: '+profile.role;const {data:exams,error}=await sb.from('v5_exams').select('id,exam_code,title,description,duration_minutes,start_at,end_at,status,created_at').order('created_at',{ascending:false});if(error)throw error;const rows=[];for(const e of exams||[]){const {count,error:ce}=await sb.from('v5_exam_questions').select('id',{count:'exact',head:true}).eq('exam_id',e.id);if(ce)throw ce;let link=null;if(e.status==='published')link=await getActiveLink(e.id);rows.push({e,count:count||0,link})}$('examTable').querySelector('tbody').innerHTML=rows.length?rows.map(({e,count,link})=>{const url=link&&link.token?'exam-access.html?token='+encodeURIComponent(link.token):'';let linkCell='';if(e.status==='published'&&url){linkCell='<span class="ok">فعال</span><div class="linkbox"><a href="'+url+'" target="_blank">باز کردن لینک آزمون</a></div>'}else if(e.status==='published'){linkCell='<span class="muted">لینک هنوز آماده نشده است</span>'}else{linkCell='<span class="muted">پس از انتشار خودکار ایجاد می‌شود</span>'}return '<tr><td><b>'+esc(e.title)+'</b><br><small class="muted">'+esc(e.description||'')+'</small></td><td>'+esc(e.exam_code)+'</td><td>'+badge(e.status)+'</td><td>'+count+'</td><td>'+(e.duration_minutes?e.duration_minutes+' دقیقه':'بدون محدودیت')+'</td><td>'+fmt(e.start_at)+'</td><td>'+fmt(e.end_at)+'</td><td>'+linkCell+'</td><td class="actions"><a class="btn" href="exam-questions.html?exam_id='+encodeURIComponent(e.id)+'">مدیریت سؤال‌ها</a></td></tr>'}).join(''):'<tr><td colspan="9" class="empty">هیچ آزمونی ثبت نشده است.</td></tr>';$('msg').textContent=rows.length+' آزمون یافت شد.';$('examTable').classList.remove('hidden')}function showLogin(){$('login').classList.remove('hidden');$('panel').classList.add('hidden')}async function login(){$('loginBtn').disabled=true;$('loginMsg').className='muted';$('loginMsg').textContent='در حال ورود...';try{const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;$('login').classList.add('hidden');$('panel').classList.remove('hidden');await loadExams()}catch(e){$('loginMsg').className='err';$('loginMsg').textContent='ورود انجام نشد: '+e.message}finally{$('loginBtn').disabled=false}}$('loginBtn').onclick=login;$('refreshBtn').onclick=()=>loadExams().catch(e=>{$('msg').className='err';$('msg').textContent=e.message});$('logoutBtn').onclick=async()=>{await sb.auth.signOut();showLogin()};sb.auth.getSession().then(({data})=>{if(data.session){$('login').classList.add('hidden');$('panel').classList.remove('hidden');loadExams().catch(e=>{$('msg').className='err';$('msg').textContent=e.message})}});</script></main></body></html>
