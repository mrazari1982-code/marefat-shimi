<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود مدیر | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;margin:0}.wrap{max-width:700px;margin:auto;padding:20px}.card{background:#fff;padding:24px;border-radius:16px;margin-top:30px;box-shadow:0 4px 18px #0001}input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:8px 0 14px;border:1px solid #ddd;border-radius:10px}button{padding:12px 22px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:bold;cursor:pointer}.hidden{display:none}.error{color:#b42318}.success{color:#067647}</style></head><body><div class="wrap"><section class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>ورود مدیر</p><div id="login"><p id="msg">ایمیل و رمز عبور مدیر را وارد کنید.</p><label>ایمیل</label><input id="email" type="email" autocomplete="username" required><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password" required><button id="loginBtn">ورود</button></div><div id="panel" class="hidden"><h2>پنل مدیر باز شد ✅</h2><p id="user"></p><button id="logout">خروج</button></div></section></div><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);async function login(){const email=$('email').value.trim(),password=$('password').value;$('loginBtn').disabled=true;$('msg').textContent='در حال ورود...';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;const staff=await sb.rpc('v5_is_staff');if(staff.error)throw staff.error;if(staff.data!==true)throw new Error('این حساب دسترسی مدیر ندارد.');$('login').classList.add('hidden');$('panel').classList.remove('hidden');$('user').textContent='حساب: '+(r.data.user?.email||email)}catch(e){$('msg').className='error';$('msg').textContent='ورود انجام نشد: '+(e.message||String(e));$('loginBtn').disabled=false}}$('loginBtn').addEventListener('click',login);$('logout').addEventListener('click',async()=>{await sb.auth.signOut();location.reload()});</script></body></html>
