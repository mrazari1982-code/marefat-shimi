<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:16px}.hero,.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0;box-shadow:0 4px 18px #0000000a}.hero{background:linear-gradient(135deg,#3157d5,#5b4bdc);color:#fff}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:1}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}button{padding:11px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}button.secondary{background:#667085}button:disabled{opacity:.55}.hidden{display:none}.err{color:#a21d2a}.ok{color:#176b3a}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:10px;border-bottom:1px solid #eee;text-align:right}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff}@media(max-width:700px){.grid{grid-template-columns:1fr}.hero,.card{padding:14px}.row>*{flex-basis:100%}}</style></head><body><div class="wrap"><header class="hero"><h1>پنل مدیریت سامانه آزمون معرفت</h1><p>مدیریت آزمون‌ها و بانک سؤال — نسخه V5</p></header><section id="login" class="card"><h2>ورود مدیر</h2><p id="loginMsg">برای ورود، حساب مدیر Supabase را وارد کنید.</p><label>ایمیل</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" onclick="login()">ورود</button></section><section id="denied" class="card hidden"><h2>دسترسی مجاز نیست</h2><p id="deniedMsg" class="err"></p><button onclick="logout()">خروج</button></section><section id="dashboard" class="hidden"><div class="row"><h2>داشبورد</h2><button class="secondary" onclick="logout()">خروج</button><button onclick="loadDashboard()">به‌روزرسانی</button></div><div class="grid"><section class="card"><h3>آزمون‌ها</h3><div id="examCount" class="badge">-</div><div id="exams"></div></section><section class="card"><h3>بانک سؤال</h3><div id="questionCount" class="badge">-</div><div id="questions"></div></section></div></section><script>const CONFIG={SUPABASE_URL:'https://rbqlblryxcaodvyrnfuo.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU'};const sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function show(id){$(id).classList.remove('hidden')}function hide(id){$(id).classList.add('hidden')}function msg(e){return e?.message||e?.error_description||String(e||'خطای نامشخص')}async function login(){const email=$('email').value.trim(),password=$('password').value;$('loginBtn').disabled=true;$('loginMsg').textContent='در حال ورود...';try{const r=await sb.auth.signInWithPassword({email,password});if(r.error)throw r.error;await gate()}catch(e){$('loginMsg').textContent='ورود انجام نشد: '+msg(e);$('loginBtn').disabled=false}}async function gate(){try{const s=await sb.auth.getSession();if(!s.data.session){show('login');hide('dashboard');hide('denied');$('loginBtn').disabled=false;return}const r=await sb.rpc('v5_is_staff');if(r.error){hide('login');hide('dashboard');show('denied');$('deniedMsg').textContent='حساب وارد شد، اما بررسی نقش مدیر انجام نشد: '+msg(r.error);return}if(r.data!==true){hide('login');hide('dashboard');show('denied');$('deniedMsg').textContent='ورود موفق بود، اما این حساب نقش مدیر/کارمند فعال ندارد. لطفاً نقش حساب را در v5_profiles بررسی کنید.';return}hide('login');hide('denied');show('dashboard');await loadDashboard()}catch(e){hide('login');show('denied');$('deniedMsg').textContent='خطا در بررسی دسترسی: '+msg(e)}}async function loadDashboard(){try{const e=await sb.from('v5_exam_builder_view').select('*').order('created_at',{ascending:false});if(e.error)throw new Error('آزمون‌ها: '+msg(e.error));const q=await sb.from('v5_question_bank_admin_view').select('*').order('created_at',{ascending:false}).limit(50);if(q.error)throw new Error('بانک سؤال: '+msg(q.error));$('examCount').textContent=(e.data||[]).length+' آزمون';$('questionCount').textContent=(q.data||[]).length+' سؤال';$('exams').innerHTML=renderExams(e.data||[]);$('questions').innerHTML=renderQuestions(q.data||[])}catch(err){$('exams').innerHTML='<p class="err">خطا در بارگذاری: '+esc(msg(err))+'</p>';$('questions').innerHTML='<p class="err">برای جزئیات، پیام خطای بخش آزمون‌ها را بررسی کنید.</p>'}}function renderExams(rows){if(!rows.length)return '<p>هنوز آزمونی وجود ندارد.</p>';return '<table class="table"><tr><th>عنوان</th><th>کد</th><th>وضعیت</th><th>سؤال</th></tr>'+rows.map(x=>`<tr><td>${esc(x.title)}</td><td>${esc(x.exam_code)}</td><td>${esc(x.status)}</td><td>${esc(x.question_count)}</td></tr>`).join('')+'</table>'}function renderQuestions(rows){if(!rows.length)return '<p>هنوز سؤالی وجود ندارد.</p>';return '<table class="table"><tr><th>سؤال</th><th>درس</th><th>موضوع</th><th>وضعیت</th></tr>'+rows.map(x=>`<tr><td>${esc(x.question_text)}</td><td>${esc(x.subject_name)}</td><td>${esc(x.topic_name)}</td><td>${esc(x.status)}</td></tr>`).join('')+'</table>'}async function logout(){await sb.auth.signOut();location.reload()}sb.auth.onAuthStateChange(()=>setTimeout(gate,0));gate();</script></div></body></html>
