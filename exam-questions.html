<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مدیریت سؤال‌های آزمون | معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1200px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:11px 15px;border:0;border-radius:9px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block}.secondary{background:#667085}.danger{background:#b42318}.muted{color:#667085}.ok{color:#176b3a}.err{color:#b42318}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:11px;border-bottom:1px solid #eee;text-align:right;vertical-align:top}th{background:#f8fafc}.count{font-weight:700}.question{max-width:650px;line-height:1.8}.search{width:min(100%,500px);padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box}</style></head><body><main class="wrap"><div class="card"><div class="toolbar"><div style="flex:1"><h1 id="title" style="margin:0">مدیریت سؤال‌های آزمون</h1><p id="info" class="muted"></p></div><a class="btn secondary" href="admin.html">آزمون‌ها</a></div></div><div class="card"><div class="toolbar"><input id="search" class="search" placeholder="جستجو در سؤال‌های بانک..."><button id="addSelected" class="btn">افزودن سؤال‌های انتخاب‌شده</button><button id="addRandom" class="btn">افزودن تصادفی</button><input id="randomCount" type="number" min="1" value="1" style="width:90px;padding:10px;border:1px solid #ddd;border-radius:9px"><span id="selectedCount" class="count">۰ سؤال انتخاب شده</span></div><p id="msg" class="muted"></p></div><div class="card"><h2>سؤال‌های فعلی آزمون</h2><div id="current" class="table"></div></div><div class="card"><h2>بانک سؤال V5</h2><div id="bank" class="table"></div></div></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=x=>document.getElementById(x);const params=new URLSearchParams(location.search);let examId=Number(params.get('exam_id')||0),bank=[],current=[];function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function setMsg(t,c='muted'){$('msg').className=c;$('msg').textContent=t}function refreshSelected(){const n=document.querySelectorAll('.bankPick:checked').length;$('selectedCount').textContent=n+' سؤال انتخاب شده'}async function init(){try{const {data:u}=await sb.auth.getUser();if(!u.user)throw new Error('ابتدا وارد حساب مدیر شوید.');const {data:p,error:pe}=await sb.from('v5_profiles').select('full_name,role,is_active').eq('id',u.user.id).maybeSingle();if(pe)throw pe;if(!p?.is_active||!['admin','deputy'].includes(p.role))throw new Error('دسترسی مجاز نیست.');if(!examId){const code=params.get('exam_code');if(code){const {data:e,error}=await sb.from('v5_exams').select('id').eq('exam_code',code).single();if(error)throw error;examId=e.id}else throw new Error('شناسه آزمون مشخص نیست.')}await loadExam();await Promise.all([loadCurrent(),loadBank()])}catch(e){setMsg('صفحه مدیریت سؤال باز نشد: '+e.message,'err')}}async function loadExam(){const {data:e,error}=await sb.from('v5_exams').select('id,exam_code,title,duration_minutes,status').eq('id',examId).single();if(error)throw error;$('title').textContent='مدیریت سؤال‌های: '+e.title;$('info').textContent='کد: '+e.exam_code+' | وضعیت: '+e.status+' | مدت: '+(e.duration_minutes||'—')+' دقیقه'}async function loadBank(){setMsg('در حال دریافت بانک سؤال...');const {data,error}=await sb.rpc('v5_admin_get_question_bank',{p_search:null,p_limit:100});if(error)throw error;bank=data||[];renderBank();setMsg(bank.length+' سؤال از بانک سؤال آماده است.','ok')}async function loadCurrent(){const {data,error}=await sb.rpc('v5_admin_get_exam_questions',{p_exam_id:examId});if(error)throw error;current=data||[];renderCurrent();renderBank()}function renderCurrent(){if(!current.length){$('current').innerHTML='<div class="muted" style="padding:20px">هنوز سؤالی به این آزمون اضافه نشده است.</div>';return}$('current').innerHTML='<table><thead><tr><th>ترتیب</th><th>سؤال</th><th>نوع</th><th>سطح</th><th>امتیاز</th><th>عملیات</th></tr></thead><tbody>'+current.map(q=>'<tr><td>'+q.question_order+'</td><td class="question">'+esc(q.question_text)+'</td><td>'+esc(q.question_type)+'</td><td>'+esc(q.difficulty)+'</td><td>'+q.score+'</td><td><button class="btn danger remove" data-q="'+q.question_id+'">حذف</button></td></tr>').join('')+'</tbody></table>';document.querySelectorAll('.remove').forEach(b=>b.onclick=()=>removeQuestion(Number(b.dataset.q)))}function renderBank(){const term=$('search').value.trim().toLowerCase();const existing=new Set(current.map(x=>Number(x.question_id)).filter(Boolean));const list=bank.filter(q=>!existing.has(Number(q.id))&&(!term||String(q.question_text||'').toLowerCase().includes(term)||String(q.subject||'').toLowerCase().includes(term)||String(q.grade||'').toLowerCase().includes(term)||String(q.difficulty||'').toLowerCase().includes(term)));$('bank').innerHTML=list.length?'<table><thead><tr><th></th><th>#</th><th>سؤال</th><th>درس</th><th>پایه</th><th>سطح</th><th>امتیاز</th></tr></thead><tbody>'+list.map(q=>'<tr><td><input type="checkbox" class="bankPick" value="'+q.id+'" onchange="refreshSelected()"></td><td>'+q.id+'</td><td class="question">'+esc(q.question_text)+'</td><td>'+esc(q.subject||'—')+'</td><td>'+esc(q.grade||'—')+'</td><td>'+esc(q.difficulty||'—')+'</td><td>'+q.score+'</td></tr>').join('')+'</tbody></table>':'<div class="muted" style="padding:20px">سؤال قابل افزودن پیدا نشد.</div>'}async function add(ids){if(!ids.length){setMsg('حداقل یک سؤال انتخاب کنید.','err');return}setMsg('در حال افزودن سؤال‌ها...');try{const {data,error}=await sb.rpc('v5_admin_add_bank_questions_to_exam',{p_exam_id:examId,p_bank_question_ids:ids});if(error)throw error;const failed=(data||[]).filter(x=>x.result&&x.result!=='added');setMsg(failed.length?'برخی سؤال‌ها اضافه نشدند.':'سؤال‌ها با موفقیت به آزمون اضافه شدند.',failed.length?'err':'ok');await loadCurrent()}catch(e){setMsg('افزودن سؤال انجام نشد: '+e.message,'err')}}async function removeQuestion(qid){if(!confirm('این سؤال از آزمون حذف شود؟'))return;setMsg('در حال حذف...');try{const {error}=await sb.rpc('v5_admin_remove_exam_question',{p_exam_id:examId,p_question_id:qid});if(error)throw error;setMsg('سؤال حذف شد.','ok');await loadCurrent()}catch(e){setMsg('حذف سؤال انجام نشد: '+e.message,'err')}}$('addSelected').onclick=()=>add([...document.querySelectorAll('.bankPick:checked')].map(x=>Number(x.value)));$('addRandom').onclick=async()=>{const n=Math.max(1,Number($('randomCount').value)||1);setMsg('در حال افزودن '+n+' سؤال تصادفی...');try{const {data,error}=await sb.rpc('v5_admin_add_random_bank_questions_to_exam',{p_exam_id:examId,p_count:n});if(error)throw error;setMsg((data?.length||0)+' سؤال تصادفی با موفقیت اضافه شد.','ok');await loadCurrent()}catch(e){setMsg('افزودن تصادفی انجام نشد: '+e.message,'err')}}$('search').oninput=renderBank;init();</script></body></html>
