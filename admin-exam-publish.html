<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>انتشار آزمون | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.muted{color:#667085}.err{color:#b42318}.ok{color:#067647}button,a{padding:10px 14px;border:0;border-radius:8px;background:#3157d5;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}.danger{background:#b42318}.secondary{background:#667085}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}input{padding:9px;border:1px solid #ddd;border-radius:8px;width:230px}</style></head><body><div class="wrap"><header class="card"><h1>انتشار آزمون و ساخت لینک</h1><p id="who" class="muted">در حال بررسی دسترسی...</p><div class="row"><a href="admin-exam-builder.html">ساخت آزمون</a><a href="admin-panel.html">پنل مدیر</a></div></header><section id="app" class="card" style="display:none"><p id="msg" class="muted">در حال بارگذاری آزمون‌ها...</p><table><thead><tr><th>عنوان</th><th>کد</th><th>وضعیت</th><th>عملیات</th></tr></thead><tbody id="rows"></tbody></table></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function init(){const s=await sb.auth.getSession();if(!s.data.session){location.href='admin-login-v2.html';return}const st=await sb.rpc('v5_is_staff');if(st.error||st.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(s.data.session.user.email||'');$('app').style.display='block';await load()}async function load(){const r=await sb.from('v5_exams').select('id,title,exam_code,status,duration_minutes,created_at').order('id',{ascending:false}).limit(100);if(r.error){$('msg').className='err';$('msg').textContent='خطا: '+r.error.message;return}$('msg').textContent=r.data?.length?'':'آزمونی ثبت نشده است.';$('rows').innerHTML=(r.data||[]).map(x=>{const pub=x.status==='published';return '<tr><td>'+esc(x.title)+'</td><td>'+esc(x.exam_code)+'</td><td>'+esc(x.status)+'</td><td><div class="row">'+(!pub?'<button onclick="publishExam('+x.id+')">انتشار</button>':'<button class="secondary" onclick="createLink('+x.id+')">ساخت لینک</button>')+'</div><div id="r-'+x.id+'" class="muted"></div></td></tr>'}).join('')}window.publishExam=async id=>{const r=await sb.from('v5_exams').update({status:'published'}).eq('id',id).eq('status','draft');if(r.error){alert('انتشار انجام نشد: '+r.error.message);return}await load()};window.createLink=async id=>{const max=prompt('حداکثر تعداد تلاش برای هر دانش‌آموز؟ خالی = بدون محدودیت','');if(max!==null&&max!==''&&(!/^\d+$/.test(max)||Number(max)<=0)){alert('عدد معتبر وارد کنید.');return}const p=await sb.rpc('v5_create_exam_link',{p_exam_id:id,p_max_attempts:max===''||max===null?null:Number(max)});if(p.error){$('r-'+id).className='err';$('r-'+id).textContent='ساخت لینک انجام نشد: '+p.error.message;return}const token=p.data;const url=location.origin+'/index.html?token='+encodeURIComponent(token);$('r-'+id).className='ok';$('r-'+id).innerHTML='لینک ساخته شد: <input readonly value="'+esc(url)+'" onclick="this.select()">';};init();</script></body></html>
