<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه آزمون آنلاین دبیرستان معرفت | نسخه V5</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#3157d5;--p2:#5b4bdc;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--ok:#16803c;--bad:#d92d20;--warn:#b54708}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}.wrap{max-width:1000px;margin:auto;padding:14px}.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:22px;margin-bottom:14px}.hero h1{margin:0 0 5px;font-size:25px}.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 5px 22px #00000008}.login{max-width:700px;margin:28px auto}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.light{background:#eef1f6;color:var(--text)}.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}.notice{padding:11px 13px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.exam-head{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px;margin:0 -18px 12px}.exam-meta{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.timer{font-weight:800;color:var(--bad)}.q{padding:17px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0}.qtitle{font-weight:700;margin-bottom:9px}.opt{display:block;border:1px solid var(--line);border-radius:11px;padding:9px 11px;margin:7px 0;cursor:pointer}.opt:hover{background:#f8fafc}.opt input{width:auto;margin-left:7px}.progress{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--p);width:0}.stat{border:1px solid var(--line);background:#f8fafc;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:24px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}@media(max-width:700px){.wrap{padding:9px}.grid2,.grid4{grid-template-columns:1fr}.hero{border-radius:14px;padding:17px}.card{padding:14px}.exam-head{margin:0 -14px 12px;padding:10px}.btn{width:100%}.actions .btn{flex:1;min-width:140px}}
</style></head>
<body><div class="wrap">
<header class="hero"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><div>نسخه V5 — ورود با لینک اختصاصی آزمون</div></header>
<section id="login" class="card login"><h2>ورود به آزمون</h2><div id="status" class="notice">در حال آماده‌سازی...</div><br><div><label>توکن لینک آزمون</label><input id="token" autocomplete="off" placeholder="توکن آزمون را وارد کنید"></div><br><div><label>کد دانش‌آموزی</label><input id="studentCode" autocomplete="off" placeholder="مثلاً V5-STUDENT-001"></div><br><button class="btn primary" onclick="startExam()">شروع آزمون</button><p class="muted">لینک آزمون و کد دانش‌آموزی برای شروع بررسی می‌شوند. تصحیح نهایی در سمت سرور انجام می‌شود.</p></section>
<section id="exam" class="hidden"><div class="card"><div class="exam-head"><div class="exam-meta"><b id="examTitle"></b><span>دانش‌آموز: <b id="studentName"></b></span><span class="timer">زمان باقی‌مانده: <span id="timer">--:--</span></span></div><br><div class="progress"><i id="progressBar"></i></div><small id="progressText" class="muted"></small></div><div id="questions"></div><div class="actions"><button class="btn primary" onclick="submitExam()">ثبت نهایی آزمون</button><button class="btn light" onclick="saveAnswers(true)">ذخیره پاسخ‌ها</button></div></div></section>
<section id="report" class="hidden"><div class="card"><h2>کارنامه آزمون</h2><div id="reportInfo" class="notice"></div><br><div class="grid4"><div class="stat"><b id="pct">0%</b>درصد</div><div class="stat"><b id="correct">0</b>صحیح</div><div class="stat"><b id="wrong">0</b>غلط</div><div class="stat"><b id="blank">0</b>نزده</div></div><br><button class="btn light" onclick="location.reload()">خروج</button></div></section>
</div>
<script>
const CONFIG={SUPABASE_URL:"https://rbqblryxcaodvyrnfuo.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU"};let sb=null,attempt=null,questions=[],timerId=null,remainingSeconds=0;
const $=id=>document.getElementById(id);function setStatus(text,kind=''){const e=$("status");e.textContent=text;e.className='notice '+kind}function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}function show(s){['login','exam','report'].forEach(x=>$(x).classList.toggle('hidden',x!==s))}function getToken(){return new URLSearchParams(location.search).get('token')||$("token").value.trim()}
async function startExam(){if(!sb)return setStatus('اتصال سامانه برقرار نیست.','bad');const token=getToken(),studentCode=$("studentCode").value.trim();if(!token||!studentCode)return setStatus('توکن آزمون و کد دانش‌آموزی را وارد کنید.','warn');$("token").value=token;setStatus('در حال بررسی لینک و شروع آزمون...');try{const {data,error}=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:studentCode});if(error)throw error;attempt=data;const {data:qData,error:qErr}=await sb.from('v5_exam_questions').select('id,question_order,score,question:v5_questions(id,question_text),options:v5_question_options(id,option_key,option_text,sort_order)').eq('exam_id',data.exam_id).order('question_order');if(qErr)throw qErr;questions=(qData||[]).map(q=>({...q,options:(q.options||[]).sort((a,b)=>a.sort_order-b.sort_order)}));if(!questions.length)throw new Error('این آزمون سؤال ندارد.');renderQuestions();show('exam');startTimer(Number(data.duration_minutes)||0)}catch(e){console.error(e);setStatus(errorText(e),'bad')}}
function errorText(e){const m=String(e?.message||e?.details||e||'');if(m.includes('INVALID_OR_EXPIRED_EXAM_LINK'))return 'لینک آزمون نامعتبر یا منقضی شده است.';if(m.includes('EXAM_NOT_AVAILABLE'))return 'این آزمون در حال حاضر منتشر نشده است.';if(m.includes('EXAM_NOT_STARTED'))return 'زمان شروع آزمون هنوز نرسیده است.';if(m.includes('EXAM_CLOSED'))return 'زمان آزمون به پایان رسیده است.';if(m.includes('STUDENT_NOT_FOUND'))return 'کد دانش‌آموزی معتبر نیست یا دانش‌آموز فعال نیست.';if(m.includes('MAX_ATTEMPTS_REACHED'))return 'حداکثر دفعات شرکت شما در این آزمون تکمیل شده است.';return 'شروع آزمون انجام نشد. لطفاً اطلاعات را بررسی کنید.'}
function renderQuestions(){$("examTitle").textContent=attempt.title;$("studentName").textContent=attempt.student_name;$("questions").innerHTML=questions.map((q,i)=>`<article class="q"><div class="qtitle">${i+1}) ${esc(q.question.question_text)}</div>${q.options.map(o=>`<label class="opt"><input type="radio" name="q-${q.id}" value="${o.id}" onchange="updateProgress()"> ${esc(o.option_key||'')} ${esc(o.option_text)}</label>`).join('')}</article>`).join('');updateProgress()}
function updateProgress(){const n=questions.filter(q=>document.querySelector(`input[name="q-${q.id}"]:checked`)).length;const pct=Math.round(n/questions.length*100);$("progressBar").style.width=pct+'%';$("progressText").textContent=`${n} از ${questions.length} سؤال پاسخ داده شده`}
function collectAnswers(){return questions.map(q=>{const el=document.querySelector(`input[name="q-${q.id}"]:checked`);return el?{exam_question_id:q.id,selected_option_id:Number(el.value)}:null}).filter(Boolean)}
async function saveAnswers(showMessage=false){if(!attempt)return;try{const {error}=await sb.rpc('v5_save_answers',{p_attempt_id:attempt.attempt_id,p_student_code:$("studentCode").value.trim(),p_answers:collectAnswers()});if(error)throw error;if(showMessage)alert('پاسخ‌ها با موفقیت ذخیره شدند.')}catch(e){console.error(e);alert('ذخیره پاسخ‌ها انجام نشد.')}}
async function submitExam(){if(!attempt)return;if(!confirm('پس از ثبت نهایی امکان تغییر پاسخ‌ها وجود ندارد. ادامه می‌دهید؟'))return;try{await saveAnswers(false);const {data,error}=await sb.rpc('v5_submit_attempt',{p_attempt_id:attempt.attempt_id});if(error)throw error;clearInterval(timerId);showReport(data?.[0]||data)}catch(e){console.error(e);alert('ثبت نهایی آزمون انجام نشد.')}}
function showReport(r){show('report');$("reportInfo").textContent=`آزمون: ${attempt.title} — دانش‌آموز: ${attempt.student_name}`;$("pct").textContent=Number(r.percentage||0).toFixed(2)+'%';$("correct").textContent=r.correct_answers??0;$("wrong").textContent=r.wrong_answers??0;$("blank").textContent=r.unanswered_questions??0}
function startTimer(minutes){if(!minutes){$("timer").textContent='بدون محدودیت';return}remainingSeconds=minutes*60;renderTimer();timerId=setInterval(async()=>{remainingSeconds--;renderTimer();if(remainingSeconds<=0){clearInterval(timerId);alert('زمان آزمون به پایان رسید؛ آزمون ثبت می‌شود.');await submitExam()}},1000)}function renderTimer(){const m=Math.floor(remainingSeconds/60),s=remainingSeconds%60;$("timer").textContent=`${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}function init(){try{sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);$("status").textContent='اتصال به پایگاه داده برقرار است.';const t=new URLSearchParams(location.search).get('token');if(t)$("token").value=t}catch(e){setStatus('راه‌اندازی اتصال سامانه ناموفق بود.','bad')}}init();
</script></body></html>
