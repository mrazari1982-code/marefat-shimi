<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.btn{padding:12px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;min-height:44px}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}input[type=text]{padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0;width:min(100%,360px);box-sizing:border-box}</style></head><body><main class="wrap"><section id="login" class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود با لینک اختصاصی آزمون</p><p id="status" class="muted">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><br><input id="token" type="text" autocomplete="off"><br><label>کد دانش‌آموزی</label><br><input id="studentCode" type="text" autocomplete="off"><br><button id="startBtn" class="btn">شروع آزمون</button></section></main><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);function setStatus(text,cls='muted'){$('status').className=cls;$('status').textContent=text}function init(){try{const t=new URLSearchParams(location.search).get('token');if(t)$('token').value=t;setStatus('سامانه آماده است. توکن لینک و کد دانش‌آموزی را وارد کنید.','ok')}catch(e){setStatus('خطا در آماده‌سازی سامانه: '+e.message,'err')}}$('startBtn').onclick=async()=>{const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code){setStatus('توکن و کد دانش‌آموزی الزامی است.','err');return}$('startBtn').disabled=true;setStatus('در حال بررسی لینک آزمون...');try{const r=await sb.rpc('v5_validate_exam_link',{p_token:token});if(r.error)throw r.error;const link=Array.isArray(r.data)?r.data[0]:r.data;if(!link){setStatus('لینک آزمون معتبر نیست یا منقضی شده است.','err');$('startBtn').disabled=false;return}location.href='exam.html?token='+encodeURIComponent(token)+'&student_code='+encodeURIComponent(code)}catch(e){setStatus('اعتبارسنجی لینک انجام نشد: '+e.message,'err');$('startBtn').disabled=false}};init()</script></body></html>
