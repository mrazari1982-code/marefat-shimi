<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سامانه آزمون تشخیصی شیمی دهم | نسخه چهارم</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--p:#3157d5;--p2:#5b4bdc;--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--ok:#16803c;--bad:#d92d20;--warn:#b54708}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Tahoma,"Segoe UI",sans-serif;line-height:1.8}.wrap{max-width:1180px;margin:auto;padding:15px}
.hero{background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;border-radius:20px;padding:24px;margin-bottom:15px}.hero h1{margin:0 0 5px}
.card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;margin:14px 0;box-shadow:0 5px 22px #00000008}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff}.btn{border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.primary{background:var(--p);color:#fff}.light{background:#eef1f6}.danger{background:#fee4e2;color:#b42318}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}.muted{color:var(--muted);font-size:14px}.pill{display:inline-block;background:#eef2ff;color:#3730a3;border-radius:99px;padding:2px 9px;font-size:12px}
.stat{border:1px solid var(--line);background:#f8fafc;border-radius:13px;padding:12px;text-align:center}.stat b{display:block;font-size:25px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}.tabs button{flex:1;min-width:145px}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:center}th{background:#f8fafc}
.q{padding:17px 0;border-top:1px solid var(--line)}.q:first-child{border-top:0}.qtitle{font-weight:700;margin-bottom:8px}.opt{display:block;border:1px solid var(--line);border-radius:10px;padding:8px 11px;margin:7px 0;cursor:pointer}.opt input{width:auto;margin-left:7px}
.ok{color:var(--ok);font-weight:700}.bad{color:var(--bad);font-weight:700}.warn{color:var(--warn);font-weight:700}.bar{height:10px;background:#e9edf4;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--p)}
.login{max-width:680px;margin:35px auto}.small{font-size:12px}.notice{padding:10px 12px;border-radius:10px;background:#f8fafc;border:1px solid var(--line)}
@media(max-width:750px){.wrap{padding:9px}.grid2,.grid4{grid-template-columns:1fr 1fr}.hero{border-radius:14px;padding:18px}.card{padding:14px}table{font-size:12px}.tabs button{min-width:110px}}
@media print{.no-print{display:none!important}.card{box-shadow:none}}
</style>
</head>
<body><div class="wrap">
<header class="hero"><h1>سامانه آزمون تشخیصی شیمی دهم</h1><div>نسخه چهارم — آماده اتصال به پایگاه داده مرکزی</div></header>

<section id="login" class="card login">
<h2>ورود به سامانه</h2>
<div id="status" class="notice">در حال بررسی اتصال سامانه...</div><br>
<div class="actions"><button class="btn primary" onclick="showStudent()">ورود دانش‌آموز</button><button class="btn light" onclick="showAdmin()">ورود مدیر</button></div>
<div id="studentBox" class="hidden"><hr><div class="grid2">
<div><label>نام و نام خانوادگی</label><input id="sname"></div><div><label>کد دانش‌آموزی</label><input id="scode"></div>
<div><label>کلاس</label><input id="sclass" placeholder="12/1"></div><div><label>کد آزمون</label><input id="ecode" value="SHIMI10-01"></div>
</div><br><button class="btn primary" onclick="startExam()">شروع آزمون</button></div>
<div id="adminBox" class="hidden"><hr><div class="grid2"><div><label>ایمیل مدیر</label><input id="aemail" type="email"></div><div><label>رمز عبور</label><input id="apass" type="password"></div></div><br><button class="btn primary" onclick="adminLogin()">ورود امن مدیر</button></div>
</section>

<section id="exam" class="hidden"><div class="card"><div class="grid2"><b id="who"></b><span style="text-align:left">۲۰ سؤال | نمره منفی یک‌سوم</span></div><div id="questions"></div><div class="actions no-print"><button class="btn primary" onclick="finishExam()">ثبت نهایی</button><button class="btn light" onclick="saveDraft()">ذخیره موقت</button></div></div></section>

<section id="report" class="hidden"><div class="card"><h2>کارنامه</h2><div id="rinfo"></div><div class="grid4"><div class="stat"><b id="pct"></b>درصد</div><div class="stat"><b id="cor"></b>صحیح</div><div class="stat"><b id="wrg"></b>غلط</div><div class="stat"><b id="lev"></b>سطح</div></div><h3>تحلیل فصل‌ها</h3><div id="rch"></div><h3>جزئیات پاسخ‌ها</h3><div id="rd"></div><div class="actions no-print"><button class="btn primary" onclick="window.print()">چاپ</button><button class="btn light" onclick="location.reload()">خروج</button></div></div></section>

<section id="dash" class="hidden"><div class="card"><div class="tabs no-print">
<button class="btn primary" onclick="loadDash('overview')">نمای کلی</button><button class="btn light" onclick="loadDash('students')">دانش‌آموزان</button><button class="btn light" onclick="loadDash('classes')">کلاس‌ها</button><button class="btn light" onclick="loadDash('questions')">سؤال‌ها</button><button class="btn light" onclick="loadDash('chapters')">فصل‌ها</button><button class="btn light" onclick="downloadCSV()">Excel/CSV</button>
</div></div><div id="dashContent"></div></section>
</div>
<script>
const CONFIG={SUPABASE_URL:"https://rbqblryxcaodvyrnfuo.supabase.co",SUPABASE_ANON_KEY:"sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU",EXAM_CODE:"SHIMI10-01"};
let sb=null,S=null,A=[];
const Q=[
["فصل ۱","کدام عبارت درباره ایزوتوپ‌های یک عنصر درست است؟",["عدد اتمی متفاوت و نوترون یکسان","عدد اتمی یکسان و نوترون متفاوت","عدد جرمی یکسان و پروتون متفاوت","پروتون و نوترون هر دو متفاوت"],1],
["فصل ۱","اتم خنثی با عدد اتمی ۱۷ چند الکترون دارد؟",["۷","۱۷","۱۸","۳۵"],1],
["فصل ۱","در اتمی با عدد جرمی ۲۳ و عدد اتمی ۱۱، تعداد نوترون چند است؟",["۱۱","۱۲","۲۳","۳۴"],1],
["فصل ۱","در تشکیل یون مثبت، کدام ذره از اتم جدا می‌شود؟",["پروتون","نوترون","الکترون","هسته"],2],
["فصل ۱","در اتم سدیم Z=11، تعداد الکترون لایه ظرفیت چند است؟",["۱","۲","۸","۱۱"],0],
["فصل ۱","روند کلی شعاع اتمی در یک دوره از چپ به راست چیست؟",["افزایش","کاهش","ثابت","ابتدا افزایش سپس صفر"],1],
["فصل ۲","در حجم ثابت، با افزایش دمای گاز، فشار آن چه می‌شود؟",["کاهش","افزایش","ثابت","ابتدا زیاد سپس کم"],1],
["فصل ۲","در دما و فشار یکسان، حجم گاز با چه کمیتی نسبت مستقیم دارد؟",["جرم مولی","تعداد مول","چگالی","جرم مولکول"],1],
["فصل ۲","جرم مولی تقریبی O2 با O=16 چند است؟",["16","18","32","34"],2],
["فصل ۲","در 2H2+O2→2H2O، برای 3 مول H2 چند مول O2 لازم است؟",["1","1.5","2","3"],1],
["فصل ۲","در فرایند هابر، نیتروژن با کدام گاز واکنش می‌دهد؟",["اکسیژن","هیدروژن","کلر","CO2"],1],
["فصل ۲","اگر حجم گاز در دمای ثابت نصف شود، فشار چه می‌شود؟",["نصف","دو برابر","چهار برابر","ثابت"],1],
["فصل ۳","محلول آبی را کدام عبارت بهتر توصیف می‌کند؟",["آب همیشه حل‌شونده است","آب نقش حلال دارد","آب هیچ ماده‌ای را حل نمی‌کند","هر محلول آبی اشباع است"],1],
["فصل ۳","در محلول 10 گرم نمک و 90 گرم آب، جرم محلول چند گرم است؟",["80","90","100","10"],2],
["فصل ۳","20 گرم حل‌شونده در 180 گرم محلول، چند درصد جرمی است؟",["10%","11.1%","20%","18%"],0],
["فصل ۳","افزایش دما برای حل شدن بیشتر کدام دسته معمولاً اثر مشخص‌تری دارد؟",["بسیاری از جامدها","همه گازها","هیچ ماده‌ای","فقط فلزات"],0],
["فصل ۳","کدام عامل معمولاً حلالیت گازها در آب را کاهش می‌دهد؟",["افزایش فشار","کاهش دما","افزایش دما","افزایش سطح تماس"],2],
["فصل ۳","0.5 مول NaCl در 2 لیتر محلول چه مولاریته‌ای دارد؟",["0.25 M","0.5 M","1 M","2.5 M"],0],
["فصل ۳","برای تهیه محلول رقیق‌تر چه کاری انجام می‌دهیم؟",["افزودن حل‌شونده","افزودن حلال","تبخیر حلال","افزایش دما در همه موارد"],1],
["فصل ۳","وجود برخی یون‌های کلسیم و منیزیم باعث چه ویژگی‌ای در آب می‌شود؟",["اسیدی شدن","سختی آب","بی‌یونی شدن","افزایش اکسیژن"],1]];
const L=["الف","ب","ج","د"];
function $(x){return document.getElementById(x)}function v(x){return $(x).value.trim()}function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]))}
function hide(){["login","exam","report","dash"].forEach(x=>$(x).classList.add("hidden"))}
function init(){if(CONFIG.SUPABASE_URL&&CONFIG.SUPABASE_ANON_KEY){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);$("status").textContent="اتصال به پایگاه داده مرکزی فعال است."}else $("status").textContent="حالت آماده‌سازی: اطلاعات اتصال پایگاه داده هنوز در CONFIG وارد نشده است."}
function showStudent(){$("studentBox").classList.remove("hidden");$("adminBox").classList.add("hidden")}function showAdmin(){$("adminBox").classList.remove("hidden");$("studentBox").classList.add("hidden")}
function startExam(){let n=v("sname"),c=v("scode"),cl=v("sclass");if(!n||!c||!cl)return alert("نام، کد و کلاس الزامی است.");S={name:n,code:c,cls:cl,exam:v("ecode")||CONFIG.EXAM_CODE};A=Array(Q.length).fill(null);let draft=JSON.parse(localStorage.getItem("shimiDraftV4")||"null");if(draft&&draft.student?.code===c&&confirm("پاسخ‌های ذخیره‌شده قبلی بازیابی شود؟"))A=draft.answers||A;renderQ();hide();$("exam").classList.remove("hidden");$("who").textContent=n+" — "+cl}
function renderQ(){let h="";Q.forEach((q,i)=>{h+=`<div class="q"><div class="qtitle">${i+1}) ${q[1]} <span class="pill">${q[0]}</span></div>`;q[2].forEach((o,j)=>h+=`<label class="opt"><input type="radio" name="q${i}" ${A[i]===j?"checked":""} onchange="A[${i}]=${j}"> ${L[j]}) ${o}</label>`);h+="</div>"});$("questions").innerHTML=h}
async function finishExam(){let b=A.filter(x=>x===null).length;if(b&&!confirm(`${b} سؤال بی‌پاسخ است. ثبت نهایی شود؟`))return;let c=0,w=0;A.forEach((a,i)=>{if(a!==null)(a===Q[i][4]?c++:w++)});let p=Math.max(0,(c-w/3)/Q.length*100),r={...S,answers:[...A],c,w,b,p,submitted:new Date().toLocaleString("fa-IR")};if(sb){const {error}=await sb.from("exam_results").insert({exam_code:r.exam,student_name:r.name,student_code:r.code,class_name:r.cls,correct_count:c,wrong_count:w,blank_count:b,percent:p,answers:r.answers,submitted_at:new Date().toISOString()});if(error)return alert("ثبت نتیجه در پایگاه داده انجام نشد: "+error.message)}else{let d=JSON.parse(localStorage.getItem("shimiResultsV4")||"[]");d.push(r);localStorage.setItem("shimiResultsV4",JSON.stringify(d))}localStorage.removeItem("shimiDraftV4");showReport(r)}
function level(p){return p>=80?"عالی":p>=65?"خوب":p>=50?"متوسط":p>=35?"نیازمند تقویت":"ضعیف"}
function showReport(r){hide();$("report").classList.remove("hidden");$("rinfo").innerHTML=`<p><b>نام:</b> ${esc(r.name)} | <b>کد:</b> ${esc(r.code)} | <b>کلاس:</b> ${esc(r.cls)} | <b>تاریخ:</b> ${r.submitted}</p>`;$("pct").textContent=r.p.toFixed(1)+"٪";$("cor").textContent=r.c;$("wrg").textContent=r.w;$("lev").textContent=level(r.p);chapter(r);detail(r)}
function chapter(r){let h="<table><tr><th>فصل</th><th>صحیح</th><th>غلط</th><th>بی‌پاسخ</th><th>درصد</th></tr>";["فصل ۱","فصل ۲","فصل ۳"].forEach(ch=>{let ids=Q.map((q,i)=>q[0]===ch?i:-1).filter(i=>i>=0),c=0,w=0,b=0;ids.forEach(i=>{r.answers[i]===null?b++:r.answers[i]===Q[i][4]?c++:w++});let p=Math.max(0,(c-w/3)/ids.length*100);h+=`<tr><td>${ch}</td><td>${c}</td><td>${w}</td><td>${b}</td><td>${p.toFixed(1)}٪</td></tr>`});$("rch").innerHTML=h+"</table>"}
function detail(r){let h="<table><tr><th>سؤال</th><th>پاسخ شما</th><th>صحیح</th><th>وضعیت</th></tr>";Q.forEach((q,i)=>{let a=r.answers[i],s=a===null?["بی‌پاسخ","warn"]:a===q[4]?["صحیح","ok"]:["غلط","bad"];h+=`<tr><td>${i+1}</td><td>${a===null?"—":L[a]}</td><td>${L[q[4]]}</td><td class="${s[1]}">${s[0]}</td></tr>`});$("rd").innerHTML=h+"</table>"}
function saveDraft(){localStorage.setItem("shimiDraftV4",JSON.stringify({student:S,answers:A}));alert("پاسخ‌ها در این دستگاه ذخیره شد.")}
async function adminLogin(){if(!sb)return alert("برای ورود امن مدیر ابتدا SUPABASE_URL و SUPABASE_ANON_KEY را در CONFIG وارد کنید.");let {error}=await sb.auth.signInWithPassword({email:v("aemail"),password:v("apass")});if(error)return alert("ورود ناموفق: "+error.message);hide();$("dash").classList.remove("hidden");loadDash("overview")}
async function rows(){if(sb){let {data,error}=await sb.from("exam_results").select("*").eq("exam_code",CONFIG.EXAM_CODE).order("submitted_at",{ascending:false});if(error){alert(error.message);return[]}return data.map(x=>({name:x.student_name,code:x.student_code,cls:x.class_name,p:Number(x.percent),c:x.correct_count,w:x.wrong_count,b:x.blank_count,answers:x.answers,submitted:x.submitted_at}))}return JSON.parse(localStorage.getItem("shimiResultsV4")||"[]")}
async function loadDash(t){let d=await rows();if(t==="overview")overview(d);if(t==="students")students(d);if(t==="classes")classes(d);if(t==="questions")questions(d);if(t==="chapters")chapters(d)}
function overview(d){let avg=d.length?d.reduce((a,r)=>a+r.p,0)/d.length:0;let pass=d.filter(r=>r.p>=50).length;$("dashContent").innerHTML=`<div class="card"><div class="grid4"><div class="stat"><b>${d.length}</b>شرکت‌کننده</div><div class="stat"><b>${avg.toFixed(1)}٪</b>میانگین</div><div class="stat"><b>${d.length?(pass/d.length*100).toFixed(1):0}٪</b>بالای ۵۰٪</div><div class="stat"><b>${d.length?level(avg):"-"}</b>سطح میانگین</div></div><h3>توزیع سطح</h3>${dist(d)}</div>`}
function dist(d){return [["عالی",80,100],["خوب",65,79.99],["متوسط",50,64.99],["نیازمند تقویت",35,49.99],["ضعیف",0,34.99]].map(x=>{let n=d.filter(r=>r.p>=x[1]&&r.p<=x[2]).length,p=d.length?n/d.length*100:0;return `<p>${x[0]}: ${n} نفر (${p.toFixed(0)}٪)</p><div class="bar"><i style="width:${p}%"></i></div>`}).join("")}
function students(d){let h="<div class='card'><h3>نتایج دانش‌آموزان</h3><table><tr><th>نام</th><th>کد</th><th>کلاس</th><th>درصد</th><th>سطح</th><th>صحیح</th><th>غلط</th></tr>";d.forEach(r=>h+=`<tr><td>${esc(r.name)}</td><td>${esc(r.code)}</td><td>${esc(r.cls)}</td><td>${r.p.toFixed(1)}٪</td><td>${level(r.p)}</td><td>${r.c}</td><td>${r.w}</td></tr>`);$("dashContent").innerHTML=h+"</table></div>"}
function classes(d){let m={};d.forEach(r=>(m[r.cls]??=[]).push(r));let h="<div class='card'><h3>مقایسه کلاس‌ها</h3><table><tr><th>کلاس</th><th>تعداد</th><th>میانگین</th><th>بهترین</th><th>کمترین</th></tr>";Object.entries(m).forEach(([k,a])=>{let p=a.map(r=>r.p);h+=`<tr><td>${esc(k)}</td><td>${a.length}</td><td>${(p.reduce((x,y)=>x+y,0)/p.length).toFixed(1)}٪</td><td>${Math.max(...p).toFixed(1)}٪</td><td>${Math.min(...p).toFixed(1)}٪</td></tr>`});$("dashContent").innerHTML=h+"</table></div>"}
function questions(d){let h="<div class='card'><h3>تحلیل سؤال‌ها</h3><table><tr><th>سؤال</th><th>فصل</th><th>درصد پاسخ صحیح</th><th>وضعیت</th></tr>";Q.forEach((q,i)=>{let a=d.filter(r=>r.answers?.[i]!==null),c=a.filter(r=>r.answers[i]===q[4]).length,p=a.length?c/a.length*100:0;h+=`<tr><td>${i+1}</td><td>${q[0]}</td><td>${p.toFixed(1)}٪</td><td class="${p<50?'bad':p<70?'warn':'ok'}">${p<50?"نیازمند بررسی":p<70?"متوسط":"مناسب"}</td></tr>`});$("dashContent").innerHTML=h+"</table></div>"}
function chapters(d){let h="<div class='card'><h3>تحلیل فصل‌ها</h3><table><tr><th>فصل</th><th>میانگین درصد</th><th>اولویت</th></tr>";["فصل ۱","فصل ۲","فصل ۳"].forEach(ch=>{let ids=Q.map((q,i)=>q[0]===ch?i:-1).filter(i=>i>=0),p=d.map(r=>{let c=0,w=0;ids.forEach(i=>r.answers?.[i]!==null&&(r.answers[i]===Q[i][4]?c++:w++));return Math.max(0,(c-w/3)/ids.length*100)}),avg=p.length?p.reduce((a,b)=>a+b,0)/p.length:0;h+=`<tr><td>${ch}</td><td>${avg.toFixed(1)}٪</td><td class="${avg<50?'bad':avg<70?'warn':'ok'}">${avg<50?"اولویت بالا":avg<70?"نیازمند مرور":"مناسب"}</td></tr>`});$("dashContent").innerHTML=h+"</table></div>"}
async function downloadCSV(){let d=await rows();if(!d.length)return alert("نتیجه‌ای وجود ندارد.");let a=[["نام","کد","کلاس","درصد","سطح","صحیح","غلط","بی‌پاسخ"],...d.map(r=>[r.name,r.code,r.cls,r.p.toFixed(1),level(r.p),r.c,r.w,r.b])],csv="\uFEFF"+a.map(x=>x.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n"),el=document.createElement("a");el.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));el.download="shimi10-results.csv";el.click()}
init();
</script></body></html>
