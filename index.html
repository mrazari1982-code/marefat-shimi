<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.q{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:14px 0}.opt{display:block;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;min-height:24px;touch-action:manipulation}.opt:hover{background:#f8f9ff}.opt:has(input:checked){border-color:#3157d5;background:#f3f6ff}.opt input{margin-left:10px;transform:scale(1.2)}.btn{padding:12px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;min-height:44px;touch-action:manipulation}.btn:disabled{opacity:.55;cursor:not-allowed}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}.result{font-size:18px;line-height:2}input[type=text]{padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0;width:min(100%,360px);box-sizing:border-box}.sticky-submit{position:sticky;bottom:10px;background:#fff;padding:10px;border-radius:12px;box-shadow:0 2px 14px #0002;z-index:5}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px;margin:10px 0}.q{padding:13px;margin:10px 0}h1{font-size:22px}h2{font-size:18px}.opt{padding:15px 12px;margin:8px 0}.sticky-submit{bottom:6px}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود با لینک اختصاصی آزمون</p><p id="status" class="muted">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><br><input id="token" type="text" autocomplete="off"><br><label>کد دانش‌آموزی</label><br><input id="studentCode" type="text" autocomplete="off"><br><button id="startBtn" class="btn" type="button">شروع آزمون</button></section><section id="exam" class="card" hidden><div class="card"><h2 id="examTitle"></h2><p>دانش‌آموز: <b id="studentName"></b></p><p id="progress" class="muted"></p><p id="saveStatus" class="muted" aria-live="polite">پاسخ‌ها با انتخاب گزینه ذخیره می‌شوند.</p></div><div id="questions"></div><div class="sticky-submit"><button id="submitBtn" class="btn" type="button">ثبت نهایی آزمون</button></div></section><section id="result" class="card" hidden><h2>کارنامه آزمون</h2><div id="resultText" class="result"></div></section><script>const CONFIG={SUPABASE_URL:'https://rbqlblryxcaodvyrnfuo.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU'};let sb,attempt,questions=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));function getToken(){const t=new URLSearchParams(location.search).get('token');if(t&&!$('token').value)$('token').value=t;return t}function groupQuestions(rows){const map=new Map();for(const x of rows){if(!map.has(x.id))map.set(x.id,{id:x.id,order:x.question_order,score:x.score,text:x.question_text,options:[]});map.get(x.id).options.push({id:x.option_id,key:x.option_key,text:x.option_text,sort:x.sort_order})}return [...map.values()].sort((a,b)=>a.order-b.order).map(q=>({...q,options:q.options.sort((a,b)=>a.sort-b.sort)}))}function updateProgress(){const groups=groupQuestions(questions);const answered=groups.filter(q=>document.querySelector('input[name="q_'+q.id+'"]:checked')).length;$('progress').textContent='پاسخ داده‌شده: '+answered+' از '+groups.length}function renderQuestions(){const groups=groupQuestions(questions);$('questions').innerHTML=groups.map((q,i)=>'<section class="q"><p><b>'+(i+1)+') '+esc(q.text)+'</b></p>'+q.options.map(o=>'<label class="opt"><input type="radio" name="q_'+q.id+'" value="'+o.id+'" data-exam-question-id="'+q.id+'"> <b>'+esc(o.key||'')+'</b> '+esc(o.text)+'</label>').join('')+'</section>').join('');document.querySelectorAll('input[type=radio]').forEach(el=>el.addEventListener('change',e=>{updateProgress();saveAnswer(e)}));updateProgress()}async function saveAnswer(e){const el=e.currentTarget;$('saveStatus').className='muted';$('saveStatus').textContent='در حال ذخیره پاسخ...';try{const r=await sb.rpc('v5_save_answer',{p_attempt_id:attempt.attempt_id,p_exam_question_id:Number(el.dataset.examQuestionId),p_selected_option_id:Number(el.value)});if(r.error)throw r.error;$('saveStatus').className='ok';$('saveStatus').textContent='پاسخ با موفقیت ذخیره شد.'}catch(err){console.error(err);$('saveStatus').className='err';$('saveStatus').textContent='ذخیره پاسخ انجام نشد: '+(err.message||err)}}async function startExam(){const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code){$('status').className='err';$('status').textContent='توکن و کد دانش‌آموزی را وارد کنید.';return}$('startBtn').disabled=true;$('status').className='muted';$('status').textContent='در حال بررسی...';try{const r=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(r.error)throw new Error('شروع آزمون: '+(r.error.message||'خطای نامشخص'));attempt=r.data;const q=await sb.rpc('v5_get_exam_questions',{p_attempt_id:attempt.attempt_id,p_student_code:code});if(q.error)throw new Error('دریافت سؤال‌ها: '+(q.error.message||'خطای نامشخص'));questions=q.data||[];if(!questions.length)throw new Error('برای این آزمون سؤالی برگردانده نشد.');$('login').hidden=true;$('exam').hidden=false;$('examTitle').textContent=attempt.title||'آزمون';$('studentName').textContent=attempt.student_name||code;renderQuestions()}catch(e){console.error(e);$('status').className='err';$('status').textContent='شروع آزمون انجام نشد: '+String(e.message||e);$('startBtn').disabled=false}}async function submitExam(){if(!attempt?.attempt_id)return;const groups=groupQuestions(questions),answered=groups.filter(q=>document.querySelector('input[name="q_'+q.id+'"]:checked')).length;const unanswered=groups.length-answered;if(unanswered>0&&!confirm('تعداد '+unanswered+' سؤال بدون پاسخ است. آیا می‌خواهید آزمون را همین حالا ثبت نهایی کنید؟'))return;if(!confirm('آیا از ثبت نهایی آزمون مطمئن هستید؟ پس از ثبت، امکان تغییر پاسخ‌ها وجود ندارد.'))return;$('submitBtn').disabled=true;$('saveStatus').className='muted';$('saveStatus').textContent='در حال تصحیح آزمون...';try{const r=await sb.rpc('v5_submit_attempt',{p_attempt_id:attempt.attempt_id});if(r.error)throw r.error;const x=Array.isArray(r.data)?r.data[0]:r.data;if(!x)throw new Error('نتیجه‌ای از تصحیح دریافت نشد.');$('exam').hidden=true;$('result').hidden=false;$('resultText').innerHTML='صحیح: <b>'+Number(x.correct_answers||0)+'</b> | غلط: <b>'+Number(x.wrong_answers||0)+'</b> | نزده: <b>'+Number(x.unanswered_questions||0)+'</b><br>درصد: <b>'+Number(x.percentage||0).toFixed(2)+'%</b><br><span class="ok">آزمون با موفقیت ثبت و تصحیح شد.</span>'}catch(e){console.error(e);$('saveStatus').className='err';$('saveStatus').textContent='ثبت نهایی انجام نشد: '+(e.message||e);$('submitBtn').disabled=false}}function init(){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);getToken();$('status').textContent='آماده دریافت آزمون.'}$('startBtn').addEventListener('click',startExam);$('submitBtn').addEventListener('click',submitExam);init();</script></main></body></html>
