<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود با لینک اختصاصی آزمون</p><section id="login"><p id="status">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><input id="token"><label>کد دانش‌آموزی</label><input id="studentCode"><button onclick="startExam()">شروع آزمون</button></section><section id="exam" hidden><h2 id="examTitle"></h2><p>دانش‌آموز: <b id="studentName"></b></p><div id="questions"></div><button onclick="submitExam()">ثبت نهایی آزمون</button></section><script>const CONFIG={SUPABASE_URL:'https://rbqlblryxcaodvyrnfuo.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU'};let sb,attempt,questions=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function startExam(){const token=$('token').value.trim(),code=$('studentCode').value.trim();$('status').textContent='در حال بررسی...';try{const r=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(r.error)throw new Error('START_RPC: '+JSON.stringify(r.error));attempt=r.data;const q=await sb.rpc('v5_get_exam_questions',{p_attempt_id:attempt.attempt_id,p_student_code:code});if(q.error)throw new Error('QUESTIONS_RPC: '+JSON.stringify(q.error));const rows=q.data||[];if(!rows.length)throw new Error('NO_QUESTIONS_RETURNED');$('status').textContent='موفق؛ تعداد ردیف سؤال: '+rows.length;questions=rows;setTimeout(()=>{document.getElementById('login').hidden=true;document.getElementById('exam').hidden=false;document.getElementById('examTitle').textContent=attempt.title||'آزمون';document.getElementById('studentName').textContent=attempt.student_name||code;document.getElementById('questions').innerHTML=rows.map((x,i)=>'<p><b>'+(i+1)+') '+esc(x.question_text)+'</b></p>').join('')},300)}catch(e){console.error(e);$('status').textContent='DIAGNOSTIC: '+String(e.message||e)}}function init(){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);$('status').textContent='اتصال به پایگاه داده برقرار است.'}init();</script></main></body></html>
