<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border-radius:16px;padding:18px;margin:14px 0;box-shadow:0 3px 16px #0001}.q{border:1px solid #e5e7eb;border-radius:14px;padding:16px;margin:14px 0}.opt{display:block;border:1px solid #ddd;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;min-height:24px;touch-action:manipulation}.opt:has(input:checked){border-color:#3157d5;background:#f3f6ff}.opt input{margin-left:10px;transform:scale(1.2)}.btn{padding:12px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer;min-height:44px}.btn:disabled{opacity:.55}.err{color:#b42318}.ok{color:#176b3a}.muted{color:#667085}.result{font-size:18px;line-height:2}input[type=text]{padding:11px;border:1px solid #ddd;border-radius:8px;margin:6px 0;width:min(100%,360px);box-sizing:border-box}.sticky-submit{position:sticky;bottom:10px;background:#fff;padding:10px;border-radius:12px;box-shadow:0 2px 14px #0002}.timer{font-size:20px;font-weight:700}.timer.warn{color:#b42318}@media(max-width:600px){.wrap{padding:10px}.card{padding:14px}.q{padding:13px;margin:10px 0}.opt{padding:15px 12px}.sticky-submit{bottom:6px}}</style></head><body><main class="wrap"><section id="login" class="card"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود با لینک اختصاصی آزمون</p><p id="status" class="muted">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><br><input id="token" type="text" autocomplete="off"><br><label>کد دانش‌آموزی</label><br><input id="studentCode" type="text" autocomplete="off"><br><button id="startBtn" class="btn">شروع آزمون</button></section><section id="exam" class="card" hidden><div class="card"><h2 id="examTitle"></h2><p>دانش‌آموز: <b id="studentName"></b></p><p id="timer" class="timer"></p><p id="progress" class="muted"></p><p id="saveStatus" class="muted">پاسخ‌ها با انتخاب گزینه ذخیره می‌شوند.</p></div><div id="questions"></div><div class="sticky-submit"><button id="submitBtn" class="btn">ثبت نهایی آزمون</button></div></section><section id="result" class="card" hidden><h2>کارنامه آزمون</h2><div id="resultText" class="result"></div></section><script>const sb=supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));let attempt,questions=[],timerId,endAt,submitting=false,studentCode='';function groups(){const m=new Map();for(const x of questions){if(!m.has(x.id))m.set(x.id,{id:x.id,order:x.question_order,score:x.score,text:x.question_text,options:[]});m.get(x.id).options.push({id:x.option_id,key:x.option_key,text:x.option_text,sort:x.sort_order})}return [...m.values()].sort((a,b)=>a.order-b.order).map(q=>({...q,options:q.options.sort((a,b)=>a.sort-b.sort)}))}function progress(){const g=groups(),n=g.filter(q=>document.querySelector('input[name="q_'+q.id+'"]:checked')).length;$('progress').textContent='پاسخ داده‌شده: '+n+' از '+g.length}async function saveAnswer(e){if(submitting)return;const input=e.currentTarget;$('saveStatus').className='muted';$('saveStatus').textContent='در حال ذخیره پاسخ...';try{const r=await sb.rpc('v5_save_answer',{p_attempt_id:attempt.attempt_id,p_exam_question_id:Number(input.dataset.eq),p_selected_option_id:Number(input.value)});if(r.error)throw r.error;$('saveStatus').className='ok';$('saveStatus').textContent='پاسخ ذخیره شد.';progress()}catch(x){$('saveStatus').className='err';$('saveStatus').textContent='ذخیره پاسخ انجام نشد: '+(x.message||x)}}function render(saved){$('questions').innerHTML=groups().map((q,i)=>'<section class="q"><p><b>'+(i+1)+') '+esc(q.text)+'</b></p>'+q.options.map(o=>'<label class="opt"><input type="radio" name="q_'+q.id+'" value="'+o.id+'" data-eq="'+q.id+'"> <b>'+esc(o.key)+'</b> '+esc(o.text)+'</label>').join('')+'</section>').join('');document.querySelectorAll('input[type=radio]').forEach(e=>{e.addEventListener('change',saveAnswer);e.addEventListener('click',saveAnswer)});for(const a of saved||[]){const e=document.querySelector('input[name="q_'+a.exam_question_id+'"][value="'+a.selected_option_id+'"]');if(e)e.checked=true}progress()}async function state(){const r=await sb.rpc('v5_get_attempt_state',{p_attempt_id:attempt.attempt_id,p_student_code:studentCode});if(r.error)throw r.error;return r.data}function timer(st){const d=Number(st.duration_minutes||0);if(!d){$('timer').textContent='زمان آزمون: بدون محدودیت';return}endAt=new Date(st.started_at).getTime()+d*60000;const tick=()=>{const left=Math.max(0,Math.ceil((endAt-Date.now())/1000));$('timer').textContent='زمان باقی‌مانده: '+String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');$('timer').className=left<=60?'timer warn':'timer';if(left<=0){clearInterval(timerId);autoSubmit()}};tick();timerId=setInterval(tick,1000)}async function start(){const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code){$('status').className='err';$('status').textContent='توکن و کد دانش‌آموزی الزامی است.';return}studentCode=code;$('startBtn').disabled=true;try{const r=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(r.error)throw r.error;attempt=Array.isArray(r.data)?r.data[0]:r.data;const q=await sb.rpc('v5_get_exam_questions',{p_attempt_id:attempt.attempt_id,p_student_code:code});if(q.error)throw q.error;questions=q.data||[];const st=await state();if(st.status!=='started')throw new Error('این آزمون فعال نیست.');$('login').hidden=true;$('exam').hidden=false;$('examTitle').textContent=attempt.title||'آزمون';$('studentName').textContent=attempt.student_name||code;render(st.answers);timer(st)}catch(x){$('status').className='err';$('status').textContent='شروع آزمون انجام نشد: '+(x.message||x);$('startBtn').disabled=false}}async function autoSubmit(){await submit(true)}async function submit(force){if(!attempt||submitting)return;submitting=true;$('submitBtn').disabled=true;if(!force&&!confirm('آیا از ثبت نهایی آزمون مطمئن هستید؟')){submitting=false;$('submitBtn').disabled=false;return}try{const r=await sb.rpc('v5_submit_attempt',{p_attempt_id:attempt.attempt_id});if(r.error)throw r.error;const x=Array.isArray(r.data)?r.data[0]:r.data;clearInterval(timerId);$('exam').hidden=true;$('result').hidden=false;$('resultText').innerHTML='صحیح: <b>'+x.correct_answers+'</b> | غلط: <b>'+x.wrong_answers+'</b> | نزده: <b>'+x.unanswered_questions+'</b><br>درصد: <b>'+Number(x.percentage).toFixed(2)+'%</b><br><span class="ok">آزمون با موفقیت ثبت و تصحیح شد.</span>'}catch(x){submitting=false;$('submitBtn').disabled=false;$('saveStatus').className='err';$('saveStatus').textContent='ثبت نهایی انجام نشد: '+(x.message||x)}}const t=new URLSearchParams(location.search).get('token');if(t)$('token').value=t;$('startBtn').onclick=start;$('submitBtn').onclick=()=>submit(false);</script></main></body></html>
