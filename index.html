<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f4f6fb;color:#172033;margin:0}.wrap{max-width:1000px;margin:auto;padding:14px}.hero,.card{background:#fff;border-radius:18px;padding:20px;margin:14px 0}.hero{background:linear-gradient(135deg,#3157d5,#5b4bdc);color:#fff}.q{border-top:1px solid #eee;padding:18px 0}.opt{display:block;padding:10px;border:1px solid #eee;border-radius:10px;margin:7px 0}input[type=text]{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd;border-radius:10px;margin:6px 0 12px}button{padding:11px 18px;border:0;border-radius:10px;background:#3157d5;color:#fff;font-weight:700;cursor:pointer}.hidden{display:none}@media(max-width:700px){.wrap{padding:9px}.hero,.card{padding:14px}button{width:100%}}</style></head><body><div class="wrap"><header class="hero"><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><div>نسخه V5 — ورود با لینک اختصاصی آزمون</div></header><section id="login" class="card"><h2>ورود به آزمون</h2><p id="status">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><input id="token" type="text" autocomplete="off"><label>کد دانش‌آموزی</label><input id="studentCode" type="text" autocomplete="off"><button onclick="startExam()">شروع آزمون</button></section><section id="exam" class="card hidden"><h2 id="examTitle"></h2><p>دانش‌آموز: <b id="studentName"></b></p><div id="questions"></div><button onclick="submitExam()">ثبت نهایی آزمون</button></section><section id="report" class="card hidden"><h2>کارنامه آزمون</h2><p id="reportInfo"></p><p>درصد: <b id="pct"></b></p><p>صحیح: <b id="correct"></b> | غلط: <b id="wrong"></b> | نزده: <b id="blank"></b></p></section></div><script>const CONFIG={SUPABASE_URL:'https://rbqlblryxcaodvyrnfuo.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU'};let sb,attempt,questions=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));async function startExam(){const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code){$('status').textContent='توکن آزمون و کد دانش‌آموزی را وارد کنید.';return}$('status').textContent='در حال بررسی و بارگذاری آزمون...';try{const r=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(r.error)throw r.error;attempt=r.data;const q=await sb.rpc('v5_get_exam_questions',{p_attempt_id:attempt.attempt_id,p_student_code:code});if(q.error)throw q.error;const rows=q.data||[];if(!rows.length)throw new Error('EXAM_HAS_NO_QUESTIONS');const map=new Map();rows.forEach(x=>{if(!map.has(x.id))map.set(x.id,{id:x.id,question_order:x.question_order,score:x.score,question_id:x.question_id,question_text:x.question_text,options:[]});map.get(x.id).options.push({id:x.option_id,option_key:x.option_key,option_text:x.option_text,sort_order:x.sort_order})});questions=[...map.values()].sort((a,b)=>a.question_order-b.question_order);$('examTitle').textContent=attempt.title||'آزمون';$('studentName').textContent=attempt.student_name||code;$('questions').innerHTML=questions.map((q,i)=>`<article class="q"><p><b>${i+1}) ${esc(q.question_text)}</b></p>${q.options.sort((a,b)=>a.sort_order-b.sort_order).map(o=>`<label class="opt"><input type="radio" name="q-${q.id}" value="${o.id}"> ${esc(o.option_key)} ${esc(o.option_text)}</label>`).join('')}</article>`).join('');$('login').classList.add('hidden');$('exam').classList.remove('hidden')}catch(e){console.error(e);$('status').textContent='شروع آزمون انجام نشد. لطفاً اطلاعات را بررسی کنید.';alert('خطای فنی: '+String(e.message||e.details||e))}}async function submitExam(){if(!attempt)return;if(!confirm('پس از ثبت نهایی امکان تغییر پاسخ‌ها وجود ندارد. ادامه می‌دهید؟'))return;try{const selected=questions.map(q=>{const x=document.querySelector(`input[name="q-${q.id}"]:checked`);return x?{exam_question_id:q.id,selected_option_id:Number(x.value)}:null}).filter(Boolean);const s=await sb.rpc('v5_save_answers',{p_attempt_id:attempt.attempt_id,p_student_code:$('studentCode').value.trim(),p_answers:selected});if(s.error)throw s.error;const r=await sb.rpc('v5_submit_attempt',{p_attempt_id:attempt.attempt_id});if(r.error)throw r.error;const x=r.data?.[0]||r.data;$('exam').classList.add('hidden');$('report').classList.remove('hidden');$('reportInfo').textContent=`آزمون: ${attempt.title||''} — دانش‌آموز: ${attempt.student_name||''}`;$('pct').textContent=Number(x.percentage||0).toFixed(2)+'%';$('correct').textContent=x.correct_answers??0;$('wrong').textContent=x.wrong_answers??0;$('blank').textContent=x.unanswered_questions??0}catch(e){console.error(e);alert('ثبت نهایی آزمون انجام نشد: '+String(e.message||e.details||e))}}function init(){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);$('status').textContent='اتصال به پایگاه داده برقرار است.'}init();</script></body></html>
