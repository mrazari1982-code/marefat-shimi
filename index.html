<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>سامانه آزمون آنلاین دبیرستان معرفت | V5</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head>
<body><main><h1>سامانه آزمون آنلاین دبیرستان معرفت</h1><p>نسخه V5 — ورود با لینک اختصاصی آزمون</p><section id="login"><p id="status">در حال آماده‌سازی...</p><label>توکن لینک آزمون</label><input id="token"><label>کد دانش‌آموزی</label><input id="studentCode"><button onclick="startExam()">شروع آزمون</button></section><section id="exam" hidden><h2 id="examTitle"></h2><p>دانش‌آموز: <b id="studentName"></b></p><div id="questions"></div><button onclick="submitExam()">ثبت نهایی آزمون</button></section><section id="report" hidden><h2>کارنامه آزمون</h2><p id="reportInfo"></p><p>درصد: <b id="pct"></b></p><p>صحیح: <b id="correct"></b> | غلط: <b id="wrong"></b> | نزده: <b id="blank"></b></p></section></main>
<script>
const CONFIG={SUPABASE_URL:'https://rbqlblryxcaodvyrnfuo.supabase.co',SUPABASE_ANON_KEY:'sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU'};let sb,attempt,questions=[];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function status(t){$('status').textContent=t}
async function startExam(){const token=$('token').value.trim(),code=$('studentCode').value.trim();if(!token||!code)return status('توکن آزمون و کد دانش‌آموزی را وارد کنید.');status('در حال بررسی لینک و شروع آزمون...');try{const r=await sb.rpc('v5_start_exam',{p_token:token,p_student_code:code});if(r.error)throw r.error;attempt=r.data;const q=await sb.rpc('v5_get_exam_questions',{p_attempt_id:attempt.attempt_id,p_student_code:code});if(q.error)throw q.error;const rows=q.data||[];const map=new Map();for(const x of rows){if(!map.has(x.id))map.set(x.id,{id:x.id,question_order:x.question_order,score:x.score,question:{id:x.question_id,question_text:x.question_text},options:[]});map.get(x.id).options.push({id:x.option_id,option_key:x.option_key,option_text:x.option_text,sort_order:x.sort_order})}questions=[...map.values()].sort((a,b)=>a.question_order-b.question_order);if(!questions.length)throw new Error('EXAM_HAS_NO_QUESTIONS');$('examTitle').textContent=attempt.title;$('studentName').textContent=attempt.student_name;$('questions').innerHTML=questions.map((q,i)=>`<article><p><b>${i+1}) ${esc(q.question.question_text)}</b></p>${q.options.sort((a,b)=>a.sort_order-b.sort_order).map(o=>`<label><input type="radio" name="q-${q.id}" value="${o.id}"> ${esc(o.option_key)} ${esc(o.option_text)}</label><br>`).join('')}</article>`).join('');$('login').hidden=true;$('exam').hidden=false}catch(e){console.error(e);status(errorText(e))}}
function errorText(e){const m=String(e?.message||e?.details||e||'');if(m.includes('INVALID_OR_EXPIRED_EXAM_LINK'))return 'لینک آزمون نامعتبر یا منقضی شده است.';if(m.includes('EXAM_NOT_AVAILABLE'))return 'این آزمون در حال حاضر منتشر نشده است.';if(m.includes('EXAM_NOT_STARTED'))return 'زمان شروع آزمون هنوز نرسیده است.';if(m.includes('EXAM_CLOSED'))return 'زمان آزمون به پایان رسیده است.';if(m.includes('STUDENT_NOT_FOUND'))return 'کد دانش‌آموزی معتبر نیست یا دانش‌آموز فعال نیست.';if(m.includes('MAX_ATTEMPTS_REACHED'))return 'حداکثر دفعات شرکت شما در این آزمون تکمیل شده است.';return 'شروع آزمون انجام نشد. لطفاً اطلاعات را بررسی کنید.'}
function answers(){return questions.map(q=>{const x=document.querySelector(`input[name="q-${q.id}"]:checked`);return x?{exam_question_id:q.id,selected_option_id:Number(x.value)}:null}).filter(Boolean)}
async function submitExam(){if(!attempt)return;if(!confirm('پس از ثبت نهایی امکان تغییر پاسخ‌ها وجود ندارد. ادامه می‌دهید؟'))return;try{const s=await sb.rpc('v5_save_answers',{p_attempt_id:attempt.attempt_id,p_student_code:$('studentCode').value.trim(),p_answers:answers()});if(s.error)throw s.error;const r=await sb.rpc('v5_submit_attempt',{p_attempt_id:attempt.attempt_id});if(r.error)throw r.error;const x=r.data?.[0]||r.data;$('exam').hidden=true;$('report').hidden=false;$('reportInfo').textContent=`آزمون: ${attempt.title} — دانش‌آموز: ${attempt.student_name}`;$('pct').textContent=Number(x.percentage||0).toFixed(2)+'%';$('correct').textContent=x.correct_answers??0;$('wrong').textContent=x.wrong_answers??0;$('blank').textContent=x.unanswered_questions??0}catch(e){console.error(e);alert('ثبت نهایی آزمون انجام نشد.')}}
function init(){sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);$('status').textContent='اتصال به پایگاه داده برقرار است.'}init();
</script></body></html>
