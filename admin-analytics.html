<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تحلیل آموزشی | سامانه آزمون معرفت</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Tahoma,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border-radius:16px;padding:20px;margin:16px 0;box-shadow:0 3px 16px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{font-size:24px;font-weight:800}.muted{color:#667085}.err{color:#b42318}select{padding:9px;border:1px solid #ddd;border-radius:8px}table{width:100%;border-collapse:collapse}th,td{padding:10px;border-bottom:1px solid #eee;text-align:right}.bar{height:12px;background:#e7ebf3;border-radius:8px;overflow:hidden}.fill{height:100%;background:#3157d5}</style></head><body><div class="wrap"><section class="card"><h1>تحلیل آموزشی</h1><p id="who" class="muted">در حال بررسی نشست...</p><a href="admin-panel.html">بازگشت به پنل</a></section><section id="app"><div class="card"><label>آزمون: <select id="exam"><option value="">همه آزمون‌ها</option></select></label></div><div class="grid"><div class="card"><div id="n" class="stat">—</div><div class="muted">تعداد شرکت</div></div><div class="card"><div id="avg" class="stat">—</div><div class="muted">میانگین درصد</div></div><div class="card"><div id="max" class="stat">—</div><div class="muted">بالاترین درصد</div></div><div class="card"><div id="min" class="stat">—</div><div class="muted">پایین‌ترین درصد</div></div></div><section class="card"><h2>عملکرد دانش‌آموزان</h2><table><thead><tr><th>دانش‌آموز</th><th>درصد</th><th>صحیح</th><th>غلط</th><th>نزده</th><th>سطح</th></tr></thead><tbody id="students"></tbody></table></section><section class="card"><h2>تحلیل سؤال‌ها</h2><p id="qmsg" class="muted">در حال بارگذاری...</p><table><thead><tr><th>سؤال</th><th>تعداد پاسخ</th><th>صحیح</th><th>درصد موفقیت</th></tr></thead><tbody id="questions"></tbody></table></section></section></div><script>const sb=window.supabase.createClient('https://rbqlblryxcaodvyrnfuo.supabase.co','sb_publishable_iJkwgMHRaBQjFhk_0QSU1w_aSKWG1mU');const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let exams=[];async function init(){const s=await sb.auth.getSession(),session=s.data.session;if(!session){location.href='admin-login-v2.html';return}const staff=await sb.rpc('v5_is_staff');if(staff.error||staff.data!==true){await sb.auth.signOut();location.href='admin-login-v2.html';return}$('who').textContent='مدیر: '+(session.user.email||'');const er=await sb.from('v5_exams').select('id,title').order('id',{ascending:false});if(er.error){$('qmsg').className='err';$('qmsg').textContent=er.error.message;return}exams=er.data||[];$('exam').innerHTML='<option value="">همه آزمون‌ها</option>'+exams.map(x=>'<option value="'+x.id+'">'+esc(x.title)+'</option>').join('');$('exam').onchange=load;await load()}function level(p){p=Number(p||0);return p>=80?'عالی':p>=60?'خوب':p>=40?'نیازمند تمرین':'نیازمند تقویت'}async function load(){const id=$('exam').value;let q=sb.from('v5_attempts').select('id,exam_id,student_id,correct_count,wrong_count,blank_count,percentage,status').order('percentage',{ascending:false});if(id)q=q.eq('exam_id',id);const ar=await q.limit(500);if(ar.error){$('qmsg').className='err';$('qmsg').textContent=ar.error.message;return}const rows=ar.data||[],vals=rows.map(x=>Number(x.percentage||0));$('n').textContent=rows.length;$('avg').textContent=rows.length?(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2)+'%':'0%';$('max').textContent=rows.length?Math.max(...vals).toFixed(2)+'%':'0%';$('min').textContent=rows.length?Math.min(...vals).toFixed(2)+'%':'0%';const st=await sb.from('v5_students').select('id,full_name');const sm=new Map((st.data||[]).map(x=>[x.id,x.full_name]));$('students').innerHTML=rows.map(x=>'<tr><td>'+esc(sm.get(x.student_id)||('دانش‌آموز '+x.student_id))+'</td><td>'+Number(x.percentage||0).toFixed(2)+'%</td><td>'+x.correct_count+'</td><td>'+x.wrong_count+'</td><td>'+x.blank_count+'</td><td>'+level(x.percentage)+'</td></tr>').join('');let aq=sb.from('v5_attempt_answers').select('exam_question_id,is_correct,attempt_id');if(id){aq=aq.in('attempt_id',rows.map(x=>x.id).length?rows.map(x=>x.id):[-1])}else if(rows.length===0){aq=aq.eq('attempt_id',-1)}const ans=await aq;const groups=new Map();(ans.data||[]).forEach(x=>{let g=groups.get(x.exam_question_id)||{n:0,c:0};g.n++;if(x.is_correct)g.c++;groups.set(x.exam_question_id,g)});$('qmsg').textContent=groups.size?'':'داده‌ای برای تحلیل سؤال‌ها وجود ندارد.';$('questions').innerHTML=[...groups.entries()].map(([qid,g])=>{const p=g.n?g.c/g.n*100:0;return '<tr><td>'+esc(qid)+'</td><td>'+g.n+'</td><td>'+g.c+'</td><td><div class="bar"><div class="fill" style="width:'+p.toFixed(1)+'%"></div></div>'+p.toFixed(1)+'%</td></tr>'}).join('')}init();</script></body></html>
